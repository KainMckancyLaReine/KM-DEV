function cellHTML(p, r){
    const v = r.cells[p.id];
    switch(p.type){
        case 'select': return `<div class="tag-wrap" data-sel="${p.id}">${v ? tagHTML(v, p.colors?.[v]) : '<span style="color:var(--text-faint);font-size:13px;">—</span>'}</div>`;
        case 'multi':  return `<div class="tag-wrap" data-multi="${p.id}">${(v||[]).map(x => tagHTML(x, p.colors?.[x])).join('') || '<span style="color:var(--text-faint);font-size:13px;">—</span>'}</div>`;
        case 'check':  return `<div class="tag-wrap" data-check="${p.id}"><span class="cb ${v?'on':''}" style="margin-top:1px;"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span></div>`;
        case 'date':   return `<div class="cell" data-date="${p.id}" style="cursor:pointer;">${v ? fmtDate(v) : '<span style="color:var(--text-faint);">—</span>'}</div>`;
        case 'url':    return `<div class="cell" contenteditable="true" data-f="${p.id}">${esc(v||'')}</div>`;
        case 'number': return `<div class="cell" contenteditable="true" data-f="${p.id}" style="font-family:'Space Mono',monospace;">${esc(v||'')}</div>`;
        default:       return `<div class="cell" contenteditable="true" data-f="${p.id}">${esc(v||'')}</div>`;
    }
}
function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.getDate() + ' ' + NL_MONTHS[d.getMonth()].slice(0,3) + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function bindCells(db, host){
    host.querySelectorAll('[data-f]').forEach(el => {
        const tr = el.closest('tr'); if(!tr) return;
        const r = db.rows.find(x => x.id === tr.dataset.row); if(!r) return;
        const f = el.dataset.f;
        el.addEventListener('blur', () => {
            const val = el.textContent.trim();
            if(f === 'title') r.title = val; else r.cells[f] = val;
            touch(db);
        });
        el.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
    });
    host.querySelectorAll('[data-sel]').forEach(el => {
        const tr = el.closest('tr'); const r = db.rows.find(x => x.id === tr.dataset.row);
        el.onclick = e => selectMenu(db, db.props.find(p => p.id === el.dataset.sel), r, e.currentTarget, false);
    });
    host.querySelectorAll('[data-multi]').forEach(el => {
        const tr = el.closest('tr'); const r = db.rows.find(x => x.id === tr.dataset.row);
        el.onclick = e => selectMenu(db, db.props.find(p => p.id === el.dataset.multi), r, e.currentTarget, true);
    });
    host.querySelectorAll('[data-check]').forEach(el => {
        const tr = el.closest('tr'); const r = db.rows.find(x => x.id === tr.dataset.row);
        el.onclick = () => { const id = el.dataset.check; r.cells[id] = !r.cells[id]; touch(db); drawView(db); };
    });
    host.querySelectorAll('[data-date]').forEach(el => {
        const tr = el.closest('tr'); const r = db.rows.find(x => x.id === tr.dataset.row);
        el.onclick = () => datePicker(el, r.cells[el.dataset.date], v => { r.cells[el.dataset.date] = v; touch(db); drawView(db); });
    });
}
function delRow(db, rowId){
    const i = db.rows.findIndex(r => r.id === rowId); if(i < 0) return;
    const [gone] = db.rows.splice(i,1); touch(db); drawView(db);
    toast('Rij verwijderd', 'Ongedaan maken', () => { db.rows.splice(i,0,gone); touch(db); drawView(db); });
}

/* ---------- select/multi menu ---------- */
function selectMenu(db, prop, row, anchor, multi){
    if(!prop) return;
    prop.options = prop.options || [];
    prop.colors = prop.colors || {};
    const cur_ = multi ? (row.cells[prop.id] || []) : row.cells[prop.id];
    const m = $('#ctxMenu');
    const draw = () => {
        m.innerHTML = `<input class="menu-search" placeholder="Zoek of maak nieuw…" data-keepmenu id="optQ">
            <div class="menu-grp">Opties</div>
            ${prop.options.map(o => `<button class="mi" data-o="${esc(o)}">
                <span style="flex:1;">${tagHTML(o, prop.colors[o])}</span>
                ${ (multi ? cur_.includes(o) : cur_ === o) ? '<span class="mi-kbd">✓</span>' : '' }
                <span class="mi-kbd" data-rm="${esc(o)}" title="Optie verwijderen">✕</span>
            </button>`).join('')}
            <div class="menu-sep"></div>
            <button class="mi" data-clear><span class="mi-txt"><b>Leegmaken</b></span></button>`;
        m.querySelectorAll('[data-o]').forEach(b => b.onclick = e => {
            e.stopPropagation();
            if(e.target.dataset.rm !== undefined){
                prop.options = prop.options.filter(x => x !== e.target.dataset.rm);
                db.rows.forEach(r => {
                    if(Array.isArray(r.cells[prop.id])) r.cells[prop.id] = r.cells[prop.id].filter(x => x !== e.target.dataset.rm);
                    else if(r.cells[prop.id] === e.target.dataset.rm) r.cells[prop.id] = '';
                });
                touch(db); draw(); drawView(db); return;
            }
            const val = b.dataset.o;
            if(multi){
                const arr = row.cells[prop.id] || [];
                row.cells[prop.id] = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
                touch(db); drawView(db); draw();
            }else{
                row.cells[prop.id] = val; touch(db); closeMenus(); drawView(db);
            }
        });
        m.querySelector('[data-clear]').onclick = e => { e.stopPropagation(); row.cells[prop.id] = multi ? [] : ''; touch(db); closeMenus(); drawView(db); };
        const q = m.querySelector('#optQ');
        q.onkeydown = e => {
            if(e.key === 'Enter'){
                e.preventDefault();
                const val = q.value.trim(); if(!val) return;
                if(!prop.options.includes(val)){ prop.options.push(val); prop.colors[val] = colorFor(val); }
                if(multi){ const arr = row.cells[prop.id] || []; if(!arr.includes(val)) arr.push(val); row.cells[prop.id] = arr; }
                else row.cells[prop.id] = val;
                touch(db); q.value=''; draw(); drawView(db);
            }
        };
        setTimeout(() => q.focus(), 20);
    };
    draw();
    placeMenu(m, anchor);
}

/* ---------- property config ---------- */
function addPropMenu(db, anchor){

        { group:'Nieuwe eigenschap' },
        ...PROP_TYPES.map(t => ({ label:t.label, icon:t.icon, run:() => {
            const p = { id:uid(), name:t.label, type:t.t, options:[], colors:{} };
            db.props.push(p);
            db.rows.forEach(r => r.cells[p.id] = t.t === 'multi' ? [] : (t.t === 'check' ? false : ''));
            touch(db); drawView(db);
        }}))
    ]);
}
function propMenu(db, propId, anchor){
    const p = db.props.find(x => x.id === propId); if(!p) return;
    const m = $('#ctxMenu');
    m.innerHTML = `<input class="menu-search" value="${esc(p.name)}" id="propName" data-keepmenu>
        <div class="menu-grp">Type</div>
        ${PROP_TYPES.map(t => `<button class="mi" data-t="${t.t}"><span class="mi-ico">${t.icon}</span><span class="mi-txt"><b>${t.label}</b></span>${p.type===t.t?'<span class="mi-kbd">✓</span>':''}</button>`).join('')}
        <div class="menu-sep"></div>
        <button class="mi" data-sort-asc><span class="mi-ico">↑</span><span class="mi-txt"><b>Sorteer oplopend</b></span></button>
        <button class="mi" data-sort-desc><span class="mi-ico">↓</span><span class="mi-txt"><b>Sorteer aflopend</b></span></button>
        ${['select','multi'].includes(p.type) ? '<button class="mi" data-group><span class="mi-ico">▤</span><span class="mi-txt"><b>Groepeer board hierop</b></span></button>' : ''}
        ${p.type==='date' ? '<button class="mi" data-cal><span class="mi-ico">📅</span><span class="mi-txt"><b>Gebruik voor kalender</b></span></button>' : ''}
        <div class="menu-sep"></div>

    nameInp.onkeydown = e => { if(e.key==='Enter'){ closeMenus(); drawView(db); } };
    m.querySelectorAll('[data-t]').forEach(b => b.onclick = e => {
        e.stopPropagation(); p.type = b.dataset.t;
        if(['select','multi'].includes(p.type)){ p.options = p.options || []; p.colors = p.colors || {}; }
        db.rows.forEach(r => {
            const v = r.cells[p.id];
            if(p.type === 'multi' && !Array.isArray(v)) r.cells[p.id] = v ? [String(v)] : [];
            if(p.type !== 'multi' && Array.isArray(v)) r.cells[p.id] = v[0] || '';
        });
        touch(db); closeMenus(); drawView(db);
    });
    m.querySelector('[data-sort-asc]').onclick = e => { e.stopPropagation(); db.sortBy=p.id; db.sortDir='asc'; touch(db); closeMenus(); drawView(db); };
    m.querySelector('[data-sort-desc]').onclick = e => { e.stopPropagation(); db.sortBy=p.id; db.sortDir='desc'; touch(db); closeMenus(); drawView(db); };
    if(m.querySelector('[data-group]')) m.querySelector('[data-group]').onclick = e => { e.stopPropagation(); db.groupBy=p.id; touch(db); closeMenus(); drawView(db); toast('Board groepeert nu op ' + p.name); };
    if(m.querySelector('[data-cal]')) m.querySelector('[data-cal]').onclick = e => { e.stopPropagation(); db.dateProp=p.id; touch(db); closeMenus(); drawView(db); toast('Kalender gebruikt nu ' + p.name); };
    m.querySelector('[data-del]').onclick = e => {
        e.stopPropagation();
        db.props = db.props.filter(x => x.id !== p.id);
        db.rows.forEach(r => delete r.cells[p.id]);
        if(db.groupBy === p.id) db.groupBy = (db.props.find(x => x.type==='select')||{}).id || null;
        touch(db); closeMenus(); drawView(db);
    };
    placeMenu(m, anchor);
}
function propsMenu(db, anchor){
    showMenu(anchor, [
        { group:'Eigenschappen' },
        ...db.props.map(p => ({ label:p.name, icon:propIcon(p.type), sub:(PROP_TYPES.find(t=>t.t===p.type)||{}).label, run:() => propMenu(db, p.id, anchor) })),
        { sep:true },

/* ---------- date picker ---------- */
function datePicker(anchor, value, cb){
    const m = $('#ctxMenu');
    let view = value ? new Date(value + 'T00:00:00') : new Date();
    const draw = () => {
        const y = view.getFullYear(), mo = view.getMonth();
        const first = new Date(y, mo, 1);
        let start = (first.getDay() + 6) % 7;
        const days = new Date(y, mo+1, 0).getDate();
        let cells = '';
        for(let i=0;i<start;i++) cells += '<span></span>';
        for(let d=1; d<=days; d++){
            const iso = y + '-' + String(mo+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            const sel = iso === value, tod = iso === todayISO();
            cells += `<button class="mi" data-d="${iso}" style="justify-content:center;padding:5px 0;font-size:13px;${sel?'background:var(--blue);color:#fff;':(tod?'font-weight:700;color:var(--blue);':'')}">${d}</button>`;
        }
        m.innerHTML = `<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;">
                <button class="mi" data-prev style="width:auto;padding:4px 8px;">‹</button>
                <b style="flex:1;text-align:center;font-size:13.5px;">${NL_MONTHS[mo]} ${y}</b>
                <button class="mi" data-next style="width:auto;padding:4px 8px;">›</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 6px 6px;">
                ${NL_DOW.map(d => `<span style="text-align:center;font-size:10.5px;color:var(--text-faint);padding:3px 0;">${d}</span>`).join('')}
                ${cells}
            </div>
            <div class="menu-sep"></div>
            <button class="mi" data-today><span class="mi-txt"><b>Vandaag</b></span></button>
            <button class="mi" data-clear><span class="mi-txt"><b>Wissen</b></span></button>`;
        m.querySelectorAll('[data-d]').forEach(b => b.onclick = e => { e.stopPropagation(); closeMenus(); cb(b.dataset.d); });
        m.querySelector('[data-prev]').onclick = e => { e.stopPropagation(); view = new Date(y, mo-1, 1); draw(); };
        m.querySelector('[data-next]').onclick = e => { e.stopPropagation(); view = new Date(y, mo+1, 1); draw(); };
        m.querySelector('[data-today]').onclick = e => { e.stopPropagation(); closeMenus(); cb(todayISO()); };
        m.querySelector('[data-clear]').onclick = e => { e.stopPropagation(); closeMenus(); cb(''); };
    };
    draw();
    placeMenu(m, anchor);
}

/* ---------- board ---------- */
function boardView(db, host){
    let gp = db.props.find(p => p.id === db.groupBy) || db.props.find(p => p.type === 'select');
    if(!gp){
        host.innerHTML = '<div class="empty-note">Voeg een selectie-eigenschap toe om een board te maken.<br><br><button class="btn-new" id="mkSel">＋ Statuseigenschap toevoegen</button></div>';
        host.querySelector('#mkSel').onclick = () => {
            const p = { id:uid(), name:'Status', type:'select', options:['Te doen','Bezig','Klaar'], colors:{} };
            db.props.push(p); db.groupBy = p.id;
            db.rows.forEach(r => r.cells[p.id] = 'Te doen');
            touch(db); drawView(db);
        };
        return;
    }
    db.groupBy = gp.id;
    const rows = visibleRows(db);
    const cols = [...(gp.options||[]), '__none'];
    host.innerHTML = `<div class="board">${cols.map(c => {
        const items = rows.filter(r => (r.cells[gp.id] || '') === (c === '__none' ? '' : c));
        const label = c === '__none' ? 'Geen status' : c;
        return `<div class="col" data-col="${esc(c)}">
            <div class="col-hdr">
                ${c === '__none' ? `<span style="color:var(--text-faint);font-size:13.5px;font-weight:600;">${label}</span>` : tagHTML(label, gp.colors?.[c])}
                <span class="col-count">${items.length}</span>
                <button class="icon-btn" data-colmenu="${esc(c)}">⋯</button>
            </div>
            <div class="col-body">
                ${items.map(r => kcardHTML(db, r, gp)).join('')}
            </div>
            <button class="col-add" data-coladd="${esc(c)}">＋ Nieuw</button>
        </div>`;
    }).join('')}
    <button class="col-add" id="addCol" style="flex:0 0 160px;padding:12px;">＋ Kolom</button></div>`;

    host.querySelectorAll('[data-card]').forEach(el => {
        el.onclick = () => openPeek(db, db.rows.find(r => r.id === el.dataset.card));
        el.draggable = true;
        el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/card', el.dataset.card); el.classList.add('dragging'); });
        el.addEventListener('dragend', () => el.classList.remove('dragging'));
    });
    host.querySelectorAll('.col').forEach(col => {
        col.addEventListener('dragover', e => { if(e.dataTransfer.types.includes('text/card')){ e.preventDefault(); col.classList.add('drag-over'); } });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
            e.preventDefault(); col.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/card');
            const r = db.rows.find(x => x.id === id); if(!r) return;
            const c = col.dataset.col;
            r.cells[gp.id] = c === '__none' ? '' : c;
            touch(db); drawView(db);
        });
    });
    host.querySelectorAll('[data-coladd]').forEach(b => b.onclick = () => {
        const c = b.dataset.coladd;
        const r = newRow(db); r.cells[gp.id] = c === '__none' ? '' : c;
        db.rows.push(r); touch(db); drawView(db); openPeek(db, r);
    });
    host.querySelectorAll('[data-colmenu]').forEach(b => b.onclick = e => {
        e.stopPropagation();
        const c = b.dataset.colmenu;
        showMenu(b, [
            { label:'Kolom hernoemen', icon:'✏️', run:() => {
                const nv = prompt('Nieuwe naam', c); if(!nv) return;
                gp.options = gp.options.map(o => o === c ? nv : o);
                db.rows.forEach(r => { if(r.cells[gp.id] === c) r.cells[gp.id] = nv; });
                touch(db); drawView(db);
            }},
            { label:'Kolom verwijderen', icon:'🗑️', danger:true, run:() => {
                gp.options = gp.options.filter(o => o !== c);
                db.rows.forEach(r => { if(r.cells[gp.id] === c) r.cells[gp.id] = ''; });
                touch(db); drawView(db);
            }}
        ]);
    });
    host.querySelector('#addCol').onclick = () => {
        const nv = prompt('Naam van de kolom'); if(!nv) return;
        gp.options = gp.options || []; gp.options.push(nv); gp.colors = gp.colors || {}; gp.colors[nv] = colorFor(nv);
        touch(db); drawView(db);
    };
}
function kcardHTML(db, r, gp){
    const dp = db.props.find(p => p.id === db.dateProp);
    const others = db.props.filter(p => p.id !== gp.id && ['select','multi'].includes(p.type));
    let meta = '';
    others.forEach(p => {
        const v = r.cells[p.id];
        if(Array.isArray(v)) meta += v.map(x => tagHTML(x, p.colors?.[x])).join('');
        else if(v) meta += tagHTML(v, p.colors?.[v]);
    });
    if(dp && r.cells[dp.id]) meta += `<span class="kdate">📅 ${fmtDate(r.cells[dp.id])}</span>`;
    return `<div class="kcard" data-card="${r.id}">
        <div class="kt">${esc(r.title || 'Naamloos')}</div>
        ${meta ? `<div class="kmeta">${meta}</div>` : ''}
    </div>`;
}

/* ---------- calendar ---------- */
function calendarView(db, host){
    let dp = db.props.find(p => p.id === db.dateProp) || db.props.find(p => p.type === 'date');
    if(!dp){
        host.innerHTML = '<div class="empty-note">Voeg een datum-eigenschap toe voor de kalenderweergave.<br><br><button class="btn-new" id="mkDate">＋ Datum toevoegen</button></div>';
        host.querySelector('#mkDate').onclick = () => {
            const p = { id:uid(), name:'Datum', type:'date' };
            db.props.push(p); db.dateProp = p.id;
            db.rows.forEach(r => r.cells[p.id] = '');
            touch(db); drawView(db);
        };
        return;
    }
    db.dateProp = dp.id;
    db._cal = db._cal || todayISO().slice(0,7);
    const [Y,M] = db._cal.split('-').map(Number);
    const first = new Date(Y, M-1, 1);
    const start = (first.getDay()+6)%7;
    const days = new Date(Y, M, 0).getDate();
    const prevDays = new Date(Y, M-1, 0).getDate();
    const rows = visibleRows(db);
    const byDate = {};
    rows.forEach(r => { const d = r.cells[dp.id]; if(d) (byDate[d] = byDate[d] || []).push(r); });
    const gp = db.props.find(p => p.id === db.groupBy);

    let cells = '';
    for(let i=start-1;i>=0;i--) cells += dayCell(Y, M-1, prevDays-i, true, byDate, gp, db);
    for(let d=1;d<=days;d++) cells += dayCell(Y, M, d, false, byDate, gp, db);
    const total = start + days;
    for(let d=1; d <= (42-total > 6 ? 7-(total%7)%7 : 42-total); d++) cells += dayCell(Y, M+1, d, true, byDate, gp, db);

    host.innerHTML = `<div class="calbar">
            <h3>${NL_MONTHS[M-1]} ${Y}</h3>
            <button class="chip" id="calPrev">‹</button>
            <button class="chip" id="calToday">Vandaag</button>
            <button class="chip" id="calNext">›</button>
        </div>
        <div class="cal">${NL_DOW.map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div>`;

    host.querySelector('#calPrev').onclick = () => { const d = new Date(Y, M-2, 1); db._cal = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); drawView(db); };
    host.querySelector('#calNext').onclick = () => { const d = new Date(Y, M, 1); db._cal = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); drawView(db); };
    host.querySelector('#calToday').onclick = () => { db._cal = todayISO().slice(0,7); drawView(db); };
    host.querySelectorAll('[data-ev]').forEach(el => el.onclick = e => { e.stopPropagation(); openPeek(db, db.rows.find(r => r.id === el.dataset.ev)); });
    host.querySelectorAll('[data-day]').forEach(el => el.onclick = () => {
        const r = newRow(db); r.cells[dp.id] = el.dataset.day; r.title = '';
        db.rows.push(r); touch(db); drawView(db); openPeek(db, r);
    });
}
function dayCell(Y, M, d, other, byDate, gp, db){
    const dt = new Date(Y, M-1, d);
    const iso = todayISO(dt);
    const evs = byDate[iso] || [];
    return `<div class="day ${other?'other':''} ${iso===todayISO()?'today':''}" data-day="${iso}">
        <div class="dnum">${dt.getDate()}</div>
        ${evs.map(r => {
            const v = gp ? r.cells[gp.id] : '';

let peekCtx = null;
function openPeek(db, row){
    if(!row) return;
    peekCtx = { db, row };
    $('#peekLbl').textContent = db.title;
    const body = $('#peekBody');
    body.innerHTML = `
        <h1 class="title" id="peekTitle" contenteditable="true" spellcheck="false" style="font-size:31px;">${esc(row.title)}</h1>
        <div style="margin:18px 0 8px;" id="peekProps"></div>
        <div style="height:1px;background:var(--line);margin:14px 0 18px;"></div>
        <div id="peekBlocks"></div>`;
    const t = $('#peekTitle');
    t.oninput = () => { row.title = t.textContent; touch(db); };
    t.onblur = () => { row.title = t.textContent.trim(); touch(db); drawView(db); };
    drawPeekProps();
    // blocks inside the row
    row.blocks = row.blocks && row.blocks.length ? row.blocks : [blankBlock()];
    const fakePage = { id: db.id, type:'page', blocks: row.blocks, children:[], title: row.title };
    renderBlocks(fakePage, $('#peekBlocks'), row.blocks);
    $('#peek').classList.add('on');
    setTimeout(() => { if(!row.title) { t.focus(); } }, 220);
}
function drawPeekProps(){
    if(!peekCtx) return;
    const { db, row } = peekCtx;
    const host = $('#peekProps');
    host.innerHTML = db.props.map(p => {
        const v = row.cells[p.id];
        let val;
        if(p.type === 'select') val = `<div class="prop-val" data-sel="${p.id}">${v ? tagHTML(v, p.colors?.[v]) : '<span class="ph">Leeg</span>'}</div>`;
        else if(p.type === 'multi') val = `<div class="prop-val" data-multi="${p.id}">${(v||[]).map(x => tagHTML(x, p.colors?.[x])).join('') || '<span class="ph">Leeg</span>'}</div>`;
        else if(p.type === 'date') val = `<div class="prop-val" data-date="${p.id}">${v ? fmtDate(v) : '<span class="ph">Leeg</span>'}</div>`;
        else if(p.type === 'check') val = `<div class="prop-val" data-check="${p.id}"><span class="cb ${v?'on':''}" style="margin-top:1px;"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span></div>`;
        else val = `<div class="prop-val" contenteditable="true" data-f="${p.id}">${esc(v||'')}</div>`;
        return `<div class="prop-row">
            <div class="prop-key" data-pk="${p.id}"><span>${propIcon(p.type)}</span> ${esc(p.name)}</div>
            ${val}
        </div>`;
    }).join('') + `<div class="prop-row"><div class="prop-key" id="peekAddProp" style="color:var(--text-faint);">＋ Eigenschap toevoegen</div></div>`;

    host.querySelectorAll('[data-f]').forEach(el => el.onblur = () => { row.cells[el.dataset.f] = el.textContent.trim(); touch(db); drawView(db); });
    host.querySelectorAll('[data-sel]').forEach(el => el.onclick = e => selectMenu(db, db.props.find(p => p.id === el.dataset.sel), row, e.currentTarget, false));
    host.querySelectorAll('[data-multi]').forEach(el => el.onclick = e => selectMenu(db, db.props.find(p => p.id === el.dataset.multi), row, e.currentTarget, true));
    host.querySelectorAll('[data-date]').forEach(el => el.onclick = () => datePicker(el, row.cells[el.dataset.date], v => { row.cells[el.dataset.date] = v; touch(db); drawPeekProps(); drawView(db); }));
    host.querySelectorAll('[data-check]').forEach(el => el.onclick = () => { row.cells[el.dataset.check] = !row.cells[el.dataset.check]; touch(db); drawPeekProps(); drawView(db); });
    host.querySelectorAll('[data-pk]').forEach(el => el.onclick = e => propMenu(db, el.dataset.pk, e.currentTarget));
    host.querySelector('#peekAddProp').onclick = e => addPropMenu(db, e.currentTarget);
    // re-render props after menus change things
    const obs = () => drawPeekProps();
    peekCtx.refresh = obs;
}
function closePeek(){
    $('#peek').classList.remove('on');
    if(peekCtx){ drawView(peekCtx.db); peekCtx = null; }
}
$('#peekClose').onclick = closePeek;
$('#peekDel').onclick = () => {
    if(!peekCtx) return;
    const { db, row } = peekCtx;
    const i = db.rows.findIndex(r => r.id === row.id);
    if(i >= 0){ db.rows.splice(i,1); touch(db); }
    closePeek();
    toast('Item verwijderd');
};

let searchPick = null;
function openSearch(pickMode, cb){
    searchPick = pickMode ? (cb || null) : null;
    $('#searchOverlay').classList.add('on');
    const inp = $('#searchInput');
    inp.value = ''; inp.placeholder = pickMode ? 'Kies een pagina…' : 'Zoek in je workspace…';
    drawSearch('');
    setTimeout(() => inp.focus(), 40);
}
function closeSearch(){ $('#searchOverlay').classList.remove('on'); searchPick = null; }
function searchHits(q){
    q = q.toLowerCase().trim();
    const hits = [];
    allPages().forEach(p => {
        const path = pathOf(p.id).slice(0,-1).map(x => x.title || 'Naamloos').join(' / ');
        if(!q || (p.title||'').toLowerCase().includes(q)) hits.push({ icon:p.icon||'📄', title:p.title||'Naamloos', sub:path || 'Privé', id:p.id });
        if(q && !searchPick){
            (p.blocks||[]).forEach(b => {
                const txt = stripTags(b.x);
                if(txt && txt.toLowerCase().includes(q)) hits.push({ icon:'¶', title:txt.slice(0,72), sub:'in ' + (p.title||'Naamloos'), id:p.id });
            });
            (p.rows||[]).forEach(r => {
                if((r.title||'').toLowerCase().includes(q)) hits.push({ icon:'▦', title:r.title, sub:'in ' + (p.title||'Naamloos'), id:p.id, row:r.id });
            });
        }
    });
    return hits.slice(0, 40);
}
let searchIdx = 0;
function drawSearch(q){
    const hits = searchHits(q);
    searchIdx = Math.min(searchIdx, Math.max(0, hits.length-1));
    $('#searchResults').innerHTML = hits.length ? hits.map((h,i) => `<div class="res ${i===searchIdx?'hl':''}" data-i="${i}">
            <span style="font-size:16px;width:22px;text-align:center;">${h.icon}</span>
            <span style="min-width:0;flex:1;"><div class="rt">${esc(h.title)}</div><div class="rp">${esc(h.sub)}</div></span>
        </div>`).join('')
        : '<div class="empty-note">Niets gevonden</div>';
    $$('#searchResults .res').forEach(el => el.onclick = () => pickHit(hits[+el.dataset.i]));
}
function pickHit(h){
    if(!h) return;
    if(searchPick){ const cb = searchPick; closeSearch(); cb(h.id); return; }
    closeSearch();
    go(h.id);
    if(h.row) setTimeout(() => { const db = P(h.id); openPeek(db, db.rows.find(r => r.id === h.row)); }, 120);
}
$('#searchInput').addEventListener('input', e => { searchIdx = 0; drawSearch(e.target.value); });
$('#searchInput').addEventListener('keydown', e => {
    const hits = searchHits($('#searchInput').value);
    if(e.key === 'ArrowDown'){ e.preventDefault(); searchIdx = Math.min(searchIdx+1, hits.length-1); drawSearch($('#searchInput').value); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); searchIdx = Math.max(searchIdx-1, 0); drawSearch($('#searchInput').value); }
    if(e.key === 'Enter'){ e.preventDefault(); pickHit(hits[searchIdx]); }
    if(e.key === 'Escape'){ closeSearch(); }
});
$('#searchOverlay').addEventListener('click', e => { if(e.target === $('#searchOverlay')) closeSearch(); });

function goToday(){
    const db = P(S.dailyDb);
    if(!db || db.trashed){ toast('Geen dagelijkse-notities database gevonden'); return; }
    const dp = db.props.find(p => p.id === db.dateProp) || db.props.find(p => p.type === 'date');
    const iso = todayISO();
    let row = db.rows.find(r => r.cells[dp.id] === iso);
    if(!row){
        row = newRow(db, { title:'Notitie ' + iso });
        row.cells[dp.id] = iso;
        row.blocks = [ blankBlock('h3','Focus van vandaag'), blankBlock('todo',''), blankBlock('h3','Log'), blankBlock('text','') ];
        db.rows.unshift(row); touch(db);
    }
    go(db.id);
    setTimeout(() => openPeek(db, row), 130);
}
function mdOf(p){
    let out = '# ' + (p.title || 'Naamloos') + '\n\n';
    if(p.type === 'db'){
        out += '| Naam | ' + p.props.map(x => x.name).join(' | ') + ' |\n';
        out += '|' + '---|'.repeat(p.props.length+1) + '\n';
        p.rows.forEach(r => {
            out += '| ' + (r.title||'') + ' | ' + p.props.map(x => {
                const v = r.cells[x.id]; return Array.isArray(v) ? v.join(', ') : String(v ?? '');
            }).join(' | ') + ' |\n';
        });
        return out;
    }
    const walk = (arr, ind='') => arr.forEach(b => {
        const t = stripTags(b.x);
        const map = { h1:'# ', h2:'## ', h3:'### ', bullet:'- ', number:'1. ', quote:'> ', callout:'> 💡 ', toggle:'- ' };
        if(b.t === 'divider') out += ind + '---\n\n';
        else if(b.t === 'todo') out += ind + '- [' + (b.done?'x':' ') + '] ' + t + '\n';
        else if(b.t === 'code') out += ind + '```' + (b.lang||'') + '\n' + t + '\n```\n\n';
        else if(b.t === 'pagelink') out += ind + '[[' + ((P(b.ref)||{}).title || 'pagina') + ']]\n';
        else if(b.t === 'image') out += ind + '![afbeelding]\n';
        else out += ind + (map[b.t]||'') + t + '\n' + (['h1','h2','h3','text'].includes(b.t) ? '\n' : '');
        if(b.kids) walk(b.kids, ind + '  ');
    });
    walk(p.blocks || []);
    return out;
}
function exportMd(id){
    const p = P(id);
    download((p.title||'pagina').replace(/[^\w\-]+/g,'-') + '.md', mdOf(p), 'text/markdown');
}
function download(name, content, type){
    const blob = new Blob([content], { type: type || 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportAll(){ download('kmdev-workspace-' + todayISO() + '.json', JSON.stringify(S, null, 2)); toast('Backup gedownload'); }
function importAll(){
    const inp = $('#importPick'); inp.value = '';
    inp.onchange = () => {
        const f = inp.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = () => {
            try{
                const data = JSON.parse(r.result);
                if(!data.pages) throw 0;
                if(!confirm('Huidige workspace vervangen door dit bestand?')) return;
                S = data; saveNow(); location.reload();
            }catch(e){ toast('Ongeldig bestand'); }
        };
        r.readAsText(f);
    };
    inp.click();
}

function svgBg(svg){
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg.replace(/\s{2,}/g,' ').trim()) + '")';
}

/* --- patronen: SVG-tegel bovenop een achtergrondkleur --- */
const PAT_SETS = [
    { name:'ink',   bg:'#0d0d0d', fg:'#c6ff4a', op:.5 },
    { name:'paper', bg:'#f4f3ef', fg:'#0d0d0d', op:.16 },
    { name:'lime',  bg:'#c6ff4a', fg:'#0d0d0d', op:.3 },
    { name:'sand',  bg:'#e8e3d5', fg:'#7a5c4b', op:.32 },
    { name:'deep',  bg:'#12233a', fg:'#8fc7ff', op:.34 },
    { name:'plum',  bg:'#2a1b33', fg:'#e0b6ff', op:.32 }
];
const PAT_SHAPES = {
    grid: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><g stroke="${fg}" stroke-opacity="${op}" stroke-width="1"><path d="M0 .5H40M.5 0V40"/></g></svg>`,
    dots: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="3" cy="3" r="2" fill="${fg}" fill-opacity="${op}"/></svg>`,
    diag: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path d="M-6 6 6-6M0 24 24 0M18 30 30 18" stroke="${fg}" stroke-opacity="${op}" stroke-width="3"/></svg>`,
    wave: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="34"><path d="M0 17c10-14 30-14 40 0s30 14 40 0" fill="none" stroke="${fg}" stroke-opacity="${op}" stroke-width="2"/></svg>`,
    topo: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><g fill="none" stroke="${fg}" stroke-opacity="${op}" stroke-width="1.4"><circle cx="45" cy="45" r="10"/><circle cx="45" cy="45" r="21"/><circle cx="45" cy="45" r="32"/><circle cx="45" cy="45" r="43"/></g></svg>`,
    cross:(fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><path d="M16 10v12M10 16h12" stroke="${fg}" stroke-opacity="${op}" stroke-width="2" stroke-linecap="round"/></svg>`,
    tri:  (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="38"><path d="M22 6 38 32H6z" fill="none" stroke="${fg}" stroke-opacity="${op}" stroke-width="1.6"/></svg>`,
    chev: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><path d="M0 20 15 6l15 14" fill="none" stroke="${fg}" stroke-opacity="${op}" stroke-width="2"/></svg>`,
    bolt: (fg,op) => `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><path d="M33 8 20 33h11l-3 20 17-27H33l3-18Z" fill="${fg}" fill-opacity="${op}"/></svg>`
};
const PAT_SIZE = { grid:'40px', dots:'26px', diag:'24px', wave:'80px 34px', topo:'90px', cross:'32px', tri:'44px 38px', chev:'30px', bolt:'60px' };

function buildPatterns(){
    const out = [];
    Object.keys(PAT_SHAPES).forEach(function(shape){
        PAT_SETS.forEach(function(set){
            out.push({
                img: svgBg(PAT_SHAPES[shape](set.fg, set.op)) + ', linear-gradient(' + set.bg + ',' + set.bg + ')',
                size: PAT_SIZE[shape] + ', cover',
                repeat: 'repeat, no-repeat',
                label: shape + ' / ' + set.name
            });
        });
    });
    return out;
}

const GRADIENTS = [
    'linear-gradient(120deg,#c6ff4a,#3f5a17)',
    'linear-gradient(135deg,#0d0d0d 0%,#25341a 55%,#c6ff4a 100%)',
    'linear-gradient(120deg,#f4f3ef,#c6ff4a)',

    'linear-gradient(120deg,#ffe2dd,#9b3d33)',

];

const SOLIDS = ['#0d0d0d','#37352f','#6f6d66','#b6b4ac','#f4f3ef','#ffffff',

let PATTERNS = null;
const asCover = v => (typeof v === 'string' ? { img:v } : v);

function coverStyle(p){
    if(!p || !p.cover) return '';
    const o = asCover(p.cover);
    const pos = (p.coverPos == null ? 50 : p.coverPos);
    return 'background-image:' + o.img +
           ';background-size:' + (o.size || 'cover') +
           ';background-repeat:' + (o.repeat || 'no-repeat') +
           ';background-position:center ' + pos + '%;';
}
function tileStyle(c){
    const o = asCover(c);
    return 'background-image:' + o.img +
           ';background-size:' + (o.size || 'cover') +
           ';background-repeat:' + (o.repeat || 'no-repeat') + ';';
}
function sameCover(a, b){
    if(!a || !b) return false;
    return asCover(a).img === asCover(b).img;
}

/* ---------- picker ---------- */
let cpTab = 'gallery';
function openCoverPicker(){
    if(!PATTERNS) PATTERNS = buildPatterns();
    if(!S.covers) S.covers = [];
    $('#coverOverlay').classList.add('on');
    drawCP();
}
function closeCoverPicker(){ $('#coverOverlay').classList.remove('on'); }

function applyCover(c){
    const p = P(cur); if(!p) return;
    p.cover = c;
    if(p.coverPos == null) p.coverPos = 50;
    touch(p);
    const cov = $('#cover');
    if(cov){ cov.setAttribute('style', coverStyle(p)); cov.classList.add('on'); }
    else renderPage();
    drawCP();
}

function tilesHTML(list, tight){
    const p = P(cur);
    return '<div class="cp-grid' + (tight ? ' tight' : '') + '">' + list.map(function(c, i){
        return '<button class="cp-tile' + (p && sameCover(p.cover, c) ? ' on' : '') + '" data-i="' + i + '" style="' + tileStyle(c) + '"></button>';
    }).join('') + '</div>';
}

function drawCP(){
    const body = $('#cpBody');
    const p = P(cur);
    let lists = {};

    if(cpTab === 'gallery'){
        lists.pat = PATTERNS;
        body.innerHTML = '<div class="cp-group">Patronen — ' + PATTERNS.length + ' stuks</div>' + tilesHTML(PATTERNS);
    }
    else if(cpTab === 'gradient'){
        lists.grad = GRADIENTS;
        body.innerHTML = '<div class="cp-group">Kleurverlopen</div>' + tilesHTML(GRADIENTS);
    }
    else if(cpTab === 'color'){
        lists.sol = SOLIDS.map(function(h){ return 'linear-gradient(' + h + ',' + h + ')'; });
        body.innerHTML = '<div class="cp-group">Effen kleuren</div>' + tilesHTML(lists.sol, true);
    }
    else if(cpTab === 'upload'){
        body.innerHTML =
            '<div class="cp-drop" id="cpDrop"><b>Sleep een afbeelding hierheen</b>' +
            '<span>of klik om te bladeren — png, jpg of webp, max ~1,4 MB</span></div>' +
            (S.covers.length
                ? '<div class="cp-group">Jouw covers</div>' + tilesHTML(S.covers)
                : '<div class="cp-group">Jouw covers</div><div class="cp-note">Nog geen eigen covers. Alles wat je uploadt of via een link toevoegt, bewaren we hier.</div>');
        lists.own = S.covers;
        const drop = $('#cpDrop');
        drop.onclick = function(){ pickImage(function(url){ addOwnCover({ img:'url("' + url + '")' }); }); };
        ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
        ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
        drop.addEventListener('drop', function(e){
            const f = e.dataTransfer.files && e.dataTransfer.files[0];
            if(!f || !/^image\//.test(f.type)) return;
            if(f.size > 1.4e6){ toast('Afbeelding te groot (max ~1,4 MB)'); return; }
            const r = new FileReader();
            r.onload = function(){ addOwnCover({ img:'url("' + r.result + '")' }); };
            r.readAsDataURL(f);
        });
    }
    else if(cpTab === 'link'){
        body.innerHTML =
            '<div class="cp-link"><input id="cpUrl" placeholder="https://…  plak een afbeeldings-URL" spellcheck="false"></div>' +
            '<div class="cp-note">Werkt met elke directe afbeeldingslink — bijvoorbeeld een foto van Unsplash of Pexels. ' +
            'Rechtermuisknop op de foto → “Afbeeldingsadres kopiëren”.</div>' +
            '<div class="cp-preview" id="cpPrev"></div>' +
            (S.covers.length ? '<div class="cp-group">Jouw covers</div>' + tilesHTML(S.covers) : '');
        lists.own = S.covers;
        const inp = $('#cpUrl');
        const upd = function(){
            const v = inp.value.trim();
            $('#cpPrev').style.backgroundImage = v ? 'url("' + v + '")' : '';
        };
        inp.oninput = upd;
        inp.onkeydown = function(e){
            if(e.key !== 'Enter') return;
            const v = inp.value.trim(); if(!v) return;
            addOwnCover({ img:'url("' + v + '")' });
            inp.value = ''; upd();
        };
        setTimeout(function(){ inp.focus(); }, 40);
    }

    // tegels aanklikbaar maken
    const src = lists.pat || lists.grad || lists.sol || lists.own || [];
    const own = src === S.covers;
    body.querySelectorAll('.cp-tile').forEach(function(t){
        t.onclick = function(e){
            if(e.target.dataset.del !== undefined) return;
            applyCover(src[+t.dataset.i]);
        };
        if(own){
            const del = document.createElement('button');
            del.className = 'cp-del'; del.dataset.del = ''; del.textContent = '✕';
            del.onclick = function(e){ e.stopPropagation(); S.covers.splice(+t.dataset.i, 1); save(); drawCP(); };
            t.appendChild(del);
        }
    });
}
function addOwnCover(c){
    if(!S.covers) S.covers = [];
    if(!S.covers.some(function(x){ return asCover(x).img === c.img; })){
        S.covers.unshift(c);
        if(S.covers.length > 14) S.covers.length = 14;
    }
    save();
    applyCover(c);
    toast('Cover toegevoegd');
}
$('#cpTabs').addEventListener('click', function(e){
    const b = e.target.closest('.cp-tab'); if(!b) return;
    cpTab = b.dataset.tab;
    $$('#cpTabs .cp-tab').forEach(function(t){ t.classList.toggle('on', t === b); });
    drawCP();
});
$('#cpClose').onclick = closeCoverPicker;
$('#cpRemove').onclick = function(){
    const p = P(cur); if(!p) return;
    p.cover = ''; p.coverPos = 50; touch(p); closeCoverPicker(); renderPage();
};
$('#coverOverlay').addEventListener('click', function(e){ if(e.target === $('#coverOverlay')) closeCoverPicker(); });

/* ---------- herpositioneren ---------- */
function startRepo(){
    const p = P(cur), cov = $('#cover');
    if(!p || !cov) return;
    const before = p.coverPos == null ? 50 : p.coverPos;
    cov.classList.add('repo');
    let dragging = false, startY = 0, startPos = before;

    const down = function(e){
        dragging = true;
        startY = (e.touches ? e.touches[0].clientY : e.clientY);
        startPos = p.coverPos == null ? 50 : p.coverPos;
        e.preventDefault();
    };
    const move = function(e){
        if(!dragging) return;
        const y = (e.touches ? e.touches[0].clientY : e.clientY);
        const d = (startY - y) / cov.offsetHeight * 100;
        p.coverPos = Math.max(0, Math.min(100, Math.round(startPos + d)));
        cov.style.backgroundPosition = 'center ' + p.coverPos + '%';
        e.preventDefault();
    };
    const up = function(){ dragging = false; };

    cov.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    cov.addEventListener('touchstart', down, { passive:false });
    window.addEventListener('touchmove', move, { passive:false });
    window.addEventListener('touchend', up);

    const cleanup = function(){
        cov.classList.remove('repo');
        cov.removeEventListener('mousedown', down);
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
        cov.removeEventListener('touchstart', down);
        window.removeEventListener('touchmove', move);
        window.removeEventListener('touchend', up);
    };
    $('#repoSave').onclick = function(){ touch(p); cleanup(); toast('Positie opgeslagen'); };
    $('#repoCancel').onclick = function(){ p.coverPos = before; cov.style.backgroundPosition = 'center ' + before + '%'; save(); cleanup(); };
}

/* ===============================================================
   11. UI WIRING
   =============================================================== */
const isMobile = () => innerWidth <= 860;
function sidebarOpen(on){
    if(!isMobile()){ S.sidebar = on; save(); }   // voorkeur alleen op desktop onthouden
    $('#sidebar').classList.toggle('hidden', !on);
    $('#expandBtn').style.display = on && !isMobile() ? 'none' : 'grid';
    $('#scrim').classList.toggle('on', on && isMobile());
    document.body.style.overflow = (on && isMobile()) ? 'hidden' : '';
}
$('#collapseBtn').onclick = e => { e.stopPropagation(); sidebarOpen(false); };
$('#expandBtn').onclick = () => sidebarOpen(true);
$('#scrim').onclick = () => sidebarOpen(false);
$('#searchBtn').onclick = () => openSearch(false);
$('#homeBtn').onclick = () => { if(S.home && P(S.home) && !P(S.home).trashed) go(S.home); else go(S.root[0]); };
$('#todayBtn').onclick = goToday;
$('#addRootPage').onclick = e => { e.stopPropagation(); createPage('page'); };
$('#newPageBtn').onclick = () => createPage('page');
$('#newDbBtn').onclick = () => createPage('db');
$('#trashBtn').onclick = showTrash;
$('#favBtn').onclick = () => { const p = P(cur); if(!p) return; p.fav = !p.fav; save(); renderTop(); renderSidebar(); };
$('#pageMoreBtn').onclick = e => { if(cur) pageMenu(cur, e.currentTarget); };
$('#wsBtn').onclick = e => {
    if(e.target.closest('#collapseBtn')) return;
    showMenu(e.currentTarget, [
        { group:'Workspace' },
        { label:'Backup downloaden', icon:'⬇️', sub:'Alles als JSON', run:exportAll },
        { label:'Backup importeren', icon:'⬆️', sub:'Vervangt huidige data', run:importAll },
        { sep:true },
        { label:'Naar KM.OS launcher', icon:'◈', run:() => location.href = 'os/index.html' },
        { label:'Terug naar site', icon:'🌐', run:() => location.href = 'index.html' },
        { label:'Uitloggen', icon:'🚪', danger:true, run:logout }
    ]);
};
$('#moreBtn').onclick = e => showMenu(e.currentTarget, [
    { label:'Backup downloaden', icon:'⬇️', run:exportAll },
    { label:'Backup importeren', icon:'⬆️', run:importAll },
    { label:'Deze pagina als Markdown', icon:'📄', run:() => cur && exportMd(cur) },
    { label:'Life OS openen', icon:'◎', run:() => location.href = 'os/life-os.html' },
    { label:'Mind Matrix openen', icon:'⬡', run:() => location.href = 'os/matrix.html' },
    { sep:true },
    { label:'Alles wissen', icon:'💣', danger:true, run:() => {
        if(!confirm('Alle data wissen en opnieuw beginnen?')) return;
        localStorage.removeItem(DB_KEY); location.reload();
    }}
]);
$('#logoutBtn').onclick = logout;

/* zwevende actieknop (mobiel) */
$('#fab').onclick = () => {
    const p = P(cur);
    if(!p){ createPage('page'); return; }
    // in het peek-paneel: blok toevoegen aan het item
    if(peekCtx && $('#peek').classList.contains('on')){
        const list = peekCtx.row.blocks;
        const nb = blankBlock(); list.push(nb);
        save(); refreshBlocks(); focusBlock(nb.id);
        setTimeout(() => openSlash(nb.id), 70);
        return;
    }
    if(p.type === 'db'){
        const r = newRow(p); p.rows.unshift(r); touch(p); drawView(p); openPeek(p, r); return;
    }
    const nb = blankBlock(); p.blocks.push(nb);
    save(); refreshBlocks(); focusBlock(nb.id);
    setTimeout(() => openSlash(nb.id), 70);
};
function logout(){
    localStorage.removeItem('kmdev_session');
    location.href = 'login.html';
}
function syncThemeUI(){
    const dark = document.documentElement.dataset.theme === 'dark';
    $('#themeLbl').textContent = dark ? 'Licht' : 'Donker';
    $('#themeIcon').innerHTML = dark
        ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'
        : '<path d="M21 13.2A8.5 8.5 0 0 1 10.8 3 8.5 8.5 0 1 0 21 13.2Z"/>';
}
$('#themeBtn').onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    syncThemeUI(); save();
};
$('#scroller').addEventListener('scroll', e => {
    $('#topbar').classList.toggle('scrolled', e.target.scrollTop > 8);
});

/* global keys */
document.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;
    if(meta && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(false); return; }
    if(meta && e.key.toLowerCase() === 'p'){ e.preventDefault(); openSearch(false); return; }
    if(meta && e.key === '\\'){ e.preventDefault(); sidebarOpen(!S.sidebar); return; }
    if(meta && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); toast('Opgeslagen'); return; }
    if(meta && e.shiftKey && e.key.toLowerCase() === 'n'){ e.preventDefault(); createPage('page'); return; }
    if(e.key === 'Escape'){
        if($('#coverOverlay').classList.contains('on')) closeCoverPicker();
        else if($('#searchOverlay').classList.contains('on')) closeSearch();
        else if($('#peek').classList.contains('on')) closePeek();
        else closeMenus();
    }
});
window.addEventListener('beforeunload', saveNow);
let _wasMobile = isMobile();
window.addEventListener('resize', () => {
    const now = isMobile();
    if(now !== _wasMobile){ _wasMobile = now; sidebarOpen(now ? false : S.sidebar !== false); }
    else if(!now){ $('#scrim').classList.remove('on'); document.body.style.overflow = ''; }
});
window.addEventListener('orientationchange', () => setTimeout(() => {
    if(isMobile()) sidebarOpen(false);
}, 250));

/* ===============================================================
   12. BOOT
   =============================================================== */
load();
renderSidebar();
sidebarOpen(isMobile() ? false : S.sidebar !== false);
(function boot(){
    const hash = location.hash.slice(1);
    const last = localStorage.getItem('kmdev_last');
    const start = (hash && P(hash) && !P(hash).trashed) ? hash
        : (last && P(last) && !P(last).trashed) ? last
        : (S.home && P(S.home) && !P(S.home).trashed) ? S.home
        : S.root.find(id => P(id) && !P(id).trashed);
    if(start) go(start);
    else $('#view').innerHTML = '<div class="empty-note">Maak je eerste pagina met de knop links.</div>';
})();
</script>
