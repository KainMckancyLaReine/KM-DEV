/* ---------- calendar ---------- */
function calendarView(db, host){
    let dp = db.props.find(p => p.id === db.dateProp) || db.props.find(p => p.type === 'date');
    if(!dp){
        host.innerHTML = '<div class="empty-note">Voeg een datum-eigenschap toe voor de kalenderweergave.<br><br><button class="btn-new" id="mkDate">＋ Datum toevoegen</button></div>';
        host.querySelector('#mkDate').onclick = () => {
            const p = { id:uid(), name:'Datum', type:'date' };
            db.props.push(p); db.dateProp = p.id;
            db.rows.forEach(r => r.cells[p.id] = '');
            touch(db); drawView(db);
        };
        return;
    }
    db.dateProp = dp.id;
    db._cal = db._cal || todayISO().slice(0,7);
    const [Y,M] = db._cal.split('-').map(Number);
    const first = new Date(Y, M-1, 1);
    const start = (first.getDay()+6)%7;
    const days = new Date(Y, M, 0).getDate();
    const prevDays = new Date(Y, M-1, 0).getDate();
    const rows = visibleRows(db);
    const byDate = {};
    rows.forEach(r => { const d = r.cells[dp.id]; if(d) (byDate[d] = byDate[d] || []).push(r); });
    const gp = db.props.find(p => p.id === db.groupBy);

    let cells = '';
    for(let i=start-1;i>=0;i--) cells += dayCell(Y, M-1, prevDays-i, true, byDate, gp, db);
    for(let d=1;d<=days;d++) cells += dayCell(Y, M, d, false, byDate, gp, db);
    const total = start + days;
    for(let d=1; d <= (42-total > 6 ? 7-(total%7)%7 : 42-total); d++) cells += dayCell(Y, M+1, d, true, byDate, gp, db);

    host.innerHTML = `<div class="calbar">
            <h3>${NL_MONTHS[M-1]} ${Y}</h3>
            <button class="chip" id="calPrev">‹</button>
            <button class="chip" id="calToday">Vandaag</button>
            <button class="chip" id="calNext">›</button>
        </div>
        <div class="cal">${NL_DOW.map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div>`;

    host.querySelector('#calPrev').onclick = () => { const d = new Date(Y, M-2, 1); db._cal = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); drawView(db); };
    host.querySelector('#calNext').onclick = () => { const d = new Date(Y, M, 1); db._cal = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); drawView(db); };
    host.querySelector('#calToday').onclick = () => { db._cal = todayISO().slice(0,7); drawView(db); };
    host.querySelectorAll('[data-ev]').forEach(el => el.onclick = e => { e.stopPropagation(); openPeek(db, db.rows.find(r => r.id === el.dataset.ev)); });
    host.querySelectorAll('[data-day]').forEach(el => el.onclick = () => {
        const r = newRow(db); r.cells[dp.id] = el.dataset.day; r.title = '';
        db.rows.push(r); touch(db); drawView(db); openPeek(db, r);
    });
}
function dayCell(Y, M, d, other, byDate, gp, db){
    const dt = new Date(Y, M-1, d);
    const iso = todayISO(dt);
    const evs = byDate[iso] || [];
    return `<div class="day ${other?'other':''} ${iso===todayISO()?'today':''}" data-day="${iso}">
        <div class="dnum">${dt.getDate()}</div>
        ${evs.map(r => {
            const v = gp ? r.cells[gp.id] : '';
            const c = COLORS[(gp && gp.colors?.[v]) || colorFor(v || r.title)] || COLORS.grey;
            return `<div class="ev" data-ev="${r.id}" style="background:${c[0]};color:${c[1]};">${esc(r.title || 'Naamloos')}</div>`;
        }).join('')}
        <button class="day-add" data-day="${iso}">＋</button>
    </div>`;
}

/* ===============================================================
   8. PEEK PANEL (row detail)
   =============================================================== */
let peekCtx = null;
function openPeek(db, row){
    if(!row) return;
    peekCtx = { db, row };
    $('#peekLbl').textContent = db.title;
    const body = $('#peekBody');
    body.innerHTML = `
        <h1 class="title" id="peekTitle" contenteditable="true" spellcheck="false" style="font-size:31px;">${esc(row.title)}</h1>
        <div style="margin:18px 0 8px;" id="peekProps"></div>
        <div style="height:1px;background:var(--line);margin:14px 0 18px;"></div>
        <div id="peekBlocks"></div>`;
    const t = $('#peekTitle');
    t.oninput = () => { row.title = t.textContent; touch(db); };
    t.onblur = () => { row.title = t.textContent.trim(); touch(db); drawView(db); };
    drawPeekProps();
    // blocks inside the row
    row.blocks = row.blocks && row.blocks.length ? row.blocks : [blankBlock()];
    const fakePage = { id: db.id, type:'page', blocks: row.blocks, children:[], title: row.title };
    renderBlocks(fakePage, $('#peekBlocks'), row.blocks);
    $('#peek').classList.add('on');
    setTimeout(() => { if(!row.title) { t.focus(); } }, 220);
}
function drawPeekProps(){
    if(!peekCtx) return;
    const { db, row } = peekCtx;
    const host = $('#peekProps');
    host.innerHTML = db.props.map(p => {
        const v = row.cells[p.id];
        let val;
        if(p.type === 'select') val = `<div class="prop-val" data-sel="${p.id}">${v ? tagHTML(v, p.colors?.[v]) : '<span class="ph">Leeg</span>'}</div>`;
        else if(p.type === 'multi') val = `<div class="prop-val" data-multi="${p.id}">${(v||[]).map(x => tagHTML(x, p.colors?.[x])).join('') || '<span class="ph">Leeg</span>'}</div>`;
        else if(p.type === 'date') val = `<div class="prop-val" data-date="${p.id}">${v ? fmtDate(v) : '<span class="ph">Leeg</span>'}</div>`;
        else if(p.type === 'check') val = `<div class="prop-val" data-check="${p.id}"><span class="cb ${v?'on':''}" style="margin-top:1px;"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span></div>`;
        else val = `<div class="prop-val" contenteditable="true" data-f="${p.id}">${esc(v||'')}</div>`;
        return `<div class="prop-row">
            <div class="prop-key" data-pk="${p.id}"><span>${propIcon(p.type)}</span> ${esc(p.name)}</div>
            ${val}
        </div>`;
    }).join('') + `<div class="prop-row"><div class="prop-key" id="peekAddProp" style="color:var(--text-faint);">＋ Eigenschap toevoegen</div></div>`;

    host.querySelectorAll('[data-f]').forEach(el => el.onblur = () => { row.cells[el.dataset.f] = el.textContent.trim(); touch(db); drawView(db); });
    host.querySelectorAll('[data-sel]').forEach(el => el.onclick = e => selectMenu(db, db.props.find(p => p.id === el.dataset.sel), row, e.currentTarget, false));
    host.querySelectorAll('[data-multi]').forEach(el => el.onclick = e => selectMenu(db, db.props.find(p => p.id === el.dataset.multi), row, e.currentTarget, true));
    host.querySelectorAll('[data-date]').forEach(el => el.onclick = () => datePicker(el, row.cells[el.dataset.date], v => { row.cells[el.dataset.date] = v; touch(db); drawPeekProps(); drawView(db); }));
    host.querySelectorAll('[data-check]').forEach(el => el.onclick = () => { row.cells[el.dataset.check] = !row.cells[el.dataset.check]; touch(db); drawPeekProps(); drawView(db); });
    host.querySelectorAll('[data-pk]').forEach(el => el.onclick = e => propMenu(db, el.dataset.pk, e.currentTarget));
    host.querySelector('#peekAddProp').onclick = e => addPropMenu(db, e.currentTarget);
    // re-render props after menus change things
    const obs = () => drawPeekProps();
    peekCtx.refresh = obs;
}
function closePeek(){
    $('#peek').classList.remove('on');
    if(peekCtx){ drawView(peekCtx.db); peekCtx = null; }
}
$('#peekClose').onclick = closePeek;
$('#peekDel').onclick = () => {
    if(!peekCtx) return;
    const { db, row } = peekCtx;
    const i = db.rows.findIndex(r => r.id === row.id);
    if(i >= 0){ db.rows.splice(i,1); touch(db); }
    closePeek();
    toast('Item verwijderd');
};

/* ===============================================================
   9. SEARCH (Cmd+K)
   =============================================================== */
let searchPick = null;
function openSearch(pickMode, cb){
    searchPick = pickMode ? (cb || null) : null;
    $('#searchOverlay').classList.add('on');
    const inp = $('#searchInput');
    inp.value = ''; inp.placeholder = pickMode ? 'Kies een pagina…' : 'Zoek in je workspace…';
    drawSearch('');
    setTimeout(() => inp.focus(), 40);
}
function closeSearch(){ $('#searchOverlay').classList.remove('on'); searchPick = null; }
function searchHits(q){
    q = q.toLowerCase().trim();
    const hits = [];
    allPages().forEach(p => {
        const path = pathOf(p.id).slice(0,-1).map(x => x.title || 'Naamloos').join(' / ');
        if(!q || (p.title||'').toLowerCase().includes(q)) hits.push({ icon:p.icon||'📄', title:p.title||'Naamloos', sub:path || 'Privé', id:p.id });
        if(q && !searchPick){
            (p.blocks||[]).forEach(b => {
                const txt = stripTags(b.x);
                if(txt && txt.toLowerCase().includes(q)) hits.push({ icon:'¶', title:txt.slice(0,72), sub:'in ' + (p.title||'Naamloos'), id:p.id });
            });
            (p.rows||[]).forEach(r => {
                if((r.title||'').toLowerCase().includes(q)) hits.push({ icon:'▦', title:r.title, sub:'in ' + (p.title||'Naamloos'), id:p.id, row:r.id });
            });
        }
    });
    return hits.slice(0, 40);
}
let searchIdx = 0;
function drawSearch(q){
    const hits = searchHits(q);
    searchIdx = Math.min(searchIdx, Math.max(0, hits.length-1));
    $('#searchResults').innerHTML = hits.length ? hits.map((h,i) => `<div class="res ${i===searchIdx?'hl':''}" data-i="${i}">
            <span style="font-size:16px;width:22px;text-align:center;">${h.icon}</span>
            <span style="min-width:0;flex:1;"><div class="rt">${esc(h.title)}</div><div class="rp">${esc(h.sub)}</div></span>
        </div>`).join('')
        : '<div class="empty-note">Niets gevonden</div>';
    $$('#searchResults .res').forEach(el => el.onclick = () => pickHit(hits[+el.dataset.i]));
}
function pickHit(h){
    if(!h) return;
    if(searchPick){ const cb = searchPick; closeSearch(); cb(h.id); return; }
    closeSearch();
    go(h.id);
    if(h.row) setTimeout(() => { const db = P(h.id); openPeek(db, db.rows.find(r => r.id === h.row)); }, 120);
}
$('#searchInput').addEventListener('input', e => { searchIdx = 0; drawSearch(e.target.value); });
$('#searchInput').addEventListener('keydown', e => {
    const hits = searchHits($('#searchInput').value);
    if(e.key === 'ArrowDown'){ e.preventDefault(); searchIdx = Math.min(searchIdx+1, hits.length-1); drawSearch($('#searchInput').value); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); searchIdx = Math.max(searchIdx-1, 0); drawSearch($('#searchInput').value); }
    if(e.key === 'Enter'){ e.preventDefault(); pickHit(hits[searchIdx]); }
    if(e.key === 'Escape'){ closeSearch(); }
});
$('#searchOverlay').addEventListener('click', e => { if(e.target === $('#searchOverlay')) closeSearch(); });

/* ===============================================================
   10. TRASH / TODAY / EXPORT
   =============================================================== */
function showTrash(){
    cur = null;
    const gone = Object.values(S.pages).filter(p => p.trashed);
    $('#crumbs').innerHTML = '<span class="crumb">🗑️ Prullenbak</span>';
    $('#view').innerHTML = `<div class="page"><div class="page-head">
        <div class="page-icon">🗑️</div><h1 class="title">Prullenbak</h1>
        <div class="page-meta"><span>${gone.length} verwijderde pagina's</span></div></div>
        <div style="margin-top:22px;">
        ${gone.length ? gone.map(p => `<div class="listrow" style="cursor:default;">
            <span>${p.icon||'📄'}</span><span class="lt">${esc(p.title||'Naamloos')}</span>
            <span class="rp" style="font-size:12px;color:var(--text-faint);">${relTime(p.trashedAt||p.updated)}</span>
            <button class="chip" data-restore="${p.id}">Herstellen</button>
            <button class="chip" data-purge="${p.id}" style="color:#e03e3e;">Definitief</button>
        </div>`).join('') : '<div class="empty-note">Prullenbak is leeg</div>'}
        </div></div>`;
    $$('[data-restore]').forEach(b => b.onclick = () => { P(b.dataset.restore).trashed = false; save(); renderSidebar(); showTrash(); toast('Hersteld'); });
    $$('[data-purge]').forEach(b => b.onclick = () => {
        const id = b.dataset.purge;
        if(!confirm('Definitief verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
        detach(id); delete S.pages[id]; save(); renderSidebar(); showTrash();
    });
}
function goToday(){
    const db = P(S.dailyDb);
    if(!db || db.trashed){ toast('Geen dagelijkse-notities database gevonden'); return; }
    const dp = db.props.find(p => p.id === db.dateProp) || db.props.find(p => p.type === 'date');
    const iso = todayISO();
    let row = db.rows.find(r => r.cells[dp.id] === iso);
    if(!row){
        row = newRow(db, { title:'Notitie ' + iso });
        row.cells[dp.id] = iso;
        row.blocks = [ blankBlock('h3','Focus van vandaag'), blankBlock('todo',''), blankBlock('h3','Log'), blankBlock('text','') ];
        db.rows.unshift(row); touch(db);
    }
    go(db.id);
    setTimeout(() => openPeek(db, row), 130);
}
function mdOf(p){
    let out = '# ' + (p.title || 'Naamloos') + '\n\n';
    if(p.type === 'db'){
        out += '| Naam | ' + p.props.map(x => x.name).join(' | ') + ' |\n';
        out += '|' + '---|'.repeat(p.props.length+1) + '\n';
        p.rows.forEach(r => {
            out += '| ' + (r.title||'') + ' | ' + p.props.map(x => {
                const v = r.cells[x.id]; return Array.isArray(v) ? v.join(', ') : String(v ?? '');
            }).join(' | ') + ' |\n';
        });
        return out;
    }
    const walk = (arr, ind='') => arr.forEach(b => {
        const t = stripTags(b.x);
        const map = { h1:'# ', h2:'## ', h3:'### ', bullet:'- ', number:'1. ', quote:'> ', callout:'> 💡 ', toggle:'- ' };
        if(b.t === 'divider') out += ind + '---\n\n';
        else if(b.t === 'todo') out += ind + '- [' + (b.done?'x':' ') + '] ' + t + '\n';
        else if(b.t === 'code') out += ind + '```' + (b.lang||'') + '\n' + t + '\n```\n\n';
        else if(b.t === 'pagelink') out += ind + '[[' + ((P(b.ref)||{}).title || 'pagina') + ']]\n';
        else if(b.t === 'image') out += ind + '![afbeelding]\n';
        else out += ind + (map[b.t]||'') + t + '\n' + (['h1','h2','h3','text'].includes(b.t) ? '\n' : '');
        if(b.kids) walk(b.kids, ind + '  ');
    });
    walk(p.blocks || []);
    return out;
}
function exportMd(id){
    const p = P(id);
    download((p.title||'pagina').replace(/[^\w\-]+/g,'-') + '.md', mdOf(p), 'text/markdown');
}
function download(name, content, type){
    const blob = new Blob([content], { type: type || 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportAll(){ download('kmdev-workspace-' + todayISO() + '.json', JSON.stringify(S, null, 2)); toast('Backup gedownload'); }
function importAll(){
    const inp = $('#importPick'); inp.value = '';
    inp.onchange = () => {
        const f = inp.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = () => {
            try{
                const data = JSON.parse(r.result);
                if(!data.pages) throw 0;
                if(!confirm('Huidige workspace vervangen door dit bestand?')) return;
                S = data; saveNow(); location.reload();
            }catch(e){ toast('Ongeldig bestand'); }
        };
        r.readAsText(f);
    };
    inp.click();
}

/* ===============================================================
   11. UI WIRING
   =============================================================== */
function sidebarOpen(on){
    S.sidebar = on; save();
    $('#sidebar').classList.toggle('hidden', !on);
    $('#expandBtn').style.display = on ? 'none' : 'grid';
    $('#scrim').classList.toggle('on', on && innerWidth <= 860);
}
$('#collapseBtn').onclick = e => { e.stopPropagation(); sidebarOpen(false); };
$('#expandBtn').onclick = () => sidebarOpen(true);
$('#scrim').onclick = () => sidebarOpen(false);
$('#searchBtn').onclick = () => openSearch(false);
$('#homeBtn').onclick = () => { if(S.home && P(S.home) && !P(S.home).trashed) go(S.home); else go(S.root[0]); };
$('#todayBtn').onclick = goToday;
$('#addRootPage').onclick = e => { e.stopPropagation(); createPage('page'); };
$('#newPageBtn').onclick = () => createPage('page');
$('#newDbBtn').onclick = () => createPage('db');
$('#trashBtn').onclick = showTrash;
$('#favBtn').onclick = () => { const p = P(cur); if(!p) return; p.fav = !p.fav; save(); renderTop(); renderSidebar(); };
$('#pageMoreBtn').onclick = e => { if(cur) pageMenu(cur, e.currentTarget); };
$('#wsBtn').onclick = e => {
    if(e.target.closest('#collapseBtn')) return;
    showMenu(e.currentTarget, [
        { group:'Workspace' },
        { label:'Backup downloaden', icon:'⬇️', sub:'Alles als JSON', run:exportAll },
        { label:'Backup importeren', icon:'⬆️', sub:'Vervangt huidige data', run:importAll },
        { sep:true },
        { label:'Terug naar site', icon:'🌐', run:() => location.href = 'index.html' },
        { label:'Uitloggen', icon:'🚪', danger:true, run:logout }
    ]);
};
$('#moreBtn').onclick = e => showMenu(e.currentTarget, [
    { label:'Backup downloaden', icon:'⬇️', run:exportAll },
    { label:'Backup importeren', icon:'⬆️', run:importAll },
    { label:'Deze pagina als Markdown', icon:'📄', run:() => cur && exportMd(cur) },
    { sep:true },
    { label:'Alles wissen', icon:'💣', danger:true, run:() => {
        if(!confirm('Alle data wissen en opnieuw beginnen?')) return;
        localStorage.removeItem(DB_KEY); location.reload();
    }}
]);
$('#logoutBtn').onclick = logout;
function logout(){
    localStorage.removeItem('kmdev_session');
    location.href = 'login.html';
}
function syncThemeUI(){
    const dark = document.documentElement.dataset.theme === 'dark';
    $('#themeLbl').textContent = dark ? 'Licht' : 'Donker';
    $('#themeIcon').innerHTML = dark
        ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'
        : '<path d="M21 13.2A8.5 8.5 0 0 1 10.8 3 8.5 8.5 0 1 0 21 13.2Z"/>';
}
$('#themeBtn').onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    syncThemeUI(); save();
};
$('#scroller').addEventListener('scroll', e => {
    $('#topbar').classList.toggle('scrolled', e.target.scrollTop > 8);
});

/* global keys */
document.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;
    if(meta && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(false); return; }
    if(meta && e.key.toLowerCase() === 'p'){ e.preventDefault(); openSearch(false); return; }
    if(meta && e.key === '\\'){ e.preventDefault(); sidebarOpen(!S.sidebar); return; }
    if(meta && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); toast('Opgeslagen'); return; }
    if(meta && e.shiftKey && e.key.toLowerCase() === 'n'){ e.preventDefault(); createPage('page'); return; }
    if(e.key === 'Escape'){
        if($('#searchOverlay').classList.contains('on')) closeSearch();
        else if($('#peek').classList.contains('on')) closePeek();
        else closeMenus();
    }
});
window.addEventListener('beforeunload', saveNow);
window.addEventListener('resize', () => { if(innerWidth > 860) $('#scrim').classList.remove('on'); });

/* ===============================================================
   12. BOOT
   =============================================================== */
load();
renderSidebar();
sidebarOpen(S.sidebar !== false);
(function boot(){
    const hash = location.hash.slice(1);
    const last = localStorage.getItem('kmdev_last');
    const start = (hash && P(hash) && !P(hash).trashed) ? hash
        : (last && P(last) && !P(last).trashed) ? last
        : (S.home && P(S.home) && !P(S.home).trashed) ? S.home
        : S.root.find(id => P(id) && !P(id).trashed);
    if(start) go(start);
    else $('#view').innerHTML = '<div class="empty-note">Maak je eerste pagina met de knop links.</div>';
})();
</script>
