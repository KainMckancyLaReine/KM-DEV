<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Workspace — KM.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

/* =========================================================
   KM.dev design tokens
   ========================================================= */
:root{
    /* canvas */
    --bg:#f4f3ef;
    --paper:#ffffff;
    --ink:#0d0d0d;
    --text:#0d0d0d;
    --text-soft:#6f6d66;
    --text-faint:#b6b4ac;
    --line:#e4e2d9;
    --line-soft:#eeece5;
    --hover:rgba(13,13,13,.045);
    --hover-strong:rgba(13,13,13,.085);
    --accent:#c6ff4a;
    --accent-ink:#3f5a17;
    --accent-soft:rgba(198,255,74,.22);
    --blue:#2383e2;
    --danger:#d1503f;

    /* sidebar (altijd ink) */
    --sb-bg:#0d0d0d;
    --sb-text:rgba(255,255,255,.58);
    --sb-strong:#ffffff;
    --sb-faint:rgba(255,255,255,.3);
    --sb-line:rgba(255,255,255,.09);
    --sb-hover:rgba(255,255,255,.06);
    --sb-hover-strong:rgba(255,255,255,.12);

    --sb-w:272px;
    --r-lg:28px;
    --r-md:16px;
    --r-sm:10px;
    --shadow:0 1px 2px rgba(13,13,13,.05),0 12px 34px rgba(13,13,13,.13),0 2px 8px rgba(13,13,13,.06);
    --shadow-soft:0 1px 3px rgba(13,13,13,.05),0 8px 22px rgba(13,13,13,.07);
}
html[data-theme="dark"]{
    --bg:#0d0d0d;
    --paper:#161616;
    --text:#f0efe9;
    --text-soft:#8f8d85;
    --text-faint:#5c5a54;
    --line:#242424;
    --line-soft:#1c1c1c;
    --hover:rgba(255,255,255,.05);
    --hover-strong:rgba(255,255,255,.095);
    --line-soft:#1b1b1b;
    --sb-bg:#080808;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.6);
    --shadow-soft:0 6px 20px rgba(0,0,0,.45);
}

html,body{height:100%;}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);
    font-size:16px;line-height:1.55;overflow:hidden;
    -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--accent);color:var(--ink);}
.mono{font-family:'Space Mono',monospace;}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--hover-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);background-clip:content-box;}

/* =========================================================
   SHELL
   ========================================================= */
.app{display:flex;height:100%;padding:10px;gap:10px;background:var(--bg);}

/* ---------- SIDEBAR (ink) ---------- */
.sidebar{
    width:var(--sb-w);flex:0 0 var(--sb-w);background:var(--sb-bg);
    display:flex;flex-direction:column;border-radius:var(--r-lg);
    transition:margin-left .32s cubic-bezier(.16,1,.3,1),opacity .3s ease;
    position:relative;z-index:20;overflow:hidden;color:var(--sb-text);
    box-shadow:var(--shadow-soft);
}
.sidebar.hidden{margin-left:calc(-1 * var(--sb-w) - 10px);opacity:0;}
.sb-top{padding:14px 12px 6px;}
.ws{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;
    transition:background .16s;
}
.ws:hover{background:var(--sb-hover);}
.ws-mark{
    width:30px;height:30px;border-radius:9px;background:var(--accent);color:#0d0d0d;
    display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;flex:0 0 30px;
}
.ws-name{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:-.02em;
    flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sb-strong);
}
.ws-name .dot{color:var(--accent);}
.icon-btn{
    width:28px;height:28px;border:0;background:transparent;border-radius:8px;cursor:pointer;
    display:grid;place-items:center;color:inherit;opacity:.6;
    transition:background .16s,opacity .16s,color .16s;flex:0 0 auto;
}
.icon-btn:hover{background:var(--hover-strong);opacity:1;}
.sidebar .icon-btn:hover{background:var(--sb-hover-strong);color:var(--sb-strong);}

.sb-actions{padding:2px 12px 10px;}
.sb-item{
    display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px;cursor:pointer;
    color:var(--sb-text);font-size:14px;font-weight:500;transition:background .16s,color .16s;
    user-select:none;border:0;background:transparent;width:100%;text-align:left;
}
.sb-item:hover{background:var(--sb-hover);color:var(--sb-strong);}
.sb-item.active{background:var(--sb-hover-strong);color:var(--sb-strong);}
.sb-item svg{flex:0 0 auto;opacity:.75;}
.sb-item:hover svg{opacity:1;}
.sb-item .kbd{
    margin-left:auto;font-size:10px;color:var(--sb-faint);font-family:'Space Mono',monospace;
    border:1px solid var(--sb-line);padding:2px 6px;border-radius:6px;letter-spacing:.06em;
}

.sb-scroll{flex:1;overflow-y:auto;padding:4px 12px 20px;}
.sidebar ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:content-box;}
.sb-section{margin-top:16px;}
.sb-label{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 10px;font-family:'Space Mono',monospace;font-size:10px;font-weight:400;
    letter-spacing:.18em;color:var(--sb-faint);text-transform:uppercase;
}
.sb-label .icon-btn{width:22px;height:22px;opacity:0;transition:opacity .16s;}
.sb-section:hover .sb-label .icon-btn{opacity:.7;}
.sb-section:hover .sb-label .icon-btn:hover{opacity:1;}

.tree-row{
    display:flex;align-items:center;gap:5px;padding:6px 8px 6px 6px;border-radius:11px;cursor:pointer;
    font-size:14px;color:var(--sb-text);transition:background .14s,color .14s;position:relative;user-select:none;
}
.tree-row:hover{background:var(--sb-hover);color:var(--sb-strong);}
.tree-row.sel{background:var(--sb-hover-strong);color:var(--sb-strong);font-weight:500;}
.tree-row.sel::before{
    content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
    width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--accent);
}
.tree-row.drop-target{box-shadow:inset 0 0 0 1.5px var(--accent);}
.tw{
    width:19px;height:19px;border-radius:6px;display:grid;place-items:center;flex:0 0 19px;
    color:var(--sb-faint);transition:transform .18s cubic-bezier(.16,1,.3,1),background .14s;
}
.tw:hover{background:var(--sb-hover-strong);color:var(--sb-strong);}
.tw.open{transform:rotate(90deg);}
.tw.empty{visibility:hidden;}
.tree-emoji{font-size:15px;width:21px;text-align:center;flex:0 0 21px;line-height:1;}
.tree-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tree-acts{display:flex;gap:1px;opacity:0;transition:opacity .14s;}
.tree-row:hover .tree-acts{opacity:1;}
.tree-acts .icon-btn{width:23px;height:23px;}
.tree-children{margin-left:16px;border-left:1px solid var(--sb-line);padding-left:3px;}
.tree-empty{padding:5px 10px 5px 32px;font-size:12.5px;color:var(--sb-faint);font-style:italic;}

.sb-foot{padding:10px 12px 12px;border-top:1px solid var(--sb-line);display:flex;align-items:center;gap:6px;}
.sb-foot .sb-item{padding:7px 10px;font-size:13.5px;}

/* ---------- MAIN ---------- */
.main{
    flex:1;display:flex;flex-direction:column;min-width:0;
    background:var(--paper);border-radius:var(--r-lg);overflow:hidden;
    box-shadow:var(--shadow-soft);
}
.topbar{
    height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 20px;
    border-bottom:1px solid transparent;background:var(--paper);position:relative;z-index:15;
    transition:border-color .25s ease;
}
.topbar.scrolled{border-bottom-color:var(--line);}
.crumbs{display:flex;align-items:center;gap:5px;font-size:13.5px;color:var(--text-soft);min-width:0;overflow:hidden;}
.crumb{
    padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:230px;transition:background .16s,color .16s;
}
.crumb:hover{background:var(--hover);color:var(--text);}
.crumb:last-child{color:var(--text);font-weight:500;}
.crumb-sep{color:var(--text-faint);font-size:12px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:4px;}
.tb-text{
    border:0;background:transparent;padding:6px 11px;border-radius:999px;cursor:pointer;
    font-size:15px;color:var(--text-soft);font-weight:500;transition:background .16s,color .16s;
}
.tb-text:hover{background:var(--hover);color:var(--text);}

.scroller{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;}

/* cover */
.cover{
    height:0;background-size:cover;background-position:center;background-repeat:no-repeat;
    position:relative;transition:height .28s cubic-bezier(.16,1,.3,1);overflow:hidden;
}
.cover.on{height:230px;}
.cover-acts{position:absolute;right:22px;bottom:16px;display:flex;gap:7px;opacity:0;transition:opacity .18s;z-index:2;}
.cover:hover .cover-acts{opacity:1;}
.cover-btn{
    background:rgba(255,255,255,.94);color:#0d0d0d;border:0;padding:7px 14px;border-radius:999px;
    font-size:11px;cursor:pointer;font-weight:700;font-family:'Space Mono',monospace;
    letter-spacing:.08em;text-transform:uppercase;box-shadow:0 2px 10px rgba(0,0,0,.2);
    transition:background .16s,transform .16s;
}
.cover-btn:hover{background:var(--accent);transform:translateY(-1px);}

/* herpositioneren */
.cover.repo{cursor:grab;}
.cover.repo:active{cursor:grabbing;}
.cover.repo::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--accent);pointer-events:none;}
.cover .repo-bar{
    position:absolute;left:0;right:0;bottom:0;display:none;align-items:center;gap:12px;
    padding:11px 20px;background:rgba(13,13,13,.82);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);z-index:3;
}
.cover.repo .repo-bar{display:flex;}
.cover.repo .cover-acts{display:none;}
.repo-bar span{
    color:rgba(255,255,255,.75);font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;flex:1;
}
.repo-bar button{
    border:0;padding:7px 15px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;
    font-family:'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase;
}
.repo-bar .save{background:var(--accent);color:var(--ink);}
.repo-bar .cancel{background:rgba(255,255,255,.14);color:#fff;}

/* =========================================================
   COVER PICKER
   ========================================================= */
.cover-picker{
    background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);
    width:100%;max-width:720px;max-height:74vh;display:flex;flex-direction:column;overflow:hidden;
    animation:modalIn .28s cubic-bezier(.16,1,.3,1);
}
.cp-tabs{
    display:flex;align-items:center;gap:2px;padding:8px 10px;
    border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
}
.cp-tabs::-webkit-scrollbar{display:none;}
.cp-tab{
    border:0;background:transparent;padding:8px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto;
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-faint);transition:all .18s;
}
.cp-tab:hover{background:var(--hover);color:var(--text-soft);}
.cp-tab.on{background:var(--ink);color:#fff;}
html[data-theme="dark"] .cp-tab.on{background:var(--accent);color:var(--ink);}
.cp-tabs .icon-btn{margin-left:auto;flex:0 0 auto;}

.cp-body{flex:1;overflow-y:auto;padding:18px 20px 22px;}
.cp-group{
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-faint);margin:18px 0 10px;
}
.cp-group:first-child{margin-top:0;}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;}
.cp-grid.tight{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));}
.cp-tile{
    position:relative;aspect-ratio:16/7;border-radius:10px;border:1px solid var(--line);
    cursor:pointer;overflow:hidden;background-size:cover;background-position:center;
    transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,border-color .2s;
    padding:0;
}
.cp-grid.tight .cp-tile{aspect-ratio:1/1;border-radius:12px;}
.cp-tile:hover{transform:translateY(-3px) scale(1.02);box-shadow:var(--shadow-soft);border-color:var(--text-faint);}
.cp-tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.cp-tile .cp-del{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;
    background:rgba(13,13,13,.6);color:#fff;font-size:11px;cursor:pointer;opacity:0;transition:opacity .16s;
}
.cp-tile:hover .cp-del{opacity:1;}

.cp-drop{
    border:1.5px dashed var(--line);border-radius:var(--r-md);padding:44px 20px;text-align:center;
    cursor:pointer;transition:all .2s;background:var(--bg);
}
.cp-drop:hover,.cp-drop.over{border-color:var(--accent);background:var(--accent-soft);}
.cp-drop b{
    display:block;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;
    letter-spacing:-.02em;margin-bottom:6px;color:var(--text);
}
.cp-drop span{font-size:13px;color:var(--text-faint);}
.cp-link{display:flex;gap:9px;margin-bottom:14px;}
.cp-link input{
    flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:12px 15px;outline:none;font-size:15px;transition:border-color .18s;
}
.cp-link input:focus{border-color:var(--accent);}
.cp-note{font-size:12.5px;color:var(--text-faint);line-height:1.6;}
.cp-preview{
    height:120px;border-radius:var(--r-md);border:1px solid var(--line);margin-top:14px;
    background-size:cover;background-position:center;background-repeat:no-repeat;
}
.cp-foot{
    display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--line);
}
.cp-foot .cp-hint{
    flex:1;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--text-faint);
}

.page{max-width:880px;margin:0 auto;padding:0 64px 40vh;}
.page.wide{max-width:1440px;}
.page-head{padding-top:52px;position:relative;}
.cover.on + .page .page-head{padding-top:22px;}
.page-icon{
    font-size:72px;line-height:1;cursor:pointer;display:inline-block;margin-bottom:10px;
    border-radius:18px;padding:4px 8px;transition:background .16s,transform .3s cubic-bezier(.16,1,.3,1);
}
.page-icon:hover{background:var(--hover);transform:scale(1.06) rotate(-3deg);}
.page-tools{display:flex;gap:6px;margin-bottom:10px;opacity:0;transition:opacity .18s;height:28px;}
.page-head:hover .page-tools{opacity:1;}
.page-tool{
    border:1px solid var(--line);background:transparent;color:var(--text-soft);
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;
    transition:all .18s;
}
.page-tool:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
html[data-theme="dark"] .page-tool:hover{background:var(--accent);border-color:var(--accent);color:var(--ink);}
h1.title{
    font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:700;letter-spacing:-.035em;
    line-height:1.08;outline:none;word-break:break-word;
}
h1.title:empty::before{content:'Naamloos';color:var(--text-faint);}
.page-meta{
    display:flex;gap:20px;margin-top:16px;font-family:'Space Mono',monospace;
    font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);
}

/* =========================================================
   BLOCKS
   ========================================================= */
.blocks{margin-top:22px;}
.blk{position:relative;display:flex;align-items:flex-start;border-radius:6px;}
.blk-handles{
    position:absolute;left:-54px;top:0;display:flex;gap:1px;opacity:0;transition:opacity .14s;
    height:100%;align-items:flex-start;padding-top:2px;
}
.blk:hover > .blk-handles{opacity:1;}
.hbtn{
    width:23px;height:25px;border:0;background:transparent;border-radius:7px;cursor:pointer;
    color:var(--text-faint);display:grid;place-items:center;transition:background .14s,color .14s;
}
.hbtn:hover{background:var(--hover-strong);color:var(--text);}
.hbtn.grab{cursor:grab;}
.blk.dragging{opacity:.32;}
.blk.drop-above::before,.blk.drop-below::after{
    content:'';position:absolute;left:0;right:0;height:2px;background:var(--accent-ink);border-radius:2px;
}
html[data-theme="dark"] .blk.drop-above::before,html[data-theme="dark"] .blk.drop-below::after{background:var(--accent);}
.blk.drop-above::before{top:-1px;} .blk.drop-below::after{bottom:-1px;}
.blk-body{flex:1;min-width:0;}
.ce{outline:none;word-break:break-word;white-space:pre-wrap;}
.ce:empty::before{content:attr(data-ph);color:var(--text-faint);pointer-events:none;}
.blk[data-t="text"] .ce{padding:4px 2px;min-height:30px;font-size:16.5px;line-height:1.65;}
.blk[data-t="h1"] .ce{font-family:'Space Grotesk',sans-serif;font-size:33px;font-weight:700;letter-spacing:-.028em;padding:26px 2px 4px;line-height:1.18;}
.blk[data-t="h2"] .ce{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.022em;padding:20px 2px 3px;line-height:1.22;}
.blk[data-t="h3"] .ce{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.015em;padding:15px 2px 2px;}
.blk[data-t="quote"]{padding:8px 0;}
.blk[data-t="quote"] .blk-body{border-left:3px solid var(--accent);padding-left:20px;}
.blk[data-t="quote"] .ce{
    font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:500;
    letter-spacing:-.015em;padding:2px;line-height:1.45;
}
.blk[data-t="code"] .blk-body{
    background:var(--ink);border-radius:var(--r-md);
    padding:20px 22px 18px;margin:8px 0;position:relative;color:#e8e6df;
}
html[data-theme="dark"] .blk[data-t="code"] .blk-body{background:#000;border:1px solid var(--line);}
.blk[data-t="code"] .ce{font-family:'Space Mono',monospace;font-size:13.5px;line-height:1.75;white-space:pre-wrap;}
.code-lang{
    position:absolute;top:9px;right:11px;font-size:9.5px;color:rgba(255,255,255,.4);
    font-family:'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
    background:rgba(255,255,255,.07);border:0;cursor:pointer;padding:4px 9px;border-radius:999px;
    transition:background .16s,color .16s;
}
.code-lang:hover{background:var(--accent);color:var(--ink);}
.blk[data-t="divider"] .blk-body{padding:18px 0;}
.blk[data-t="divider"] hr{border:0;border-top:1px solid var(--line);}
.blk[data-t="todo"] .blk-body{display:flex;align-items:flex-start;gap:11px;padding:4px 2px;}
.cb{
    width:18px;height:18px;border-radius:6px;border:1.5px solid var(--text-faint);flex:0 0 18px;
    margin-top:5px;cursor:pointer;display:grid;place-items:center;
    transition:background .18s,border-color .18s,transform .18s cubic-bezier(.16,1,.3,1);
}
.cb:hover{border-color:var(--accent-ink);transform:scale(1.1);}
.cb.on{background:var(--accent);border-color:var(--accent);}
.cb svg{opacity:0;color:var(--accent-ink);transition:opacity .16s;} .cb.on svg{opacity:1;}
.blk[data-t="todo"].done .ce{text-decoration:line-through;color:var(--text-faint);}
.blk[data-t="bullet"] .blk-body,.blk[data-t="number"] .blk-body{display:flex;align-items:flex-start;gap:11px;padding:4px 2px;}
.marker{
    flex:0 0 auto;min-width:20px;color:var(--accent-ink);user-select:none;line-height:1.65;
    text-align:center;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;
}
html[data-theme="dark"] .marker{color:var(--accent);}
.blk[data-t="toggle"] .blk-body{padding:4px 2px;}
.tg-head{display:flex;align-items:flex-start;gap:7px;}
.tg-arrow{
    width:21px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--text-soft);
    transition:transform .2s cubic-bezier(.16,1,.3,1),background .14s;flex:0 0 21px;border-radius:7px;
}
.tg-arrow:hover{background:var(--hover);}
.tg-arrow.open{transform:rotate(90deg);}
.tg-body{margin:6px 0 6px 28px;padding-left:4px;border-left:1px solid var(--line);display:none;}
.tg-body.open{display:block;}
.blk[data-t="callout"] .blk-body{
    display:flex;gap:15px;background:var(--bg);border:1px solid var(--line);
    border-radius:var(--r-md);padding:18px 20px;margin:10px 0;position:relative;overflow:hidden;
}
.blk[data-t="callout"] .blk-body::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
}
.callout-icon{font-size:20px;line-height:1.35;cursor:pointer;flex:0 0 auto;}
.blk[data-t="image"] .blk-body{padding:10px 0;}
.blk[data-t="image"] img{max-width:100%;border-radius:var(--r-md);display:block;box-shadow:var(--shadow-soft);}
.img-drop{
    border:1px dashed var(--line);border-radius:var(--r-md);padding:34px;text-align:center;
    color:var(--text-faint);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;cursor:pointer;background:var(--bg);transition:all .2s;
}
.img-drop:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
.blk[data-t="pagelink"] .blk-body{padding:4px 0;}
.pagelink{
    display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;
    font-weight:500;border:1px solid var(--line);text-decoration:none;color:var(--text);
    transition:all .2s cubic-bezier(.16,1,.3,1);background:var(--paper);
}
.pagelink:hover{border-color:var(--ink);transform:translateX(4px);box-shadow:var(--shadow-soft);}
html[data-theme="dark"] .pagelink:hover{border-color:var(--accent);}

/* =========================================================
   DATABASE
   ========================================================= */
.db-toolbar{
    display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);
    margin-top:24px;padding-bottom:0;flex-wrap:wrap;
}
.view-tab{
    border:0;background:transparent;padding:9px 13px;cursor:pointer;
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--text-faint);display:flex;align-items:center;gap:7px;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .18s,border-color .18s;
}
.view-tab:hover{color:var(--text-soft);}
.view-tab.on{color:var(--text);border-bottom-color:var(--accent);}
.db-tools{margin-left:auto;display:flex;gap:5px;align-items:center;padding-bottom:6px;}
.chip{
    border:1px solid transparent;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;
    font-size:12.5px;color:var(--text-soft);display:flex;align-items:center;gap:6px;font-weight:500;
    transition:all .18s;outline:none;
}
.chip:hover{background:var(--hover);color:var(--text);}
.chip:focus{border-color:var(--accent);background:var(--paper);}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);}
.btn-new{
    background:var(--ink);color:#fff;border:0;padding:8px 16px;border-radius:999px;
    font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:all .22s cubic-bezier(.16,1,.3,1);
}
.btn-new:hover{background:var(--accent);color:var(--ink);transform:translateY(-1px);box-shadow:0 6px 18px rgba(198,255,74,.35);}
html[data-theme="dark"] .btn-new{background:var(--accent);color:var(--ink);}
html[data-theme="dark"] .btn-new:hover{filter:brightness(1.1);}

/* table */
.tbl-wrap{overflow-x:auto;margin-top:0;}
table.db{border-collapse:collapse;width:100%;font-size:14px;}
table.db th,table.db td{
    border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
    padding:0;text-align:left;vertical-align:top;min-width:140px;position:relative;
}
table.db th:last-child,table.db td:last-child{border-right:0;}
table.db th{
    background:var(--paper);font-weight:400;color:var(--text-faint);
    font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);
}
.th-in{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;transition:background .16s;}
.th-in:hover{background:var(--hover);color:var(--text-soft);}
.th-in .ptype{color:var(--text-faint);flex:0 0 auto;font-size:11px;}
.cell{padding:10px 12px;min-height:40px;outline:none;cursor:text;transition:background .14s;}
.cell:hover{background:var(--hover);}
.cell:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft);}
td.c-title .cell{font-weight:500;display:flex;align-items:center;gap:8px;}
.open-row{
    margin-left:auto;opacity:0;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.12em;
    color:var(--text-soft);background:var(--bg);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;cursor:pointer;flex:0 0 auto;transition:all .18s;
}
tr:hover .open-row{opacity:1;}
.open-row:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.tag{
    display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;
    font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em;
}
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px;min-height:40px;cursor:pointer;align-items:flex-start;transition:background .14s;}
.tag-wrap:hover{background:var(--hover);}
.row-add td{padding:0;border-right:0;}
.row-add button{
    width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;
    color:var(--text-faint);cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:8px;
    transition:background .16s,color .16s;
}
.row-add button:hover{background:var(--hover);color:var(--text-soft);}
.row-del{
    position:absolute;left:-28px;top:50%;transform:translateY(-50%);opacity:0;
    width:22px;height:22px;border:0;background:transparent;color:var(--text-faint);
    cursor:pointer;border-radius:7px;font-size:12px;transition:all .16s;
}
tr:hover .row-del{opacity:1;}
.row-del:hover{background:rgba(209,80,63,.12);color:var(--danger);}
.group-hdr{display:flex;align-items:center;gap:9px;padding:14px 4px 8px;font-size:13px;font-weight:600;color:var(--text-soft);}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding:22px 2px 24px;align-items:flex-start;}
.col{
    flex:0 0 288px;background:var(--bg);border-radius:var(--r-md);padding:12px;
    max-height:66vh;display:flex;flex-direction:column;border:1px solid var(--line);
    transition:box-shadow .18s;
}
.col.drag-over{box-shadow:inset 0 0 0 2px var(--accent);}
.col-hdr{display:flex;align-items:center;gap:9px;padding:4px 4px 14px;}
.col-count{
    font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-faint);
    background:var(--hover);padding:2px 8px;border-radius:999px;
}
.col-hdr .icon-btn{margin-left:auto;width:23px;height:23px;font-size:13px;}
.col-body{overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1;padding:2px;}
.kcard{
    background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
    cursor:pointer;box-shadow:0 1px 2px rgba(13,13,13,.04);
    transition:box-shadow .2s,transform .2s cubic-bezier(.16,1,.3,1),border-color .2s;
}
.kcard:hover{box-shadow:var(--shadow-soft);transform:translateY(-2px);border-color:var(--text-faint);}
.kcard.dragging{opacity:.35;}
.kcard .kt{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;
    letter-spacing:-.012em;margin-bottom:9px;word-break:break-word;line-height:1.35;
}
.kmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.kdate{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-faint);letter-spacing:.05em;}
.col-add{
    border:0;background:transparent;padding:9px 8px;text-align:left;color:var(--text-faint);
    cursor:pointer;font-size:13px;border-radius:10px;margin-top:8px;display:flex;align-items:center;gap:7px;
    transition:background .16s,color .16s;
}
.col-add:hover{background:var(--hover);color:var(--text-soft);}
#addCol{border:1px dashed var(--line);justify-content:center;}

/* list */
.listv{margin-top:14px;}
.listrow{
    display:flex;align-items:center;gap:12px;padding:13px 12px;border-bottom:1px solid var(--line-soft);
    cursor:pointer;border-radius:12px;transition:background .16s,padding-left .2s cubic-bezier(.16,1,.3,1);
}
.listrow:hover{background:var(--hover);padding-left:18px;}
.listrow .lt{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;letter-spacing:-.012em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:16px;margin-top:22px;}
.gcard{
    border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;cursor:pointer;
    background:var(--paper);transition:box-shadow .22s,transform .22s cubic-bezier(.16,1,.3,1);
}
.gcard:hover{box-shadow:var(--shadow);transform:translateY(-4px);}
.gtop{height:130px;background:var(--bg);display:grid;place-items:center;font-size:36px;border-bottom:1px solid var(--line);}
.gbody{padding:14px 15px 16px;}
.gbody .gt{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;letter-spacing:-.015em;margin-bottom:9px;}

/* calendar */
.calbar{display:flex;align-items:center;gap:12px;margin:24px 0 14px;}
.calbar h3{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;letter-spacing:-.025em;min-width:210px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.cal .dow{
    padding:10px 12px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.16em;
    color:var(--text-faint);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--bg);text-transform:uppercase;
}
.cal .dow:nth-child(7){border-right:0;}
.day{
    min-height:112px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    padding:7px 8px;cursor:pointer;transition:background .16s;position:relative;
}
.day:nth-child(7n){border-right:0;}
.day:hover{background:var(--hover);}
.day.other{background:var(--bg);opacity:.5;}
.day.today .dnum{background:var(--accent);color:var(--accent-ink);}
.dnum{
    font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--text-soft);
    width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-bottom:5px;
}
.ev{
    font-size:11.5px;padding:3px 9px;border-radius:999px;margin-bottom:4px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;
    transition:transform .16s cubic-bezier(.16,1,.3,1);
}
.ev:hover{transform:translateX(2px);}
.day-add{
    position:absolute;top:6px;right:6px;opacity:0;width:21px;height:21px;border:0;
    background:var(--hover-strong);border-radius:7px;cursor:pointer;color:var(--text-soft);
    font-size:12px;transition:opacity .16s,background .16s;
}
.day:hover .day-add{opacity:1;}
.day-add:hover{background:var(--accent);color:var(--accent-ink);}

/* =========================================================
   MENUS / MODALS
   ========================================================= */
.menu{
    position:fixed;z-index:200;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);
    border:1px solid var(--line);padding:7px;min-width:262px;max-height:420px;overflow-y:auto;display:none;
}
.menu.on{display:block;animation:menuIn .18s cubic-bezier(.16,1,.3,1);}
@keyframes menuIn{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:none;}}
.menu-search{
    width:100%;border:1px solid var(--line);outline:none;padding:9px 12px;background:var(--bg);
    border-radius:10px;margin-bottom:6px;font-size:14px;transition:border-color .18s;
}
.menu-search:focus{border-color:var(--accent);}
.menu-grp{
    padding:9px 11px 5px;font-family:'Space Mono',monospace;font-size:9.5px;
    color:var(--text-faint);text-transform:uppercase;letter-spacing:.16em;
}
.mi{
    display:flex;align-items:center;gap:12px;padding:8px 11px;border-radius:10px;cursor:pointer;
    font-size:14px;border:0;background:transparent;width:100%;text-align:left;color:var(--text);
    transition:background .14s;
}
.mi:hover,.mi.hl{background:var(--hover);}
.mi.hl{box-shadow:inset 2px 0 0 var(--accent);}
.mi .mi-ico{
    width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;
    flex:0 0 30px;font-size:14px;color:var(--text-soft);background:var(--bg);
    font-family:'Space Grotesk',sans-serif;font-weight:600;
}
.mi:hover .mi-ico{border-color:var(--accent);background:var(--accent-soft);}
.mi .mi-txt{flex:1;min-width:0;}
.mi .mi-txt b{display:block;font-weight:500;font-size:14px;letter-spacing:-.008em;}
.mi .mi-txt span{display:block;font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mi .mi-kbd{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:.06em;}
.mi.danger{color:var(--danger);}
.mi.danger .mi-ico{border-color:rgba(209,80,63,.25);}
.menu-sep{height:1px;background:var(--line);margin:6px 0;}

.overlay{
    position:fixed;inset:0;background:rgba(13,13,13,.5);z-index:300;display:none;
    align-items:flex-start;justify-content:center;padding-top:13vh;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
}
.overlay.on{display:flex;animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
    background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);width:100%;max-width:620px;
    max-height:64vh;display:flex;flex-direction:column;overflow:hidden;
    animation:modalIn .28s cubic-bezier(.16,1,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(-14px);}to{opacity:1;transform:none;}}
.modal-search{display:flex;align-items:center;gap:13px;padding:20px 24px;border-bottom:1px solid var(--line);}
.modal-search input{
    flex:1;border:0;outline:none;background:transparent;
    font-family:'Space Grotesk',sans-serif;font-size:19px;letter-spacing:-.02em;
}
.modal-body{overflow-y:auto;padding:9px;}
.res{display:flex;align-items:center;gap:13px;padding:10px 13px;border-radius:12px;cursor:pointer;transition:background .14s;}
.res:hover,.res.hl{background:var(--hover);}
.res.hl{box-shadow:inset 2px 0 0 var(--accent);}
.res .rt{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;letter-spacing:-.015em;}
.res .rp{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;}
.empty-note{
    padding:36px;text-align:center;color:var(--text-faint);
    font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;
}

/* peek panel */
.peek{
    position:fixed;top:10px;right:10px;bottom:10px;width:min(740px,88vw);
    background:var(--paper);z-index:250;border-radius:var(--r-lg);
    box-shadow:-8px 0 60px rgba(13,13,13,.22);
    transform:translateX(calc(100% + 20px));transition:transform .38s cubic-bezier(.16,1,.3,1);
    display:flex;flex-direction:column;overflow:hidden;
}
.peek.on{transform:none;}
.peek-bar{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line);}
.peek-bar span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);}
.peek-body{flex:1;overflow-y:auto;padding:32px 46px 60px;}
.peek-body h1.title{font-size:34px;}
.prop-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px;}
.prop-key{
    width:170px;flex:0 0 170px;display:flex;align-items:center;gap:9px;color:var(--text-faint);
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .14s,color .14s;
}
.prop-key:hover{background:var(--hover);color:var(--text-soft);}
.prop-val{flex:1;padding:8px 11px;border-radius:10px;cursor:pointer;font-size:14.5px;min-height:36px;outline:none;transition:background .14s;}
.prop-val:hover{background:var(--hover);}
.prop-val:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft);}
.prop-val.ph,.prop-val .ph{color:var(--text-faint);}

/* toast */
.toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;font-size:14px;z-index:400;
    box-shadow:0 10px 34px rgba(13,13,13,.32);transition:transform .4s cubic-bezier(.16,1,.3,1);
    display:flex;align-items:center;gap:14px;
}
.toast.on{transform:translateX(-50%) translateY(0);}
.toast button{
    background:var(--accent);border:0;color:var(--ink);cursor:pointer;font-weight:700;
    font-size:12px;padding:5px 13px;border-radius:999px;transition:filter .16s;
}
.toast button:hover{filter:brightness(1.08);}

/* =========================================================
   MOBIEL
   ========================================================= */
.scrim{
    position:fixed;inset:0;background:rgba(13,13,13,.55);z-index:19;
    display:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    animation:fadeIn .22s ease;
}
.scrim.on{display:block;}

/* zwevende actieknop — vervangt de blok-handvatten op touch */
.fab{
    position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:180;
    width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;
    background:var(--ink);color:#fff;display:none;place-items:center;
    box-shadow:0 8px 26px rgba(13,13,13,.32);
    transition:transform .24s cubic-bezier(.16,1,.3,1),background .2s;
}
.fab:active{transform:scale(.92);}
html[data-theme="dark"] .fab{background:var(--accent);color:var(--ink);}

@media(max-width:860px){
    html,body{height:100%;height:100dvh;}
    .app{padding:0;gap:0;height:100dvh;}

    /* sidebar als drawer */
    .sidebar{
        position:fixed;top:0;bottom:0;left:0;z-index:22;
        width:min(85vw,320px);flex-basis:min(85vw,320px);
        border-radius:0 var(--r-lg) var(--r-lg) 0;
        box-shadow:10px 0 50px rgba(0,0,0,.45);
        padding-top:env(safe-area-inset-top);
    }
    .sidebar.hidden{margin-left:calc(-1 * min(85vw,320px) - 20px);}
    .sb-item,.tree-row{padding-top:11px;padding-bottom:11px;}
    .tree-acts{opacity:1;}
    .tree-acts .icon-btn,.sb-label .icon-btn{opacity:.75;width:30px;height:30px;}

    .main{border-radius:0;}
    .topbar{
        height:58px;flex-basis:58px;padding:0 12px;
        padding-top:env(safe-area-inset-top);
        border-bottom:1px solid var(--line);
    }
    .crumbs{font-size:13px;}
    .crumb{max-width:130px;padding:5px 8px;}
    .crumb:not(:last-child),.crumb-sep{display:none;}
    .tb-text,.topbar-right .icon-btn{width:38px;height:38px;font-size:17px;}

    /* pagina */
    .page{padding:0 20px 34vh;max-width:100%;}
    .page.wide{max-width:100%;}
    .page-head{padding-top:26px;}
    .cover.on{height:150px;}
    .page-icon{font-size:52px;margin-bottom:6px;}
    .page-tools{opacity:1;height:auto;flex-wrap:wrap;}
    h1.title{font-size:30px;letter-spacing:-.03em;}
    .peek-body h1.title{font-size:26px;}
    .page-meta{gap:14px;font-size:9.5px;}

    /* blokken: handvatten weg, FAB erin */
    .blk-handles{display:none;}
    .fab{display:grid;}
    .blocks{margin-top:18px;}
    .ce,.cell,.prop-val{font-size:16px;}      /* voorkomt inzoomen op iOS */
    .blk[data-t="text"] .ce{min-height:34px;padding:6px 2px;}
    .blk[data-t="h1"] .ce{font-size:27px;padding:20px 2px 4px;}
    .blk[data-t="h2"] .ce{font-size:22px;padding:16px 2px 3px;}
    .blk[data-t="h3"] .ce{font-size:18.5px;}
    .blk[data-t="quote"] .ce{font-size:17.5px;}
    .blk[data-t="code"] .blk-body{padding:18px 16px;overflow-x:auto;}
    .cb{width:22px;height:22px;flex-basis:22px;margin-top:4px;}
    .blk[data-t="callout"] .blk-body{padding:15px 16px;}
    .pagelink{padding:14px;}

    /* database */
    .db-toolbar{
        flex-wrap:nowrap;overflow-x:auto;gap:2px;margin-top:18px;
        scrollbar-width:none;-ms-overflow-style:none;
    }
    .db-toolbar::-webkit-scrollbar{display:none;}
    .view-tab{padding:10px;flex:0 0 auto;font-size:10px;}
    .db-tools{margin-left:0;padding-left:8px;flex:0 0 auto;}
    #dbFilter{width:104px;}
    .tbl-wrap{margin:0 -20px;padding:0 20px;-webkit-overflow-scrolling:touch;}
    table.db th,table.db td{min-width:150px;}
    table.db th:first-child,table.db td:first-child{min-width:200px;}
    .row-del{left:auto;right:4px;opacity:1;}
    .open-row{opacity:1;}
    .board{margin:0 -20px;padding:18px 20px 22px;-webkit-overflow-scrolling:touch;}
    .col{flex-basis:82vw;max-height:none;}
    .kcard{padding:15px;}
    .gallery{grid-template-columns:1fr 1fr;gap:12px;}
    .gtop{height:96px;font-size:28px;}
    .listrow{padding:15px 10px;}
    .listrow:hover{padding-left:10px;}
    .calbar{flex-wrap:wrap;gap:8px;margin:18px 0 10px;}
    .calbar h3{font-size:19px;min-width:0;flex:1;}
    .cal{margin:0 -20px;border-radius:0;border-left:0;border-right:0;}
    .day{min-height:74px;padding:5px 4px;}
    .dnum{width:21px;height:21px;font-size:10px;}
    .ev{font-size:9.5px;padding:2px 6px;}
    .cal .dow{padding:7px 4px;font-size:8.5px;letter-spacing:.1em;}
    .day-add{opacity:1;width:18px;height:18px;font-size:10px;}

    /* menus als bottom sheet */
    .menu{
        left:0 !important;right:0 !important;top:auto !important;bottom:0 !important;
        width:100% !important;min-width:0;max-width:100%;
        max-height:74vh;border-radius:var(--r-lg) var(--r-lg) 0 0;
        padding:10px 10px calc(18px + env(safe-area-inset-bottom));
        border:0;border-top:1px solid var(--line);
        box-shadow:0 -10px 50px rgba(13,13,13,.3);
    }
    .menu.on{animation:sheetIn .3s cubic-bezier(.16,1,.3,1);}
    .menu::before{
        content:'';display:block;width:38px;height:4px;border-radius:4px;
        background:var(--line);margin:0 auto 12px;
    }
    .mi{padding:12px;font-size:15px;}
    .mi .mi-ico{width:34px;height:34px;flex-basis:34px;}
    .menu-search{padding:12px 14px;font-size:16px;}

    /* cover picker als bottom sheet */
    .cover-picker{
        max-width:100%;max-height:88vh;border-radius:var(--r-lg) var(--r-lg) 0 0;
        margin-top:auto;animation:sheetIn .3s cubic-bezier(.16,1,.3,1);
    }
    .cp-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;}
    .cp-grid.tight{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));}
    .cp-body{padding:16px 16px 20px;}
    .cover.on{height:170px;}
    .cover-acts{right:12px;bottom:12px;opacity:1;flex-wrap:wrap;justify-content:flex-end;}
    .cover-btn{padding:6px 11px;font-size:10px;}

    /* zoeken fullscreen */
    .overlay{padding-top:0;align-items:stretch;}
    .modal{max-width:100%;max-height:100%;height:100%;border-radius:0;}
    .modal-search{padding:calc(16px + env(safe-area-inset-top)) 18px 16px;}
    .modal-search input{font-size:17px;}
    .res{padding:13px;}

    /* peek fullscreen */
    .peek{
        top:0;right:0;bottom:0;left:0;width:100%;border-radius:0;
        transform:translateY(100%);
        transition:transform .34s cubic-bezier(.16,1,.3,1);
    }
    .peek.on{transform:none;}
    .peek-bar{padding:calc(12px + env(safe-area-inset-top)) 14px 12px;}
    .peek-body{padding:22px 20px calc(60px + env(safe-area-inset-bottom));}
    .prop-row{flex-wrap:wrap;gap:2px;margin-bottom:8px;}
    .prop-key{width:100%;flex-basis:100%;padding:6px 4px;}
    .prop-val{width:100%;padding:10px;background:var(--bg);border-radius:12px;}

    .toast{
        left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));
        transform:translateY(140px);border-radius:18px;justify-content:space-between;
    }
    .toast.on{transform:none;}
}
@keyframes sheetIn{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:none;}}

@media(max-width:420px){
    .page{padding:0 16px 34vh;}
    h1.title{font-size:26px;}
    .gallery{grid-template-columns:1fr;}
    .tbl-wrap,.board,.cal{margin-left:-16px;margin-right:-16px;}
    .tbl-wrap,.board{padding-left:16px;padding-right:16px;}
}

<script>
/* ===============================================================
   KM.dev Workspace — een zelfgebouwde Notion
   Alles lokaal in localStorage. Geen server, geen account.
   =============================================================== */

/* ---------- auth guard ---------- */
(function(){
    try{
        const s = JSON.parse(localStorage.getItem('kmdev_session') || 'null');
        if(!s || s.exp < Date.now()){ localStorage.removeItem('kmdev_session'); location.replace('login.html'); }
    }catch(e){ location.replace('login.html'); }
})();

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const NL_MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const NL_DOW = ['ma','di','wo','do','vr','za','zo'];

const COLORS = {
    grey:  ['#e3e2e0','#5f5e5b'], brown:['#eee0da','#7a5c4b'], orange:['#fadec9','#a2603a'],
    yellow:['#fdecc8','#8a6c26'], green:['#dbeddb','#3f6b47'], blue:['#d3e5ef','#28618c'],
    purple:['#e8deee','#61468a'], pink: ['#f5e0e9','#8f4463'], red:  ['#ffe2dd','#9b3d33'],
    lime:  ['#e6ffb8','#4d6b18']
};
const COLOR_KEYS = Object.keys(COLORS);
function colorFor(name){
    let h = 0; for(let i=0;i<String(name).length;i++) h = (h*31 + String(name).charCodeAt(i)) >>> 0;
    return COLOR_KEYS[h % COLOR_KEYS.length];
}
function tagHTML(val, colorKey){
    if(val === '' || val == null) return '';
    const c = COLORS[colorKey || colorFor(val)] || COLORS.grey;
    return `<span class="tag" style="background:${c[0]};color:${c[1]};">${esc(val)}</span>`;
}

/* ===============================================================
   1. STATE + STORAGE
   =============================================================== */
const DB_KEY = 'kmdev_workspace_v1';
let S = null;              // state
let cur = null;            // current page id
let saveTimer = null;

function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        try{ localStorage.setItem(DB_KEY, JSON.stringify(S)); }
        catch(e){ toast('Opslaan mislukt — opslag vol?'); }
    }, 220);
}
function saveNow(){ clearTimeout(saveTimer); localStorage.setItem(DB_KEY, JSON.stringify(S)); }

function blankBlock(type='text', text=''){ return { id:uid(), t:type, x:text }; }

function newPage(over={}){
    const p = {
        id: uid(), type:'page', title:'', icon:'📄', cover:'',
        parent: over.parent ?? null, children:[], blocks:[blankBlock()],
        fav:false, created:Date.now(), updated:Date.now(), trashed:false, open:false
    };
    Object.assign(p, over);
    return p;
}
function newDatabase(over={}){
    const statusProp = { id:uid(), name:'Status', type:'select', options:['Backlog','Bezig','Review','Klaar'] };
    const tagProp    = { id:uid(), name:'Tags',   type:'multi',  options:['design','code','client','idee'] };
    const dateProp   = { id:uid(), name:'Datum',  type:'date' };
    const p = {
        id: uid(), type:'db', title:'Nieuwe database', icon:'🗂️', cover:'',
        parent: over.parent ?? null, children:[], blocks:[],
        fav:false, created:Date.now(), updated:Date.now(), trashed:false, open:false,
        props:[statusProp, tagProp, dateProp],
        rows:[],
        view:'table', groupBy:statusProp.id, sortBy:null, sortDir:'asc', filter:'', dateProp:dateProp.id
    };
    Object.assign(p, over);
    return p;
}
function newRow(db, over={}){
    const r = { id:uid(), title:'', cells:{}, blocks:[blankBlock()], created:Date.now() };
    db.props.forEach(pr => { r.cells[pr.id] = pr.type === 'multi' ? [] : (pr.type === 'check' ? false : ''); });
    Object.assign(r, over);
    return r;
}

/* ---------- seed ---------- */
function seed(){
    const st = { pages:{}, root:[], theme:'light', sidebar:true, version:1 };
    const add = p => { st.pages[p.id] = p; return p; };

    // Projects database
    const projects = newDatabase({ title:'Projecten', icon:'🚀', open:true });
    projects.props[0].options = ['Backlog','Bezig','Review','Klaar'];
    projects.props.push({ id:uid(), name:'Prioriteit', type:'select', options:['Laag','Normaal','Hoog','Urgent'] });
    projects.props.push({ id:uid(), name:'Klaar', type:'check' });
    const [pStatus,pTags,pDate,pPrio,pDone] = projects.props;
    const mk = (t,s,tags,d,prio) => {
        const r = newRow(projects, { title:t });
        r.cells[pStatus.id] = s; r.cells[pTags.id] = tags; r.cells[pDate.id] = d; r.cells[pPrio.id] = prio;
        r.cells[pDone.id] = s === 'Klaar';
        r.blocks = [blankBlock('text','Notities over ' + t + '…')];
        return r;
    };
    const dd = n => { const x = new Date(); x.setDate(x.getDate()+n); return todayISO(x); };
    projects.rows = [
        mk('KM.dev website redesign','Bezig',['design','code'],dd(3),'Hoog'),
        mk('Client onboarding flow','Review',['client'],dd(1),'Urgent'),
        mk('Brand system v2','Backlog',['design'],dd(12),'Normaal'),
        mk('Notion dashboard bouwen','Klaar',['code','idee'],dd(-2),'Hoog'),
        mk('Pricing pagina A/B test','Backlog',['code','client'],dd(20),'Laag')
    ];
    add(projects); st.root.push(projects.id);

    // Tasks database
    const tasks = newDatabase({ title:'Taken', icon:'✅', view:'board' });
    tasks.props = [
        { id:uid(), name:'Status', type:'select', options:['Te doen','Bezig','Klaar'] },
        { id:uid(), name:'Context', type:'multi', options:['diep werk','admin','bellen','snel'] },
        { id:uid(), name:'Deadline', type:'date' }
    ];
    tasks.groupBy = tasks.props[0].id; tasks.dateProp = tasks.props[2].id;
    const [tS,tC,tD] = tasks.props;
    const mt = (t,s,c,d) => { const r = newRow(tasks,{title:t}); r.cells[tS.id]=s; r.cells[tC.id]=c; r.cells[tD.id]=d; return r; };
    tasks.rows = [
        mt('Facturen versturen','Te doen',['admin'],dd(1)),
        mt('Hero animatie fixen','Bezig',['diep werk'],dd(0)),
        mt('Terugbellen client','Te doen',['bellen','snel'],dd(2)),
        mt('Backup instellen','Klaar',['admin'],dd(-3))
    ];
    add(tasks); st.root.push(tasks.id);

    // Notes page with rich blocks
    const notes = add(newPage({ title:'Notities', icon:'📓', open:true }));
    notes.blocks = [
        blankBlock('h2','Snelle ideeën'),
        blankBlock('callout','Alles hier is van jou alleen — opgeslagen in je eigen browser.'),
        Object.assign(blankBlock('todo','Slash-menu proberen: typ "/" ergens'), {done:false}),
        Object.assign(blankBlock('todo','Een database aanmaken'), {done:true}),
        blankBlock('bullet','Typ "# " voor een kop, "- " voor bullets, "[] " voor een to-do'),
        blankBlock('bullet','Sleep blokken met het ⠿-handvat links'),
        blankBlock('divider'),
        blankBlock('h3','Snippets'),
        Object.assign(blankBlock('code','const workspace = "van mij";\nconsole.log(workspace);'), {lang:'javascript'}),
        blankBlock('quote','Make it work, make it right, make it fast.'),
        Object.assign(blankBlock('toggle','Klik om te openen'), {open:false, kids:[blankBlock('text','Verborgen inhoud die je kunt uitklappen.')]}),
        blankBlock('text','')
    ];
    st.root.push(notes.id);

    // Nested subpage
    const sub = add(newPage({ title:'Weekplanning', icon:'🗓️', parent:notes.id }));
    sub.blocks = [ blankBlock('h2','Deze week'), blankBlock('bullet','Ma — deep work'), blankBlock('bullet','Wo — client calls'), blankBlock('text','') ];
    notes.children.push(sub.id);

    // Daily notes db
    const daily = newDatabase({ title:'Dagelijkse notities', icon:'☀️', view:'calendar' });
    daily.props = [
        { id:uid(), name:'Datum', type:'date' },
        { id:uid(), name:'Stemming', type:'select', options:['🔥 top','🙂 prima','😐 matig','😵 zwaar'] }
    ];
    daily.dateProp = daily.props[0].id; daily.groupBy = daily.props[1].id;
    const today = newRow(daily, { title:'Notitie ' + todayISO() });
    today.cells[daily.props[0].id] = todayISO();
    today.cells[daily.props[1].id] = '🙂 prima';
    today.blocks = [ blankBlock('h3','Focus van vandaag'), blankBlock('todo','…'), blankBlock('h3','Log'), blankBlock('text','') ];
    daily.rows = [today];
    add(daily); st.root.push(daily.id);

    // Home
    const home = add(newPage({ title:'Home', icon:'🏠' }));
    home.blocks = [
        blankBlock('h1','Welkom terug'),
        blankBlock('text','Je privé workspace. Alles hieronder is direct bewerkbaar.'),
        blankBlock('divider'),
        blankBlock('h3','Snel naar'),
        Object.assign(blankBlock('pagelink'), {ref:projects.id}),
        Object.assign(blankBlock('pagelink'), {ref:tasks.id}),
        Object.assign(blankBlock('pagelink'), {ref:notes.id}),
        Object.assign(blankBlock('pagelink'), {ref:daily.id}),
        blankBlock('text','')
    ];
    st.root.unshift(home.id);
    st.home = home.id;
    st.dailyDb = daily.id;
    return st;
}

function load(){
    try{
        const raw = localStorage.getItem(DB_KEY);
        if(raw){ S = JSON.parse(raw); }
    }catch(e){ S = null; }
    if(!S || !S.pages || !Object.keys(S.pages).length){ S = seed(); saveNow(); }
    if(!S.theme) S.theme = 'light';
    document.documentElement.dataset.theme = S.theme;
    syncThemeUI();
}

/* ---------- helpers ---------- */
const P = id => S.pages[id];
function pageOf(id){ return S.pages[id] || null; }
function childrenOf(id){
    const p = P(id); if(!p) return [];
    return (p.children||[]).map(P).filter(x => x && !x.trashed);
}
function pathOf(id){
    const out = []; let n = P(id); let guard = 0;
    while(n && guard++ < 50){ out.unshift(n); n = n.parent ? P(n.parent) : null; }
    return out;
}
function allPages(){ return Object.values(S.pages).filter(p => !p.trashed); }
function touch(p){ p.updated = Date.now(); save(); }

function toast(msg, actionLabel, action){
    const t = $('#toast');
    $('#toastMsg').textContent = msg;
    [...t.querySelectorAll('button')].forEach(b => b.remove());
    if(actionLabel){
        const b = document.createElement('button'); b.textContent = actionLabel;
        b.onclick = () => { action && action(); t.classList.remove('on'); };
        t.appendChild(b);
    }
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('on'), actionLabel ? 6000 : 2400);
}

/* ===============================================================
   2. SIDEBAR
   =============================================================== */
function renderSidebar(){
    // favourites
    const favs = allPages().filter(p => p.fav);
    $('#favSection').style.display = favs.length ? '' : 'none';
    $('#favTree').innerHTML = favs.map(p => rowHTML(p, 0, true)).join('');
    // tree
    $('#tree').innerHTML = S.root.map(P).filter(p => p && !p.trashed).map(p => branchHTML(p, 0)).join('')
        || '<div class="tree-empty">Nog geen pagina\'s</div>';
    bindTree();
}
function rowHTML(p, depth, flat){
    const kids = childrenOf(p.id);
    const hasKids = kids.length > 0;
    return `<div class="tree-row ${cur===p.id?'sel':''}" data-id="${p.id}" draggable="true" style="padding-left:${6+depth*12}px">
        <span class="tw ${p.open?'open':''} ${(!hasKids||flat)?'empty':''}" data-tw="${p.id}">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M9 6l6 6-6 6z"/></svg>
        </span>
        <span class="tree-emoji" data-ico="${p.id}">${p.icon||'📄'}</span>
        <span class="tree-title">${esc(p.title || 'Naamloos')}</span>
        <span class="tree-acts">
            <button class="icon-btn" data-menu="${p.id}" title="Opties"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
            <button class="icon-btn" data-add="${p.id}" title="Subpagina"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </span>
    </div>`;
}
function branchHTML(p, depth){
    let html = rowHTML(p, depth);
    if(p.open){
        const kids = childrenOf(p.id);
        html += `<div class="tree-children">` +
            (kids.length ? kids.map(k => branchHTML(k, 0)).join('') : `<div class="tree-empty">Geen subpagina's</div>`) +
        `</div>`;
    }
    return html;
}
function bindTree(){
    $$('.tree-row').forEach(row => {
        const id = row.dataset.id;
        row.addEventListener('click', e => {
            if(e.target.closest('[data-tw]')){
                const p = P(id); const kids = childrenOf(id);
                if(kids.length){ p.open = !p.open; save(); renderSidebar(); }
                return;
            }
            if(e.target.closest('[data-menu]')){ pageMenu(id, e.target.closest('[data-menu]')); return; }
            if(e.target.closest('[data-add]')){ addChild(id); return; }
            go(id);
        });
        row.addEventListener('contextmenu', e => { e.preventDefault(); pageMenu(id, row, e); });
        // drag reorder / nest
        row.addEventListener('dragstart', e => { e.dataTransfer.setData('text/page', id); e.dataTransfer.effectAllowed='move'; });
        row.addEventListener('dragover', e => {
            if(!e.dataTransfer.types.includes('text/page')) return;
            e.preventDefault(); row.classList.add('drop-target');
        });
        row.addEventListener('dragleave', () => row.classList.remove('drop-target'));
        row.addEventListener('drop', e => {
            e.preventDefault(); row.classList.remove('drop-target');
            const src = e.dataTransfer.getData('text/page');
            if(src && src !== id) movePage(src, id);
        });
    });
}
function detach(id){
    const p = P(id); if(!p) return;
    if(p.parent && P(p.parent)) P(p.parent).children = P(p.parent).children.filter(c => c !== id);
    S.root = S.root.filter(c => c !== id);
}
function movePage(srcId, targetId){
    // prevent nesting into own descendant
    let n = P(targetId), guard = 0;
    while(n && guard++ < 60){ if(n.id === srcId){ toast('Kan niet in eigen subpagina plaatsen'); return; } n = n.parent ? P(n.parent) : null; }
    detach(srcId);
    const t = P(targetId);
    t.children.push(srcId); t.open = true;
    P(srcId).parent = targetId;
    save(); renderSidebar(); toast('Verplaatst naar ' + (t.title || 'Naamloos'));
}
function addChild(parentId){
    const p = newPage({ parent: parentId });
    S.pages[p.id] = p;
    P(parentId).children.push(p.id);
    P(parentId).open = true;
    save(); renderSidebar(); go(p.id, true);
}
function createPage(kind){
    const p = kind === 'db' ? newDatabase() : newPage();
    S.pages[p.id] = p; S.root.push(p.id);
    save(); renderSidebar(); go(p.id, kind !== 'db');
}

/* ===============================================================
   3. NAVIGATION

let history_ = [];
function go(id, focusTitle){
    if(!P(id)) return;
    if(cur && cur !== id) history_.push(cur);

}
function renderTop(){

        `<span class="crumb" data-go="${n.id}">${n.icon||'📄'} ${esc(n.title||'Naamloos')}</span>` +

function renderBody(){

function renderSidebarSoft(){

    if(row) row.textContent = P(cur).title || 'Naamloos';

function relTime(ts){
    const d = Math.floor((Date.now()-ts)/1000);
    if(d < 60) return 'zojuist';
    if(d < 3600) return Math.floor(d/60) + ' min geleden';
    if(d < 86400) return Math.floor(d/3600) + ' uur geleden';
    if(d < 604800) return Math.floor(d/86400) + ' dagen geleden';
    return new Date(ts).toLocaleDateString('nl-NL');
}
function randomEmoji(){
    const e = ['📄','📝','💡','🚀','🎯','📦','🔥','⚡','🧠','🗂️','📌','🎨','🛠️','📊','🌱','🧩','⭐','🗒️','🔮','🏔️'];

/* ===============================================================
   5. BLOCK EDITOR
   =============================================================== */
const PLACEHOLDERS = {
    text:"Typ '/' voor commando's", h1:'Kop 1', h2:'Kop 2', h3:'Kop 3',
    todo:'Te doen', bullet:'Lijstitem', number:'Lijstitem', quote:'Citaat',
    code:'Code…', callout:'Callout tekst', toggle:'Toggle titel'
};

function renderBlocks(page, host, list, depth){
    const blocks = list || page.blocks;
    host.innerHTML = '<div class="blocks" data-blocks></div>';
    const wrap = host.querySelector('[data-blocks]');
    blocks.forEach((b,i) => wrap.appendChild(blockEl(page, b, blocks, i)));
    if(!blocks.length){
        const b = blankBlock(); blocks.push(b); save();
        wrap.appendChild(blockEl(page, b, blocks, 0));
    }
    // click empty space below → new block
    host.onclick = e => {
        if(e.target === host || e.target === wrap){
            const last = blocks[blocks.length-1];
            if(last && last.t === 'text' && !stripTags(last.x)) { focusBlock(last.id); return; }
            const nb = blankBlock(); blocks.push(nb); save(); refreshBlocks(); focusBlock(nb.id);
        }
    };
}
function refreshBlocks(){
    if(peekCtx && document.getElementById('peek').classList.contains('on')){
        const row = peekCtx.row;
        row.blocks = row.blocks && row.blocks.length ? row.blocks : [blankBlock()];
        renderBlocks({ id:peekCtx.db.id, type:'page', blocks:row.blocks, children:[] }, $('#peekBlocks'), row.blocks);
    }else{
        renderBody();
    }
}
function stripTags(h){ const d = document.createElement('div'); d.innerHTML = h||''; return d.textContent.trim(); }

function blockEl(page, b, list, idx){
    const el = document.createElement('div');
    el.className = 'blk' + (b.done ? ' done' : '');
    el.dataset.t = b.t; el.dataset.id = b.id;
    el.innerHTML = `
        <div class="blk-handles">
            <button class="hbtn" data-plus title="Blok toevoegen"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="hbtn grab" data-grab title="Slepen / opties"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
        </div>
        <div class="blk-body">${bodyHTML(b, list, idx)}</div>`;

    const ce = el.querySelector('.ce');
    if(ce){
        ce.addEventListener('input', () => { b.x = ce.innerHTML; markdownShortcut(page, b, ce, el, list, idx); touch(page); });
        ce.addEventListener('keydown', e => blockKeys(e, page, b, ce, list, idx));
        ce.addEventListener('paste', e => {
            e.preventDefault();
            const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, txt);
        });
    }
    // handles
    el.querySelector('[data-plus]').onclick = () => {
        const nb = blankBlock(); list.splice(idx+1, 0, nb); save(); refreshBlocks();
        focusBlock(nb.id); setTimeout(() => openSlash(nb.id), 40);
    };
    const grab = el.querySelector('[data-grab]');
    grab.onclick = e => blockMenu(page, b, list, idx, e.currentTarget);
    grab.draggable = true;
    grab.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/block', b.id);
        e.dataTransfer.effectAllowed = 'move';
        el.classList.add('dragging');
        window.__dragList = list;
    });
    grab.addEventListener('dragend', () => { el.classList.remove('dragging'); $$('.blk').forEach(x => x.classList.remove('drop-above','drop-below')); });
    el.addEventListener('dragover', e => {
        if(!e.dataTransfer.types.includes('text/block')) return;
        e.preventDefault();
        const r = el.getBoundingClientRect();
        const above = e.clientY < r.top + r.height/2;
        el.classList.toggle('drop-above', above); el.classList.toggle('drop-below', !above);
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-above','drop-below'));
    el.addEventListener('drop', e => {
        if(!e.dataTransfer.types.includes('text/block')) return;
        e.preventDefault();
        const above = el.classList.contains('drop-above');
        el.classList.remove('drop-above','drop-below');
        const srcId = e.dataTransfer.getData('text/block');
        const srcList = window.__dragList || list;
        const from = srcList.findIndex(x => x.id === srcId);
        if(from < 0) return;
        const [moved] = srcList.splice(from,1);
        let to = list.findIndex(x => x.id === b.id);
        if(!above) to++;
        list.splice(to, 0, moved);
        save(); refreshBlocks();
    });

    // type-specific wiring
    if(b.t === 'todo'){
        el.querySelector('.cb').onclick = () => { b.done = !b.done; touch(page); refreshBlocks(); };
    }
    if(b.t === 'toggle'){
        const arrow = el.querySelector('.tg-arrow');
        const body = el.querySelector('.tg-body');
        arrow.onclick = () => { b.open = !b.open; arrow.classList.toggle('open', b.open); body.classList.toggle('open', b.open); save(); };
        if(b.open){
            b.kids = b.kids || [blankBlock()];
            b.kids.forEach((k,i) => body.appendChild(blockEl(page, k, b.kids, i)));
        }
    }
    if(b.t === 'callout'){
        el.querySelector('.callout-icon').onclick = e => emojiMenu(e.currentTarget, v => { b.icon = v; touch(page); refreshBlocks(); });
    }
    if(b.t === 'code'){
        el.querySelector('.code-lang').onclick = e => {
            const langs = ['javascript','typescript','html','css','python','json','bash','sql','markdown','plain'];
            showMenu(e.currentTarget, langs.map(l => ({ label:l, run:() => { b.lang = l; touch(page); refreshBlocks(); } })));
        };
    }
    if(b.t === 'image'){
        const drop = el.querySelector('.img-drop');
        if(drop) drop.onclick = () => pickImage(url => { b.src = url; touch(page); refreshBlocks(); });
        const img = el.querySelector('img');
        if(img) img.onclick = () => pickImage(url => { b.src = url; touch(page); refreshBlocks(); });
    }
    if(b.t === 'pagelink'){
        const link = el.querySelector('.pagelink');
        link.onclick = () => {
            if(b.ref && P(b.ref)) go(b.ref);
            else pagePicker(id => { b.ref = id; touch(page); refreshBlocks(); });
        };
    }
    return el;
}

function bodyHTML(b, list, idx){
    const ph = PLACEHOLDERS[b.t] || '';
    const ce = (extra='') => `<div class="ce" contenteditable="true" spellcheck="false" data-ph="${ph}" ${extra}>${b.x||''}</div>`;
    switch(b.t){
        case 'divider': return '<hr>';
        case 'todo': return `<div class="cb ${b.done?'on':''}"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></div>${ce()}`;
        case 'bullet': return `<span class="marker">•</span>${ce()}`;
        case 'number': {
            let n = 1;
            for(let i = idx-1; i >= 0; i--){ if(list[i].t === 'number') n++; else break; }
            return `<span class="marker">${n}.</span>${ce()}`;
        }
        case 'code': return `<button class="code-lang">${b.lang||'plain'}</button>${ce()}`;
        case 'callout': return `<span class="callout-icon">${b.icon||'💡'}</span><div style="flex:1;">${ce()}</div>`;
        case 'toggle': return `<div class="tg-head"><span class="tg-arrow ${b.open?'open':''}"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M9 6l6 6-6 6z"/></svg></span><div style="flex:1;">${ce()}</div></div><div class="tg-body ${b.open?'open':''}"></div>`;
        case 'image': return b.src ? `<img src="${b.src}" alt="">` : `<div class="img-drop">🖼️ Klik om een afbeelding te kiezen</div>`;
        case 'pagelink': {
            const t = b.ref && P(b.ref);
            return `<div class="pagelink">${t ? (t.icon||'📄') : '🔗'} ${t ? esc(t.title||'Naamloos') : 'Kies een pagina…'}</div>`;
        }
        default: return ce();
    }
}

/* ---------- keyboard ---------- */
function blockKeys(e, page, b, ce, list, idx){
    const empty = !stripTags(ce.innerHTML);

    if(e.key === 'Enter' && !e.shiftKey && b.t !== 'code'){
        e.preventDefault();
        // empty list item → convert back to text
        if(['todo','bullet','number','quote'].includes(b.t) && empty){
            b.t = 'text'; b.x = ''; save(); refreshBlocks(); focusBlock(b.id); return;
        }
        const carry = ['todo','bullet','number'].includes(b.t) ? b.t : 'text';
        const nb = blankBlock(carry);
        // split text at caret
        const sel = window.getSelection();
        if(sel.rangeCount){
            const r = sel.getRangeAt(0);
            const after = r.cloneRange();
            after.selectNodeContents(ce); after.setStart(r.endContainer, r.endOffset);
            const frag = after.extractContents();
            const tmp = document.createElement('div'); tmp.appendChild(frag);
            nb.x = tmp.innerHTML;
            b.x = ce.innerHTML;
        }
        list.splice(idx+1, 0, nb); save(); refreshBlocks(); focusBlock(nb.id);
        return;
    }
    if(e.key === 'Enter' && e.shiftKey && b.t !== 'code'){
        e.preventDefault(); document.execCommand('insertLineBreak'); b.x = ce.innerHTML; touch(page); return;
    }
    if(e.key === 'Backspace' && empty){
        e.preventDefault();
        if(b.t !== 'text'){ b.t = 'text'; b.done = false; save(); refreshBlocks(); focusBlock(b.id); return; }
        if(list.length > 1){
            const prev = list[idx-1];
            list.splice(idx,1); save(); refreshBlocks();
            if(prev) focusBlock(prev.id, true);
        }
        return;
    }
    if(e.key === 'Tab'){
        e.preventDefault();
        if(b.t === 'code'){ document.execCommand('insertText', false, '  '); b.x = ce.innerHTML; touch(page); return; }
        // indent list into previous toggle-like nesting is out of scope: use spaces marker
        return;
    }
    if(e.key === 'ArrowUp' && !e.shiftKey){
        const prev = list[idx-1];
        if(prev && caretAtStart(ce)){ e.preventDefault(); focusBlock(prev.id, true); }
        return;
    }
    if(e.key === 'ArrowDown' && !e.shiftKey){
        const next = list[idx+1];
        if(next && caretAtEnd(ce)){ e.preventDefault(); focusBlock(next.id); }
        return;
    }
    if(e.key === '/' && empty){ setTimeout(() => openSlash(b.id), 0); return; }
    if(e.key === 'Escape'){ closeMenus(); }
    // inline formatting
    if((e.metaKey || e.ctrlKey) && ['b','i','u','e'].includes(e.key.toLowerCase())){
        e.preventDefault();
        const k = e.key.toLowerCase();
        if(k === 'b') document.execCommand('bold');
        if(k === 'i') document.execCommand('italic');
        if(k === 'u') document.execCommand('underline');
        if(k === 'e'){ wrapCode(); }
        b.x = ce.innerHTML; touch(page);
    }
}
function wrapCode(){
    const sel = window.getSelection(); if(!sel.rangeCount || sel.isCollapsed) return;
    const txt = sel.toString();
    document.execCommand('insertHTML', false,
        `<code style="background:var(--hover);padding:1px 5px;border-radius:4px;font-family:'Space Mono',monospace;font-size:.88em;color:#eb5757;">${esc(txt)}</code>&nbsp;`);
}
function caretAtStart(el){
    const s = window.getSelection(); if(!s.rangeCount) return false;
    const r = s.getRangeAt(0).cloneRange(); r.selectNodeContents(el); r.setEnd(s.getRangeAt(0).startContainer, s.getRangeAt(0).startOffset);
    return r.toString().length === 0;
}
function caretAtEnd(el){
    const s = window.getSelection(); if(!s.rangeCount) return false;
    const r = s.getRangeAt(0).cloneRange(); r.selectNodeContents(el); r.setStart(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset);
    return r.toString().length === 0;
}
function placeCaretEnd(el){
    el.focus();
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusBlock(id, atEnd){
    const el = document.querySelector(`.blk[data-id="${id}"] .ce`);
    if(!el) return;
    if(atEnd) placeCaretEnd(el); else { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(true); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
}

/* ---------- markdown shortcuts ---------- */
const MD = [
    [/^#\s/, 'h1'], [/^##\s/, 'h2'], [/^###\s/, 'h3'],
    [/^[-*+]\s/, 'bullet'], [/^1\.\s/, 'number'],
    [/^\[\]\s/, 'todo'], [/^\[\s?\]\s/, 'todo'],
    [/^>\s/, 'quote'], [/^```\s?/, 'code'],
    [/^---$/, 'divider'], [/^\/\/\s/, 'callout'], [/^>>\s/, 'toggle']
];
function markdownShortcut(page, b, ce, el, list, idx){
    if(b.t !== 'text') return;
    const txt = ce.textContent;
    for(const [re, type] of MD){
        if(re.test(txt)){
            b.t = type; b.x = txt.replace(re,'');
            if(type === 'divider'){ b.x = ''; list.splice(idx+1,0,blankBlock()); }
            if(type === 'todo') b.done = false;
            save(); refreshBlocks();
            if(type === 'divider'){ focusBlock(list[idx+1].id); } else focusBlock(b.id, true);
            return;
        }
    }
}

function placeMenu(menu, anchor, ev){
    menu.classList.add('on');
    const r = anchor ? anchor.getBoundingClientRect() : { left: ev.clientX, bottom: ev.clientY, top: ev.clientY, width:0 };
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = r.left, top = r.bottom + 6;
    if(left + mw > innerWidth - 10) left = innerWidth - mw - 10;
    if(top + mh > innerHeight - 10) top = Math.max(10, r.top - mh - 6);
    menu.style.left = Math.max(10,left) + 'px';
    menu.style.top = top + 'px';
    placeMenu._t = Date.now();
}
function showMenu(anchor, items, ev){
    const m = $('#ctxMenu');
    m.innerHTML = items.map((it,i) => it.sep

let slashCtx = null;
function openSlash(blockId){
    const page = P(cur);
    let found = findBlock(page, blockId);
    if(!found && peekCtx) found = findBlock({ blocks: peekCtx.row.blocks }, blockId);
    if(!found) return;
    slashCtx = { page, ...found, q:'' };
    const anchor = document.querySelector(`.blk[data-id="${blockId}"] .ce`);
    drawSlash();
    placeMenu($('#slashMenu'), anchor);
    slashCtx.keyHandler = e => {
        const items = slashItems();
        if(e.key === 'Escape'){ closeMenus(); cleanupSlash(); return; }
        if(e.key === 'ArrowDown'){ e.preventDefault(); slashCtx.i = Math.min((slashCtx.i||0)+1, items.length-1); drawSlash(); return; }
        if(e.key === 'ArrowUp'){ e.preventDefault(); slashCtx.i = Math.max((slashCtx.i||0)-1, 0); drawSlash(); return; }
        if(e.key === 'Enter'){ e.preventDefault(); applySlash(items[slashCtx.i||0]); return; }
        setTimeout(() => {
            const txt = anchor.textContent;
            const m = txt.match(/\/([^\/]*)$/);
            if(!m){ closeMenus(); cleanupSlash(); return; }
            slashCtx.q = m[1]; slashCtx.i = 0; drawSlash();
        }, 0);
    };
    anchor.addEventListener('keydown', slashCtx.keyHandler);
}
function cleanupSlash(){
    if(slashCtx){
        const a = document.querySelector(`.blk[data-id="${slashCtx.b.id}"] .ce`);
        if(a && slashCtx.keyHandler) a.removeEventListener('keydown', slashCtx.keyHandler);
    }
    slashCtx = null;
}
function slashItems(){
    const q = (slashCtx.q||'').toLowerCase();
    return BLOCK_TYPES.filter(t => !q || t.label.toLowerCase().includes(q) || t.t.includes(q));
}
function drawSlash(){
    const m = $('#slashMenu');
    const items = slashItems();
    slashCtx.i = Math.min(slashCtx.i||0, Math.max(0, items.length-1));
    m.innerHTML = '<div class="menu-grp">Blokken</div>' + (items.length
        ? items.map((t,i) => `<button class="mi ${i===slashCtx.i?'hl':''}" data-t="${t.t}">
            <span class="mi-ico">${t.icon}</span>
            <span class="mi-txt"><b>${t.label}</b><span>${t.sub}</span></span></button>`).join('')
        : '<div class="empty-note">Geen resultaat</div>');
    m.classList.add('on');
    m.querySelectorAll('[data-t]').forEach((btn,i) => btn.onmousedown = e => { e.preventDefault(); applySlash(items[i]); });
    const hl = m.querySelector('.hl'); if(hl && hl.scrollIntoView) hl.scrollIntoView({block:'nearest'});
}
function applySlash(type){
    if(!type || !slashCtx) return;
    const { page, b, list, idx } = slashCtx;
    // strip the "/query"
    const el = document.querySelector(`.blk[data-id="${b.id}"] .ce`);
    if(el){ b.x = el.innerHTML.replace(/\/[^\/<]*$/, ''); }
    closeMenus();
    const t = type.t;
    if(t === 'newpage'){
        const np = newPage({ parent: page.id }); S.pages[np.id] = np;
        page.children.push(np.id); page.open = true;
        b.t = 'pagelink'; b.ref = np.id; b.x = '';
        save(); renderSidebar(); refreshBlocks(); cleanupSlash(); return;
    }
    if(t === 'newdb'){
        const nd = newDatabase({ parent: page.id, title:'Nieuwe database' }); S.pages[nd.id] = nd;
        page.children.push(nd.id); page.open = true;
        b.t = 'pagelink'; b.ref = nd.id; b.x = '';
        save(); renderSidebar(); refreshBlocks(); cleanupSlash(); return;
    }
    if(t === 'pagelink'){
        b.t = 'pagelink'; b.x = '';
        save(); refreshBlocks(); cleanupSlash();
        pagePicker(id => { b.ref = id; save(); refreshBlocks(); });
        return;
    }
    b.t = t;
    if(t === 'todo') b.done = false;
    if(t === 'toggle'){ b.open = true; b.kids = b.kids || [blankBlock()]; }
    if(t === 'code') b.lang = b.lang || 'javascript';
    if(t === 'callout') b.icon = b.icon || '💡';
    if(t === 'divider'){ b.x = ''; list.splice(idx+1, 0, blankBlock()); }
    save(); refreshBlocks();
    if(t === 'divider') focusBlock(list[idx+1].id);
    else if(t !== 'image') focusBlock(b.id, true);
    cleanupSlash();
}
function findBlock(page, id, list){
    const arr = list || page.blocks;
    for(let i=0;i<arr.length;i++){
        if(arr[i].id === id) return { b:arr[i], list:arr, idx:i };
        if(arr[i].kids){ const r = findBlock(page, id, arr[i].kids); if(r) return r; }
    }
    return null;
}

function trashPage(id){

}

function renderDatabase(db, host){

function visibleRows(db){
    let rows = db.rows.slice();
    const q = (db.filter||'').toLowerCase().trim();
    if(q) rows = rows.filter(r => {
        if((r.title||'').toLowerCase().includes(q)) return true;
        return db.props.some(p => {
            const v = r.cells[p.id];
            return Array.isArray(v) ? v.join(' ').toLowerCase().includes(q) : String(v??'').toLowerCase().includes(q);
        });
    });
    if(db.sortBy){
        const dir = db.sortDir === 'desc' ? -1 : 1;
        rows.sort((a,b) => {
            const va = db.sortBy === 'title' ? (a.title||'') : (a.cells[db.sortBy] ?? '');
            const vb = db.sortBy === 'title' ? (b.title||'') : (b.cells[db.sortBy] ?? '');
            return String(va).localeCompare(String(vb), 'nl', {numeric:true}) * dir;
        });
    }
    return rows;
}
function drawView(db){
    const host = $('#dbView'); if(!host) return;
    ({ table:tableView, board:boardView, list:listView, gallery:galleryView, calendar:calendarView }[db.view] || tableView)(db, host);
}
