<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Life OS — KM.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="km-os.css">
<style>
/* ---------- levensgebieden ---------- */
.area-card{
    position:relative;border-radius:var(--r-md);border:1px solid var(--line);background:var(--paper);
    padding:20px;overflow:hidden;cursor:pointer;
    transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;
}
.area-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);}
.area-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:var(--c);}
.area-card .ai{font-size:24px;}
.area-card h4{font-size:15.5px;font-weight:600;margin:11px 0 4px;}
.area-card .an{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);}
.area-card .bar{margin-top:14px;}
.area-card .bar i{background:var(--c);}

/* ---------- doelkaart ---------- */
.goal{
    position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
    padding:22px;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;
}
.goal:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:var(--c);}
.goal::before{content:'';position:absolute;inset:0;opacity:.05;background:var(--c);pointer-events:none;}
.goal-top{display:flex;align-items:flex-start;gap:14px;position:relative;}
.goal-ico{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;
    background:var(--bg);border:1px solid var(--line);flex:0 0 46px;
}
.goal h3{font-size:18px;font-weight:600;line-height:1.25;}
.goal .why{font-size:13px;color:var(--text-soft);margin-top:6px;line-height:1.55;}
.goal-ring{margin-left:auto;position:relative;flex:0 0 auto;}
.goal-ring .pct{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;
}
.goal .ring .val{stroke:var(--c);}
.goal-foot{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);flex-wrap:wrap;position:relative;}
.mini{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);}

/* ---------- projecten / taken ---------- */
.plist{display:flex;flex-direction:column;gap:9px;}
.prow{
    display:flex;align-items:center;gap:13px;padding:14px 17px;border-radius:14px;
    border:1px solid var(--line);background:var(--paper);cursor:pointer;
    transition:all .24s var(--ease);
}
.prow:hover{border-color:var(--text-faint);transform:translateX(4px);box-shadow:var(--shadow-soft);}
.prow .pi{font-size:19px;flex:0 0 auto;}
.prow .pt{flex:1;min-width:0;}
.prow .pt b{display:block;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;letter-spacing:-.015em;}
.prow .pt span{font-size:12px;color:var(--text-faint);}
.prow .pbar{width:92px;flex:0 0 92px;}

.trow{
    display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:13px;
    border:1px solid var(--line);background:var(--paper);transition:all .22s var(--ease);
}
.trow:hover{border-color:var(--text-faint);transform:translateX(3px);}
.trow.done{opacity:.55;}
.trow.done .tt{text-decoration:line-through;color:var(--text-faint);}
.cbx{
    width:19px;height:19px;border-radius:6px;border:1.6px solid var(--text-faint);flex:0 0 19px;
    display:grid;place-items:center;transition:all .2s var(--ease);cursor:pointer;
}
.cbx:hover{border-color:var(--accent-ink);transform:scale(1.14);}
.cbx.on{background:var(--accent);border-color:var(--accent);}
.cbx svg{opacity:0;color:var(--accent-ink);} .cbx.on svg{opacity:1;}
.tt{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tdel{opacity:0;transition:opacity .16s;}
.trow:hover .tdel{opacity:.6;}
.due{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--text-faint);white-space:nowrap;}
.due.late{color:var(--danger);font-weight:700;}
.due.now{color:var(--accent-ink);font-weight:700;}
html[data-theme="dark"] .due.now{color:var(--accent);}

/* ---------- eisenhower ---------- */
.eis{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.quad{
    border:1px solid var(--line);border-radius:var(--r-md);padding:16px;min-height:210px;
    background:var(--paper);transition:box-shadow .25s,border-color .25s;
}
.quad.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.quad-h{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
.quad-h b{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;}
.quad-h .q-n{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);}
.quad-h .q-d{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
.quad .plist{gap:7px;}
.quad .trow{padding:10px 13px;cursor:grab;font-size:13.5px;}
.quad .trow:active{cursor:grabbing;}
.quad .trow.drag{opacity:.35;}
.quad .tt{font-size:13.5px;}
.quad-note{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.5;}

/* ---------- gewoontes ---------- */
.habit{
    display:flex;align-items:center;gap:15px;padding:16px 18px;border-radius:var(--r-md);
    border:1px solid var(--line);background:var(--paper);transition:all .24s var(--ease);
}
.habit:hover{border-color:var(--hc);box-shadow:var(--shadow-soft);}
.habit-ico{
    width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;
    background:var(--bg);border:1px solid var(--line);flex:0 0 42px;
}
.habit-t{flex:1;min-width:0;}
.habit-t b{display:block;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;}
.habit-t span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint);}
.heat{display:flex;gap:3px;flex:0 0 auto;}
.heat i{width:9px;height:22px;border-radius:3px;background:var(--line);transition:background .3s,transform .3s var(--ease);}
.heat i.on{background:var(--hc);}
.heat i:hover{transform:scaleY(1.2);}
.hcheck{
    width:38px;height:38px;border-radius:12px;border:1.6px solid var(--line);flex:0 0 38px;
    display:grid;place-items:center;transition:all .24s var(--ease);cursor:pointer;font-size:16px;color:var(--text-faint);
}
.hcheck:hover{border-color:var(--hc);transform:scale(1.06);}
.hcheck.on{background:var(--hc);border-color:var(--hc);color:#fff;}

/* ---------- review ---------- */
.rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:14px;}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;transition:height .8s var(--ease);}
.spark i.dim{background:var(--line);}

@media(max-width:820px){
    .eis{grid-template-columns:1fr;}
    .heat{display:none;}
}
</style>
</head>
<body>

<div class="os">
    <div class="os-body">
        <div class="os-scroll"><div class="pad"><div class="wrap" id="view"></div></div></div>
    </div>
</div>

<script src="km-brand.js"></script>
<script src="km-os.js"></script>
<script src="km-viz.js"></script>
<script src="km-live.js"></script>
<script>
if(KM.boot()){

var $ = KM.$, $$ = KM.$$, OS = KM.OS, D = OS.data, esc = KM.esc, V = KMviz, L = KMlive;
var tab = location.hash.slice(1) || 'today';

KM.shell({
    app:'life',
    tabs:[
        { id:'today',   name:'Vandaag' },
        { id:'goals',   name:'Doelen' },
        { id:'projects',name:'Projecten' },
        { id:'matrix',  name:'Prioriteiten' },
        { id:'habits',  name:'Gewoontes' },
        { id:'review',  name:'Review' }
    ].map(function(t){ t.on = t.id === tab; return t; }),
    actionsHTML:'<button class="btn accent sm" id="addBtn">＋ Nieuw</button>',
    onTab:function(t){ tab = t; location.hash = t; render(); }
});
$('#addBtn').onclick = function(){ quickAdd(); };

/* =========================================================
   HELPERS
   ========================================================= */
function dueClass(d){
    var n = KM.dayDiff(d);
    if(n === null) return '';
    if(n < 0) return 'late';
    if(n === 0) return 'now';
    return '';
}
function prioOf(id){ return KM.PRIOS.filter(function(p){ return p.id === id; })[0] || KM.PRIOS[2]; }
function tagPill(txt, hex){ return '<span class="tag" style="background:' + hex + '1e;color:' + hex + ';">' + esc(txt) + '</span>'; }

function taskRow(t, opts){
    opts = opts || {};
    var a = KM.areaOf(t.area), pr = prioOf(t.prio);
    var pj = t.projectId ? KM.q.project(t.projectId) : null;
    return '<div class="trow' + (t.status === 'done' ? ' done' : '') + '" data-t="' + t.id + '" draggable="' + (!!opts.drag) + '">' +
        '<span class="cbx' + (t.status === 'done' ? ' on' : '') + '" data-check><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>' +
        '<span class="tt" data-open>' + esc(t.title) + '</span>' +
        (opts.slim ? '' : (pj ? '<span class="mini">' + esc(pj.title) + '</span>' : '')) +
        (t.due ? '<span class="due ' + dueClass(t.due) + '">' + KM.fmtDate(t.due) + '</span>' : '') +
        (opts.slim ? '' : tagPill(pr.name, pr.color)) +
        (opts.slim ? '' : tagPill(a.icon, a.hex)) +
        '<button class="iconbtn tdel" data-del title="Verwijderen"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
    '</div>';
}
function bindTasks(root){
    $$('[data-t]', root).forEach(function(row){
        var t = KM.q.task(row.dataset.t); if(!t) return;
        var cb = $('[data-check]', row);
        if(cb) cb.onclick = function(e){
            e.stopPropagation();
            t.status = t.status === 'done' ? 'todo' : 'done';
            t.doneAt = t.status === 'done' ? Date.now() : null;
            OS.save(); KM.track('task_toggle', { done:t.status === 'done' });
            KMlive.log(t.status === 'done' ? 'task_done' : 'task_new', (t.status === 'done' ? 'Afgevinkt: ' : 'Weer open: ') + t.title);
            row.classList.toggle('done', t.status === 'done');
            cb.classList.toggle('on', t.status === 'done');
            setTimeout(render, 420);
        };
        var op = $('[data-open]', row);
        if(op) op.onclick = function(){ editTask(t); };
        var dl = $('[data-del]', row);
        if(dl) dl.onclick = function(e){
            e.stopPropagation();
            var i = D.tasks.indexOf(t);
            D.tasks.splice(i,1); OS.save(); render();
            KM.toast('Taak verwijderd', null, 'Terug', function(){ D.tasks.splice(i,0,t); OS.save(); render(); });
        };
    });
}

/* =========================================================
   VIEWS
   ========================================================= */
function render(){
    var v = $('#view');
    ({ today:vToday, goals:vGoals, projects:vProjects, matrix:vMatrix, habits:vHabits, review:vReview }[tab] || vToday)(v);
}

/* ---------- vandaag ---------- */
function vToday(v){
    var today = KM.q.today().sort(function(a,b){ return a.prio.localeCompare(b.prio); });
    var soon  = KM.q.open().filter(function(t){ var n = KM.dayDiff(t.due); return n !== null && n > 0 && n <= 7; })
                     .sort(function(a,b){ return (a.due||'').localeCompare(b.due||''); });
    var inbox = KM.q.open().filter(function(t){ return !t.projectId && !t.due; });
    var td = KM.iso();

    v.innerHTML =
        '<div class="grid g2" style="margin-bottom:26px;">' +
            card('Momentum', KM.q.momentum() + '%', 'laatste 7 dagen actief', spark(14)) +
            card('Vandaag af', D.tasks.filter(function(t){ return t.doneAt && KM.iso(new Date(t.doneAt)) === td; }).length, 'taken afgerond') +
            card('Open', KM.q.open().length, 'taken in het systeem') +
            card('Gewoontes', D.habits.filter(function(h){ return h.log[td]; }).length + '/' + D.habits.length, 'vandaag afgevinkt') +
        '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Vandaag</h2><span class="mini">' + today.length + ' taken</span></div>' +
        '<div class="plist" id="l1">' + (today.length ? today.map(function(t){ return taskRow(t); }).join('') : '<div class="empty">Niets voor vandaag — mooi zo</div>') + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Komende week</h2></div>' +
        '<div class="plist" id="l2">' + (soon.length ? soon.map(function(t){ return taskRow(t); }).join('') : '<div class="empty">Niets ingepland</div>') + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Inbox</h2><span class="mini">' + inbox.length + ' zonder project of datum</span></div>' +
        '<div class="plist" id="l3">' + (inbox.length ? inbox.map(function(t){ return taskRow(t); }).join('') : '<div class="empty">Inbox is leeg</div>') + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Gewoontes vandaag</h2>' +
            '<span class="label">' + D.habits.filter(function(h){ return h.log[td]; }).length + ' van ' + D.habits.length + ' af</span></div>' +
        '<div class="grid g2" id="hq">' + D.habits.map(habitMini).join('') + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Ritme</h2><span class="label">laatste 17 weken</span></div>' +
        '<div class="card">' + V.heatmap({ days:heatDays(), weeks:17 }) + '</div>';

    bindTasks(v);
    bindHabitMini(v);
    V.animate(v);
}
function card(label, big, sub, extra){
    return '<div class="card rise"><div class="stat"><span>' + label + '</span>' +
        '<b>' + big + '</b><span style="letter-spacing:0;text-transform:none;font-family:Inter,sans-serif;font-size:12.5px;">' + sub + '</span></div>' +
        (extra || '') + '</div>';
}
function dayScore(dayISO){
    return D.tasks.filter(function(t){ return t.doneAt && KM.iso(new Date(t.doneAt)) === dayISO; }).length
         + D.habits.filter(function(h){ return h.log[dayISO]; }).length;
}
function seriesOf(n){
    var v = [], l = [];
    for(var i = n - 1; i >= 0; i--){
        var k = KM.iso(KM.addDays(new Date(), -i));
        v.push(dayScore(k)); l.push(k);
    }
    return { values:v, labels:l };
}
function spark(n){
    var s = seriesOf(n || 14);
    return V.area({ points:s.values, labels:s.labels, w:420, h:96, dots:false });
}
function heatDays(){
    var m = {};
    D.tasks.forEach(function(t){ if(t.doneAt){ var k = KM.iso(new Date(t.doneAt)); m[k] = (m[k]||0)+1; } });
    D.habits.forEach(function(h){ Object.keys(h.log).forEach(function(k){ m[k] = (m[k]||0)+1; }); });
    return m;
}
function balance(){
    return KM.AREAS.map(function(a){
        var ts = D.tasks.filter(function(t){ return t.area === a.id; });
        var done = ts.filter(function(t){ return t.status === 'done'; }).length;
        var gs = D.goals.filter(function(g){ return g.area === a.id; }).length;
        var recent = D.tasks.filter(function(t){ return t.area === a.id && t.doneAt && t.doneAt > Date.now() - 14*864e5; }).length;
        var v = Math.min(1, (gs * .22) + (ts.length ? done/ts.length * .4 : 0) + Math.min(.38, recent * .13));
        return { label:a.name.split(' ')[0], icon:a.icon, color:a.hex, value:Math.max(.06, v) };
    });
}
function habitMini(h){
    var on = !!h.log[KM.iso()];
    return '<div class="habit rise" style="--hc:' + h.color + '" data-h="' + h.id + '">' +
        '<span class="habit-ico">' + h.icon + '</span>' +
        '<span class="habit-t"><b>' + esc(h.title) + '</b><span>' + KM.q.streak(h) + ' dagen op rij</span></span>' +
        '<span class="hcheck' + (on ? ' on' : '') + '" data-hc>✓</span>' +
    '</div>';
}
function bindHabitMini(root){
    $$('[data-h]', root).forEach(function(el){
        var h = D.habits.filter(function(x){ return x.id === el.dataset.h; })[0]; if(!h) return;
        var b = $('[data-hc]', el); if(!b) return;
        b.onclick = function(){
            var d = KM.iso();
            if(h.log[d]) delete h.log[d]; else h.log[d] = true;
            b.classList.toggle('on', !!h.log[d]);
            $('.habit-t span', el).textContent = KM.q.streak(h) + ' dagen op rij';
            OS.save(); KM.track('habit_toggle', { on: !!h.log[d] });
            if(h.log[d]) KMlive.log('habit', h.title + ' afgevinkt — ' + KM.q.streak(h) + ' op rij');
        };
    });
}

/* ---------- doelen ---------- */
function vGoals(v){
    v.innerHTML =
        '<div class="sec-head"><h2 class="grotesk">Levensbalans</h2><span class="mini">waar gaat je aandacht heen?</span></div>' +
        '<div class="card" style="display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center;">' +
            V.radar({ axes:balance(), size:280 }) +
            '<div class="viz-key" style="min-width:190px;">' + KM.AREAS.map(function(a){
                var gs = D.goals.filter(function(g){ return g.area === a.id; }).length;
                var ts = D.tasks.filter(function(t){ return t.area === a.id; }).length;
                return '<div class="k"><i style="background:' + a.hex + '"></i>' + a.icon + ' ' + esc(a.name) + '<b>' + gs + 'd · ' + ts + 't</b></div>';
            }).join('') + '</div>' +
        '</div>' +
        '<div class="sec-head"><h2 class="grotesk">Levensgebieden</h2><span class="mini">klik om te filteren</span></div>' +
        '<div class="grid g3">' + KM.AREAS.map(function(a){
            var gs = D.goals.filter(function(g){ return g.area === a.id; });
            var ts = D.tasks.filter(function(t){ return t.area === a.id; });
            var pct = ts.length ? Math.round(ts.filter(function(t){ return t.status === 'done'; }).length / ts.length * 100) : 0;
            return '<div class="area-card rise" style="--c:' + a.hex + '" data-area="' + a.id + '">' +
                '<div class="ai">' + a.icon + '</div><h4 class="grotesk">' + esc(a.name) + '</h4>' +
                '<div class="an">' + gs.length + ' doelen · ' + ts.length + ' taken</div>' +
                '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '</div>';
        }).join('') + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Doelen</h2>' +
            '<button class="btn sm" id="newGoal">＋ Doel</button></div>' +
        '<div class="grid g2" id="goalGrid">' + (D.goals.length ? D.goals.map(goalCard).join('') : '<div class="empty">Nog geen doelen</div>') + '</div>';

    V.animate(v);
    $('#newGoal').onclick = function(){ editGoal(); };
    $$('[data-goal]', v).forEach(function(el){
        el.onclick = function(e){
            if(e.target.closest('[data-gact]')) return;
            editGoal(KM.q.goal(el.dataset.goal));
        };
    });
    $$('[data-area]', v).forEach(function(el){
        el.onclick = function(){ tab = 'projects'; location.hash = 'projects'; areaFilter = el.dataset.area; render(); };
    });
}
function goalCard(g){
    var a = KM.areaOf(g.area);
    var pct = KM.q.progress(g.id);
    var pj = KM.q.projectsOfGoal(g.id);
    var hz = KM.HORIZONS.filter(function(h){ return h.id === g.horizon; })[0] || KM.HORIZONS[1];
    var dd = KM.dayDiff(g.due);
    return '<div class="goal rise" style="--c:' + a.hex + '" data-goal="' + g.id + '">' +
        '<div class="goal-top">' +
            '<span class="goal-ico">' + (g.icon || '🎯') + '</span>' +
            '<div style="flex:1;min-width:0;"><h3 class="grotesk">' + esc(g.title) + '</h3>' +
                '<div class="why">' + esc(g.why || '') + '</div></div>' +
            '<div class="goal-ring">' + V.ring(pct, 58, 5, a.hex) + '<span class="pct">' + pct + '%</span></div>' +
        '</div>' +
        '<div class="goal-foot">' +
            tagPill(a.icon + ' ' + a.name, a.hex) +
            '<span class="mini">' + hz.name + '</span>' +
            '<span class="mini">' + pj.length + ' projecten</span>' +
            (g.due ? '<span class="due ' + dueClass(g.due) + '" style="margin-left:auto;">' + (dd !== null && dd > 0 ? 'nog ' + dd + ' dagen' : KM.fmtDate(g.due)) + '</span>' : '') +
        '</div>' +
    '</div>';
}

/* ---------- projecten ---------- */
var areaFilter = '';
function vProjects(v){
    var list = D.projects.filter(function(p){ return !areaFilter || p.area === areaFilter; });
    v.innerHTML =

/* ---------- prioriteitenmatrix (Eisenhower) ---------- */
var QUADS = [
    { id:'q1', name:'Doen',      note:'Urgent én belangrijk',       color:'#d1503f', prio:'p1' },
    { id:'q2', name:'Plannen',   note:'Belangrijk, niet urgent',    color:'#2383e2', prio:'p2' },
    { id:'q3', name:'Delegeren', note:'Urgent, niet belangrijk',    color:'#e8a33d', prio:'p3' },
    { id:'q4', name:'Schrappen', note:'Niet urgent, niet belangrijk',color:'#8f8d85', prio:'p4' }
];
function vMatrix(v){
    var open = KM.q.open();
    v.innerHTML =
        '<div class="sec-head"><h2 class="grotesk">Prioriteitenmatrix</h2>' +
            '<span class="mini">sleep taken tussen de vakken om ze te herprioriteren</span></div>' +
        '<div class="eis">' + QUADS.map(function(q){
            var ts = open.filter(function(t){ return (t.prio || 'p3') === q.prio; });
            return '<div class="quad rise" data-q="' + q.prio + '">' +
                '<div class="quad-h"><span class="q-d" style="background:' + q.color + '"></span>' +
                    '<b>' + q.name + '</b><span class="q-n">' + ts.length + '</span></div>' +
                '<div class="quad-note">' + q.note + '</div>' +
                '<div class="plist" style="margin-top:12px;">' + ts.map(function(t){ return taskRow(t, { slim:true, drag:true }); }).join('') + '</div>' +
            '</div>';
        }).join('') + '</div>' +
        '<div class="sec-head"><h2 class="grotesk">Energie-verdeling</h2></div>' +
        '<div class="grid g4">' + KM.ENERGY.map(function(e){
            var n = open.filter(function(t){ return t.energy === e.id; }).length;
            var mins = n * e.mins;
            return '<div class="card rise"><div class="stat"><span>' + e.icon + ' ' + e.name + '</span><b>' + n + '</b>' +
                '<span style="text-transform:none;letter-spacing:0;font-family:Inter,sans-serif;font-size:12.5px;">≈ ' + Math.round(mins/60*10)/10 + ' uur werk</span></div></div>';
        }).join('') + '</div>';

    bindTasks(v);
    // drag & drop tussen kwadranten
    $$('.trow[draggable="true"]', v).forEach(function(row){
        row.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/task', row.dataset.t); row.classList.add('drag'); });
        row.addEventListener('dragend', function(){ row.classList.remove('drag'); });
    });
    $$('.quad', v).forEach(function(q){
        q.addEventListener('dragover', function(e){ if(e.dataTransfer.types.includes('text/task')){ e.preventDefault(); q.classList.add('over'); } });
        q.addEventListener('dragleave', function(){ q.classList.remove('over'); });
        q.addEventListener('drop', function(e){
            e.preventDefault(); q.classList.remove('over');
            var t = KM.q.task(e.dataTransfer.getData('text/task'));
            if(!t) return;
            t.prio = q.dataset.q; OS.save(); render();
            KM.toast('Verplaatst naar ' + QUADS.filter(function(x){ return x.prio === q.dataset.q; })[0].name);
        });
    });
}

/* ---------- gewoontes ---------- */
function vHabits(v){
    v.innerHTML =
        '<div class="sec-head"><h2 class="grotesk">Gewoontes</h2>' +
            '<button class="btn sm" id="newHabit">＋ Gewoonte</button></div>' +
        '<div class="plist">' + (D.habits.length ? D.habits.map(habitRow).join('') : '<div class="empty">Nog geen gewoontes</div>') + '</div>';

    V.animate(v);
    $('#newHabit').onclick = function(){ editHabit(); };
    $$('[data-h]', v).forEach(function(el){
        var h = D.habits.filter(function(x){ return x.id === el.dataset.h; })[0];
        $('[data-hc]', el).onclick = function(){
            var d = KM.iso();
            if(h.log[d]) delete h.log[d]; else h.log[d] = true;
            OS.save(); L.log('habit', h.title + (h.log[d] ? ' afgevinkt' : ' teruggedraaid')); render();
        };
        $('[data-hedit]', el).onclick = function(e){ e.stopPropagation(); editHabit(h); };
        $$('.hm-c', el).forEach(function(cell){
            cell.onclick = function(){
                var d = cell.dataset.d;
                if(!d || KM.dayDiff(d) > 0) return;
                if(h.log[d]) delete h.log[d]; else h.log[d] = true;
                OS.save(); render();
            };
            cell.style.cursor = 'pointer';
        });
    });
}
function habitRow(h){
    var days = {};
    Object.keys(h.log).forEach(function(k){ days[k] = 1; });
    var done30 = Object.keys(h.log).filter(function(d){ return KM.dayDiff(d) >= -29; }).length;
    var done90 = Object.keys(h.log).filter(function(d){ return KM.dayDiff(d) >= -89; }).length;
    return '<div class="card rise" style="--hc:' + h.color + '" data-h="' + h.id + '">' +
        '<div style="display:flex;align-items:center;gap:15px;margin-bottom:16px;">' +
            '<span class="habit-ico">' + h.icon + '</span>' +
            '<span class="habit-t"><b>' + esc(h.title) + '</b>' +
                '<span>' + KM.q.streak(h) + ' op rij · ' + Math.round(done30/30*100) + '% deze maand · ' + done90 + ' in 90 dagen</span></span>' +
            V.ring(Math.round(done30/30*100), 44, 4, h.color) +
            '<button class="iconbtn" data-hedit><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/></svg></button>' +
            '<span class="hcheck' + (h.log[KM.iso()] ? ' on' : '') + '" data-hc>✓</span>' +
        '</div>' +
        V.heatmap({ days:days, weeks:17, color:h.color }) +
    '</div>';
}

/* ---------- review ---------- */
function vReview(v){
    var wkStart = KM.startOfWeek();
    var done = D.tasks.filter(function(t){ return t.doneAt && t.doneAt >= wkStart.getTime(); });
    var late = KM.q.open().filter(function(t){ return KM.dayDiff(t.due) < 0; });
    var byArea = KM.AREAS.map(function(a){
        return { a:a, n: done.filter(function(t){ return t.area === a.id; }).length };
    }).sort(function(x,y){ return y.n - x.n; });
    var last = (D.reviews || [])[0];

    v.innerHTML =
        '<div class="sec-head"><h2 class="grotesk">Weekreview</h2><span class="mini">week van ' + wkStart.getDate() + ' ' + KM.MONTHS[wkStart.getMonth()] + '</span></div>' +
        '<div class="rev-grid">' +
            '<div class="card rise"><div class="stat"><span>Afgerond</span><b>' + done.length + '</b><span style="text-transform:none;letter-spacing:0;font-family:Inter,sans-serif;font-size:12.5px;">taken deze week</span></div>' + spark() + '</div>' +
            '<div class="card rise"><div class="stat"><span>Te laat</span><b>' + late.length + '</b><span style="text-transform:none;letter-spacing:0;font-family:Inter,sans-serif;font-size:12.5px;">taken over datum</span></div></div>' +
            '<div class="card rise"><div class="stat"><span>Momentum</span><b>' + KM.q.momentum() + '%</b><span style="text-transform:none;letter-spacing:0;font-family:Inter,sans-serif;font-size:12.5px;">dagen actief</span></div></div>' +
        '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Verloop</h2><span class="mini">taken en gewoontes per dag</span></div>' +
        '<div class="card">' + V.area({ points:seriesOf(30).values, labels:seriesOf(30).labels, w:900, h:170 }) + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Waar ging je aandacht heen?</h2></div>' +
        '<div class="card" style="margin-bottom:14px;">' + V.bars({
            items: byArea.map(function(x){ return { label:x.a.name.split(' ')[0], value:x.n, color:x.a.hex }; }), h:150
        }) + '</div>' +
        '<div class="grid g3">' + byArea.map(function(x){
            var pct = done.length ? Math.round(x.n/done.length*100) : 0;
            return '<div class="area-card rise" style="--c:' + x.a.hex + '">' +
                '<div class="ai">' + x.a.icon + '</div><h4 class="grotesk">' + esc(x.a.name) + '</h4>' +
                '<div class="an">' + x.n + ' taken · ' + pct + '%</div>' +
                '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
        }).join('') + '</div>' +

        '<div class="sec-head"><h2 class="grotesk">Jouw reflectie</h2></div>' +
        '<div class="card">' +
            '<div class="field"><label>Wat ging goed?</label><textarea class="inp" id="rWins">' + esc(last ? last.wins : '') + '</textarea></div>' +
            '<div class="field"><label>Wat hield je tegen?</label><textarea class="inp" id="rBlock">' + esc(last ? last.blockers : '') + '</textarea></div>' +
            '<div class="field"><label>Focus voor volgende week</label><textarea class="inp" id="rFocus">' + esc(last ? last.focus : '') + '</textarea></div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn accent" id="saveRev">Review opslaan</button>' +
            '<button class="btn ghost" id="exportRev">Exporteer als Markdown</button></div>' +
        '</div>' +

        ((D.reviews||[]).length > 1 ? '<div class="sec-head"><h2 class="grotesk">Eerdere reviews</h2></div><div class="plist">' +
            D.reviews.slice(1).map(function(r){
                return '<div class="prow"><span class="pi">📝</span><span class="pt"><b>' + r.date + '</b><span>' + esc((r.focus||'').slice(0,90)) + '</span></span></div>';
            }).join('') + '</div>' : '');

    V.animate(v);
    $('#saveRev').onclick = function(){
        var r = { date:KM.iso(), wins:$('#rWins').value, blockers:$('#rBlock').value, focus:$('#rFocus').value };
        D.reviews = D.reviews || [];
        if(D.reviews[0] && D.reviews[0].date === r.date) D.reviews[0] = r; else D.reviews.unshift(r);
        OS.save(); KM.toast('Review opgeslagen'); KM.track('review_saved');
        KMlive.log('review', 'Weekreview opgeslagen');
    };
    $('#exportRev').onclick = function(){
        var md = '# Weekreview ' + KM.iso() + '\n\n## Afgerond (' + done.length + ')\n' +
            done.map(function(t){ return '- ' + t.title; }).join('\n') +
            '\n\n## Wat ging goed\n' + $('#rWins').value +
            '\n\n## Wat hield me tegen\n' + $('#rBlock').value +
            '\n\n## Focus volgende week\n' + $('#rFocus').value + '\n';
        KM.download('weekreview-' + KM.iso() + '.md', md, 'text/markdown');
    };
}

    KM.modal({
        title: isNew ? 'Nieuwe gewoonte' : 'Gewoonte bewerken',
        body:'<div class="row"><div class="field" style="flex:0 0 90px;min-width:90px;"><label>Icoon</label><input class="inp" id="hI" value="' + esc(h.icon) + '" style="text-align:center;font-size:22px;"></div>' +
             '<div class="field" style="flex:1;"><label>Gewoonte</label><input class="inp" id="hT" value="' + esc(h.title) + '" placeholder="Elke dag…"></div></div>' +
             '<div class="field"><label>Kleur</label><div style="display:flex;gap:8px;flex-wrap:wrap;" id="hC">' +
                colors.map(function(c){ return '<button class="chip" data-c="' + c + '" style="background:' + c + ';width:34px;height:34px;padding:0;border-radius:50%;' + (c === h.color ? 'box-shadow:0 0 0 3px var(--accent);' : '') + '"></button>'; }).join('') +
             '</div></div>',
        actions:[].concat(isNew ? [] : [{ label:'Verwijderen', ghost:true, run:function(){ D.habits.splice(D.habits.indexOf(h),1); OS.save(); render(); } }], [
            { label:'Opslaan', accent:true, run:function(){
                h.title = $('#hT').value.trim(); if(!h.title) return false;
                h.icon = $('#hI').value.trim() || '✨';
                if(isNew) D.habits.push(h);
                OS.save(); render(); KM.toast(isNew ? 'Gewoonte toegevoegd' : 'Opgeslagen');
            }}
        ]),
        mounted:function(ov){
            $$('[data-c]', ov).forEach(function(b){
                b.onclick = function(){
                    h.color = b.dataset.c;
                    $$('[data-c]', ov).forEach(function(x){ x.style.boxShadow = x === b ? '0 0 0 3px var(--accent)' : ''; });
                };
            });
        }
    });
}

L.on('data', function(){ D = OS.data; render(); KM.toast('Bijgewerkt vanuit een ander tabblad'); });
L.on('timer', function(){ if(tab === 'today') render(); });

window.addEventListener('hashchange', function(){
    var t = location.hash.slice(1); if(!t || t === tab) return;
    tab = t;
    $$('#osTabs .os-tab').forEach(function(x){ x.classList.toggle('on', x.dataset.tab === tab); });
    render();
});

render();
}
</script>
</body>
</html>
