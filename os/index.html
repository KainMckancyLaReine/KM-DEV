<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KM.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="km-os.css">
<style>
/* ---------- hero ---------- */
.hero{position:relative;padding:40px 34px 30px;overflow:hidden;border-bottom:1px solid var(--line);}
.hero-bg{
    position:absolute;inset:0;pointer-events:none;
    background:
        radial-gradient(760px 340px at 10% -12%, rgba(198,255,74,.30), transparent 68%),
        radial-gradient(620px 300px at 88% -4%, rgba(35,131,226,.15), transparent 70%);
    animation:drift 18s ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate3d(2%,1.5%,0) scale(1.06);}}
.hero-grid{
    position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(ellipse 80% 100% at 50% 0%,#000 10%,transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 80% 100% at 50% 0%,#000 10%,transparent 80%);
}
.hero-in{position:relative;max-width:1240px;margin:0 auto;}
.hero-top{display:flex;align-items:flex-start;gap:30px;flex-wrap:wrap;}
.bigclock{
    margin-left:auto;text-align:right;flex:0 0 auto;
    font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.05em;
    font-size:clamp(34px,5vw,58px);line-height:1;color:var(--text);
}
.bigclock small{
    display:block;font-family:'Space Mono',monospace;font-size:10px;font-weight:400;
    letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-top:8px;
}
.bigclock .s{opacity:.28;font-size:.5em;}
.greet{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4vw,46px);font-weight:700;letter-spacing:-.04em;line-height:1.05;}
.greet em{font-style:normal;color:var(--accent-ink);}
html[data-theme="dark"] .greet em{color:var(--accent);}
.greet-sub{margin-top:11px;color:var(--text-soft);font-size:15.5px;max-width:520px;}

.capture{display:flex;gap:10px;margin-top:24px;max-width:660px;}
.capture input{
    flex:1;border:1px solid var(--line);background:var(--paper);border-radius:999px;
    padding:14px 22px;outline:none;font-size:15.5px;transition:all .22s var(--ease);box-shadow:var(--shadow-soft);
}
.capture input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-soft);}
.stats{display:flex;gap:32px;margin-top:26px;flex-wrap:wrap;}
.stats .stat b{font-size:clamp(24px,3vw,34px);}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:14px;}
.panel{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
    padding:20px;display:flex;flex-direction:column;min-width:0;
    transition:border-color .25s,box-shadow .25s;
}
.panel:hover{border-color:var(--text-faint);box-shadow:var(--shadow-soft);}
.panel-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.panel-h b{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;}
.panel-h .label{margin-left:auto;}
.panel-c{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
.panel.wide{grid-column:span 2;}
.panel.full{grid-column:1/-1;}

/* ---------- apps ---------- */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px;}
.app{
    position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);
    padding:22px 20px 18px;overflow:hidden;
    transition:transform .34s var(--ease),box-shadow .34s var(--ease),border-color .3s;
}
.app::before{
    content:'';position:absolute;inset:0;opacity:0;transition:opacity .34s ease;
    background:radial-gradient(420px 200px at var(--mx,50%) var(--my,0%), var(--tint-a), transparent 70%);
}
.app:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--tint);}
.app:hover::before{opacity:1;}
.app-ico{
    position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
    font-size:20px;color:var(--tint);border:1px solid var(--line);background:var(--bg);
    transition:transform .4s var(--ease),background .3s,color .3s,border-color .3s;
}
.app:hover .app-ico{transform:scale(1.08) rotate(-6deg);background:var(--tint);color:#fff;border-color:var(--tint);}
.app h3{position:relative;font-size:16.5px;font-weight:600;margin:14px 0 5px;}
.app p{position:relative;font-size:12.5px;color:var(--text-faint);line-height:1.55;min-height:36px;}
.app-meta{
    position:relative;display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--line-soft);font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);
}
.app-meta .go{margin-left:auto;transition:transform .3s var(--ease);font-size:14px;}
.app:hover .app-meta .go{transform:translateX(5px);}
.app-spark{position:absolute;right:16px;top:20px;opacity:.5;}

/* ---------- status ---------- */
.status{display:flex;gap:10px;flex-wrap:wrap;}
.st{
    display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:999px;
    border:1px solid var(--line);font-size:13px;color:var(--text-soft);background:var(--paper);
}
.st .led{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex:0 0 8px;}
.st.on .led{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.st.on{color:var(--text);border-color:var(--accent);}

/* ---------- focus ---------- */
.focus-list{display:flex;flex-direction:column;gap:8px;}
.fitem{
    display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;
    border:1px solid var(--line);background:var(--paper);transition:all .22s var(--ease);
}
.fitem:hover{border-color:var(--text-faint);transform:translateX(3px);}
.fbox{
    width:19px;height:19px;border-radius:6px;border:1.6px solid var(--text-faint);flex:0 0 19px;
    display:grid;place-items:center;transition:all .2s var(--ease);cursor:pointer;
}
.fbox:hover{border-color:var(--accent-ink);transform:scale(1.12);}
.fbox.on{background:var(--accent);border-color:var(--accent);}
.fbox svg{opacity:0;color:var(--accent-ink);} .fbox.on svg{opacity:1;}
.fitem.done .ftxt{text-decoration:line-through;color:var(--text-faint);}
.ftxt{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fplay{
    width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:transparent;
    display:grid;place-items:center;font-size:11px;color:var(--text-faint);opacity:0;transition:all .2s var(--ease);
}
.fitem:hover .fplay{opacity:1;}
.fplay:hover{background:var(--accent);border-color:var(--accent);color:var(--ink);}

/* nu bezig */
.nowbox{
    display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-md);
    border:1px solid var(--accent);background:var(--accent-soft);margin-bottom:14px;
}
.nowbox .nt{flex:1;min-width:0;}
.nowbox .nt b{display:block;font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:600;}
.nowbox .nt span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink);}
html[data-theme="dark"] .nowbox .nt span{color:var(--accent);}
.nowbox .nv{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;}

@media(max-width:1080px){ .dash{grid-template-columns:1fr 1fr;} .panel.wide{grid-column:span 2;} }
@media(max-width:820px){
    .hero{padding:22px 16px 22px;}
    .hero-top{gap:14px;}
    .bigclock{margin-left:0;text-align:left;font-size:34px;}
    .stats{gap:18px;}
    .dash{grid-template-columns:1fr;}
    .panel.wide,.panel.full{grid-column:span 1;}
    .apps{grid-template-columns:1fr 1fr;gap:10px;}
    .app{padding:15px 13px 13px;border-radius:18px;}
    .app-ico{width:36px;height:36px;font-size:16px;border-radius:12px;}
    .app h3{font-size:14px;margin:11px 0 4px;}
    .app p{font-size:11.5px;min-height:0;}
    .app-meta,.app-spark{display:none;}
    .capture{flex-direction:column;}
}
</style>
</head>
<body>

<div class="os">
    <div class="os-body">
        <div class="os-scroll" id="scroll">

            <div class="hero">
                <div class="hero-bg"></div>
                <div class="hero-grid"></div>
                <div class="hero-in">
                    <div class="hero-top">
                        <div style="min-width:0;">
                            <div class="label" id="dateLine">—</div>
                            <h1 class="greet" id="greet" style="margin-top:9px;">Goedemorgen, <em>Kain</em>.</h1>
                            <p class="greet-sub" id="sub">Je systeem draait.</p>
                        </div>
                        <div class="bigclock" id="bigClock">--:--<span class="s">:--</span><small id="clockSub">—</small></div>
                    </div>

                    <div class="capture">
                        <input id="capture" placeholder="Snel iets vastleggen — taak, idee, notitie…" autocomplete="off">
                        <button class="btn accent" id="captureBtn">Vastleggen ⏎</button>
                    </div>

                    <div class="stats" id="stats"></div>
                </div>
            </div>

            <div class="pad">
                <div class="wrap">

                    <div class="sec-head"><h2 class="grotesk">Puls</h2>
                        <span class="pulse-badge" id="pulseBadge"><span class="dot-live"></span>live</span></div>
                    <div class="dash" id="dash"></div>

                    <div class="sec-head" style="margin-top:26px;"><h2 class="grotesk">Vandaag</h2>
                        <a class="chip" href="life-os.html">Open Life OS →</a></div>
                    <div id="nowSlot"></div>
                    <div class="focus-list" id="focus"></div>

                    <div class="sec-head"><h2 class="grotesk">Apps</h2></div>
                    <div class="apps" id="apps"></div>

                    <div class="sec-head"><h2 class="grotesk">Systeem</h2>
                        <a class="chip" href="integrations.html">Instellen →</a></div>
                    <div class="status" id="status"></div>

                    <div style="margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;">
                        <a class="chip" href="../index.html">← Terug naar de website</a>
                        <button class="chip" id="exportAll">Backup downloaden</button>
                        <button class="chip" id="syncNow">Nu synchroniseren</button>
                        <button class="chip" id="startFocus">Focusblok starten</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="km-os.js"></script>
<script src="km-viz.js"></script>
<script src="km-live.js"></script>
<script>
if(KM.boot()){
    KM.shell({ app:'home' });

    var $ = KM.$, $$ = KM.$$, OS = KM.OS, D = OS.data, V = KMviz, L = KMlive;

    /* =====================================================
       Afgeleide reeksen
       ===================================================== */
    function doneOn(dayISO){
        return D.tasks.filter(function(t){ return t.doneAt && KM.iso(new Date(t.doneAt)) === dayISO; }).length;
    }
    function habitsOn(dayISO){
        return D.habits.filter(function(h){ return h.log[dayISO]; }).length;
    }
    function series(n){
        var out = [], labels = [];
        for(var i = n - 1; i >= 0; i--){
            var k = KM.iso(KM.addDays(new Date(), -i));
            out.push(doneOn(k) + habitsOn(k));
            labels.push(k);
        }
        return { values:out, labels:labels };
    }
    function heatDays(){
        var m = {};
        D.tasks.forEach(function(t){ if(t.doneAt){ var k = KM.iso(new Date(t.doneAt)); m[k] = (m[k]||0) + 1; } });
        D.habits.forEach(function(h){ Object.keys(h.log).forEach(function(k){ m[k] = (m[k]||0) + 1; }); });
        return m;
    }
    function balance(){
        return KM.AREAS.map(function(a){
            var ts = D.tasks.filter(function(t){ return t.area === a.id; });
            var done = ts.filter(function(t){ return t.status === 'done'; }).length;
            var gs = D.goals.filter(function(g){ return g.area === a.id; }).length;
            var recent = D.tasks.filter(function(t){ return t.area === a.id && t.doneAt && t.doneAt > Date.now() - 14*864e5; }).length;
            // aandacht = mix van doelen, afgerond werk en recente activiteit
            var v = Math.min(1, (gs * .22) + (ts.length ? done/ts.length * .4 : 0) + Math.min(.38, recent * .13));
            return { label:a.name.split(' ')[0], icon:a.icon, color:a.hex, value:Math.max(.06, v), raw:{ gs:gs, ts:ts.length, done:done } };
        });
    }
    function weekLoad(){
        var days = [], total = 0, cap = 0;
        var start = KM.startOfWeek();
        for(var i = 0; i < 7; i++){
            var k = KM.iso(KM.addDays(start, i));
            var mins = ((D.plan||{})[k] || []).reduce(function(a,b){ return a + b.mins; }, 0);
            var work = (D.planCfg && D.planCfg.weekend) ? true : i < 5;
            days.push({ label:KM.DOW[i], value:Math.round(mins/60*10)/10, color: k === KM.iso() ? 'var(--accent)' : (work ? 'var(--a-work)' : 'var(--line)') });
            total += mins;
            if(work) cap += (D.planCfg ? D.planCfg.maxHours : 6) * 60;
        }
        return { days:days, total:total, cap:cap };
    }

    /* =====================================================
       Hero
       ===================================================== */
    function greet(){
        var h = new Date().getHours();
        var g = h < 6 ? 'Nog wakker' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond';
        $('#greet').innerHTML = g + ', <em>Kain</em>.';
        var d = new Date();
        $('#dateLine').textContent = KM.DOW_LONG[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + KM.MONTHS[d.getMonth()] + ' ' + d.getFullYear();
        var open = KM.q.today().length;
        $('#sub').textContent = open
            ? open + (open === 1 ? ' taak vraagt vandaag om aandacht.' : ' taken vragen vandaag om aandacht.')
            : 'Niets staat vandaag open. Mooi moment om vooruit te werken.';
    }
    L.every(1, function(){
        var d = new Date();
        var el = $('#bigClock'); if(!el) return;
        el.firstChild.nodeValue = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        $('.s', el).textContent = ':' + String(d.getSeconds()).padStart(2,'0');
        var mins = d.getHours()*60 + d.getMinutes();
        var cfg = D.planCfg || { startH:9, endH:18 };
        var left = cfg.endH*60 - mins;
        $('#clockSub').textContent = left > 0 && mins > cfg.startH*60
            ? 'nog ' + Math.floor(left/60) + 'u ' + (left%60) + 'm werkdag'
            : (mins <= cfg.startH*60 ? 'werkdag begint om ' + cfg.startH + ':00' : 'werkdag voorbij');
    });

    function stats(){
        var doneWeek = D.tasks.filter(function(t){ return t.doneAt && t.doneAt > Date.now() - 7*864e5; }).length;
        var items = [
            { n: D.goals.filter(function(g){ return g.status === 'active'; }).length, l:'Actieve doelen' },
            { n: D.projects.filter(function(p){ return p.status !== 'done'; }).length, l:'Lopende projecten' },
            { n: KM.q.open().length, l:'Open taken' },
            { n: doneWeek, l:'Af deze week' },
            { n: KM.q.momentum(), l:'Momentum', s:'%' }
        ];
        var host = $('#stats');
        if(host.children.length !== items.length){
            host.innerHTML = items.map(function(s){ return '<div class="stat"><b>0</b><span>' + s.l + '</span></div>'; }).join('');
        }
        $$('#stats .stat b').forEach(function(el, i){ V.count(el, items[i].n, 900, items[i].s || ''); });
    }

    /* =====================================================
       Puls-dashboard
       ===================================================== */
    function dash(){
        var s30 = series(30);
        var bal = balance();
        var wl = weekLoad();
        var open = KM.q.open();
        var prios = KM.PRIOS.map(function(p){
            return { label:p.name, value:open.filter(function(t){ return t.prio === p.id; }).length, color:p.color };
        });
        var late = open.filter(function(t){ return KM.dayDiff(t.due) < 0; }).length;

        $('#dash').innerHTML =
            panel('Levensbalans', 'zes gebieden', V.radar({ axes:bal, size:250 }), '') +

            panel('Werkverdeling', open.length + ' open', V.donut({
                slices:prios, size:170, thickness:20,
                center:{ big:String(open.length), small:'open taken' }
            }), keyList(prios)) +

            panel('Weekbelasting', Math.round(wl.total/60*10)/10 + ' van ' + Math.round(wl.cap/60) + ' u',
                V.gauge({ value: wl.cap ? wl.total/wl.cap : 0, size:180,
                    label: (wl.cap ? Math.round(wl.total/wl.cap*100) : 0) + '%', sub:'ingepland' }),
                V.bars({ items:wl.days, h:74 })) +

            panel('30 dagen momentum', 'taken + gewoontes', V.area({
                points:s30.values, labels:s30.labels, w:640, h:150
            }), '', 'wide') +

            panel('Vandaag scherp', late ? late + ' te laat' : 'niets te laat', '', todayMini(late), '') +

            panel('Activiteit', 'laatste 17 weken', V.heatmap({ days:heatDays(), weeks:17 }), '', 'full') +

            panel('Live feed', 'wat er net gebeurde', '', '<div class="feed" id="feed"></div>', 'wide') +

            panel('Doelen', D.goals.length + ' actief', '', goalMini(), '');

        L.feed($('#feed'), 9);
        V.animate($('#dash'));
    }
    function panel(title, meta, chart, extra, cls){
        return '<div class="panel rise ' + (cls||'') + '">' +
            '<div class="panel-h"><b>' + title + '</b><span class="label">' + KM.esc(meta) + '</span></div>' +
            (chart ? '<div class="panel-c">' + chart + '</div>' : '') +
            (extra ? '<div style="margin-top:' + (chart ? '14px' : '0') + ';">' + extra + '</div>' : '') +
        '</div>';
    }
    function keyList(items){
        return '<div class="viz-key">' + items.filter(function(i){ return i.value; }).map(function(i){
            return '<div class="k"><i style="background:' + i.color + '"></i>' + i.label + '<b>' + i.value + '</b></div>';
        }).join('') + '</div>';
    }
    function todayMini(late){
        var td = KM.iso();
        var done = doneOn(td), hab = habitsOn(td), tot = D.habits.length;
        return '<div style="display:flex;flex-direction:column;gap:14px;">' +
            miniRow('Afgerond vandaag', done, done ? 'var(--accent)' : 'var(--line)', Math.min(100, done*20)) +
            miniRow('Gewoontes', hab + '/' + tot, 'var(--a-health)', tot ? hab/tot*100 : 0) +
            miniRow('Te laat', late, late ? 'var(--danger)' : 'var(--line)', Math.min(100, late*25)) +
            miniRow('Deze week gepland', Math.round(weekLoad().total/60*10)/10 + 'u', 'var(--a-work)',
                Math.min(100, weekLoad().cap ? weekLoad().total/weekLoad().cap*100 : 0)) +
        '</div>';
    }
    function miniRow(label, val, color, pct){
        return '<div><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px;">' +
            '<span class="label" style="flex:1;">' + label + '</span>' +
            '<b class="grotesk" style="font-size:17px;">' + val + '</b></div>' +
            '<div class="bar"><i style="width:' + pct + '%;background:' + color + '"></i></div></div>';
    }
    function goalMini(){
        if(!D.goals.length) return '<div class="empty">Nog geen doelen</div>';
        return '<div style="display:flex;flex-direction:column;gap:13px;">' + D.goals.slice(0,4).map(function(g){
            var a = KM.areaOf(g.area), pct = KM.q.progress(g.id);
            return '<a href="life-os.html#goals" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;">' +
                '<span style="font-size:17px;">' + (g.icon||'🎯') + '</span>' +
                '<span style="flex:1;min-width:0;"><span style="display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + KM.esc(g.title) + '</span>' +
                '<span class="bar" style="margin-top:6px;display:block;"><i style="width:' + pct + '%;background:' + a.hex + '"></i></span></span>' +
                '<span class="label">' + pct + '%</span></a>';
        }).join('') + '</div>';
    }

    /* =====================================================
       Nu bezig + focus
       ===================================================== */
    function nowBox(){
        var T = L.timer.state();
        var host = $('#nowSlot');
        if(!T){ host.innerHTML = ''; return; }
        var left = L.timer.left();
        host.innerHTML = '<div class="nowbox">' +
            V.ring(100 - left / (T.mins*60000) * 100, 46, 5, 'var(--accent-ink)') +
            '<span class="nt"><b>' + KM.esc(T.title) + '</b><span>' + (T.pausedAt ? 'gepauzeerd' : 'focusblok loopt') + '</span></span>' +
            '<span class="nv" id="nowV">' + fmt(left) + '</span></div>';
        V.animate(host);
    }
    function fmt(ms){ var s = Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
    L.every(1, function(){
        var T = L.timer.state();
        var v = $('#nowV');
        if(T && v) v.textContent = fmt(L.timer.left());
        else if(!!T !== !!$('.nowbox')) nowBox();
    });
    L.on('timer', nowBox);

    function focus(){
        var list = KM.q.today().sort(function(a,b){ return (a.prio||'p3').localeCompare(b.prio||'p3'); }).slice(0,6);
        var host = $('#focus');
        if(!list.length){
            host.innerHTML = '<div class="empty">Geen taken voor vandaag — plan iets in via AI Scheduling</div>';
            return;
        }
        host.innerHTML = list.map(function(t){
            var a = KM.areaOf(t.area);
            var pr = KM.PRIOS.filter(function(p){ return p.id === t.prio; })[0] || KM.PRIOS[2];
            return '<div class="fitem rise" data-id="' + t.id + '">' +
                '<span class="fbox"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>' +
                '<span class="ftxt">' + KM.esc(t.title) + '</span>' +
                '<button class="fplay" data-play title="Focusblok hierop starten">▶</button>' +
                '<span class="tag" style="background:' + pr.color + '22;color:' + pr.color + ';">' + pr.name + '</span>' +
                '<span class="tag" style="background:' + a.hex + '1e;color:' + a.hex + ';">' + a.icon + '</span>' +
            '</div>';
        }).join('');
        $$('#focus .fbox').forEach(function(b){
            b.onclick = function(){
                var row = b.closest('.fitem');
                var t = KM.q.task(row.dataset.id);
                t.status = 'done'; t.doneAt = Date.now();
                b.classList.add('on'); row.classList.add('done');
                OS.save(); KM.track('task_done', { from:'launcher' });
                L.log('task_done', 'Afgevinkt: ' + t.title);
                setTimeout(function(){ refresh(); }, 550);
                KM.toast('Afgevinkt — ' + t.title, null, 'Ongedaan maken', function(){
                    t.status = 'todo'; t.doneAt = null; OS.save(); refresh();
                });
            };
        });
        $$('#focus [data-play]').forEach(function(b){
            b.onclick = function(){
                var t = KM.q.task(b.closest('.fitem').dataset.id);
                L.timer.start(25, t.id, t.title);
            };
        });
    }

    /* =====================================================
       Apps + status
       ===================================================== */
    function apps(){
        var s14 = series(14).values;
        $('#apps').innerHTML = KM.APPS.filter(function(a){ return a.id !== 'home'; }).map(function(a){
            var count = '', sp = '';
            if(a.id === 'life'){ count = KM.q.open().length + ' open'; sp = V.spark({ points:s14, w:60, h:22, color:a.tint }); }
            if(a.id === 'matrix') count = (D.goals.length + D.projects.length + D.tasks.length) + ' knopen';
            if(a.id === 'plan'){
                var wl = weekLoad();
                count = Math.round(wl.total/60*10)/10 + ' u gepland';
                sp = V.spark({ points:wl.days.map(function(d){ return d.value; }), w:60, h:22, color:a.tint });
            }
            if(a.id === 'video')  count = (D.scenes||[]).length + ' scenes';
            if(a.id === 'design') count = (D.designs||[]).length + ' ontwerpen';
            if(a.id === 'notes'){
                var ws = null; try{ ws = JSON.parse(localStorage.getItem('kmdev_workspace_v1')||'null'); }catch(e){}
                count = ws ? Object.keys(ws.pages||{}).length + ' pagina\'s' : 'leeg';
            }
            if(a.id === 'stack')  count = statusCount() + '/3 verbonden';
            return '<a class="app rise" href="' + a.file + '" style="--tint:' + a.tint + ';--tint-a:' + a.tint + '22;">' +
                '<span class="app-ico">' + a.icon + '</span>' +
                (sp ? '<span class="app-spark">' + sp + '</span>' : '') +
                '<h3 class="grotesk">' + KM.esc(a.name) + '</h3>' +
                '<p>' + KM.esc(a.desc) + '</p>' +
                '<div class="app-meta"><span>' + count + '</span><span class="go">→</span></div>' +
            '</a>';
        }).join('');
        $$('.app').forEach(function(el){
            el.addEventListener('mousemove', function(e){
                var r = el.getBoundingClientRect();
                el.style.setProperty('--mx', ((e.clientX - r.left)/r.width*100) + '%');
                el.style.setProperty('--my', ((e.clientY - r.top)/r.height*100) + '%');
            });
        });
        V.animate($('#apps'));
    }
    function statusCount(){
        var s = KM.SET.data, n = 0;
        if(s.supabase.url && s.supabase.key) n++;
        if(s.posthog.on && s.posthog.key) n++;
        if(s.ai.on) n++;
        return n;
    }
    function status(){
        var s = KM.SET.data;
        var items = [
            { on: !!(s.supabase.url && s.supabase.key), name:'Supabase', off:'niet gekoppeld', onTxt: s.supabase.auto ? 'auto-sync aan' : 'gekoppeld' },
            { on: !!(s.posthog.on && s.posthog.key),    name:'PostHog',  off:'uit',            onTxt:'events actief' },
            { on: !!s.ai.on,                            name:'AI-proxy', off:'uit',            onTxt: s.ai.endpoint },
            { on: navigator.onLine,                     name:'Netwerk',  off:'offline',        onTxt:'online' },
            { on: true, name:'Lokale opslag', off:'', onTxt: Math.round(JSON.stringify(D).length/1024) + ' kB' }
        ];
        $('#status').innerHTML = items.map(function(i){
            return '<div class="st' + (i.on ? ' on' : '') + '"><span class="led"></span><b style="font-weight:600;">' + i.name + '</b>' +
                   '<span style="color:var(--text-faint);font-size:12px;">' + KM.esc(i.on ? i.onTxt : i.off) + '</span></div>';
        }).join('');
    }

    /* =====================================================
       Vastleggen + acties
       ===================================================== */
    function capture(){
        var v = $('#capture').value.trim();
        if(!v) return;
        var prio = /!/.test(v) ? 'p1' : 'p3';
        var due  = /vandaag|today/i.test(v) ? KM.iso() : /morgen|tomorrow/i.test(v) ? KM.iso(KM.addDays(new Date(),1)) : '';
        var tags = (v.match(/#[\wàéèêëïöü-]+/gi) || []).map(function(x){ return x.slice(1); });
        var title = v.replace(/#[\wàéèêëïöü-]+/gi,'').replace(/!/g,'').replace(/\b(vandaag|morgen|today|tomorrow)\b/gi,'').replace(/\s{2,}/g,' ').trim();
        D.tasks.unshift({
            id:KM.uid(), title:title || v, projectId:null, goalId:null, area:'work',
            status:'todo', due:due, prio:prio, energy:'focus', tags:tags, created:Date.now(), doneAt:null
        });
        OS.save();
        $('#capture').value = '';
        KM.toast('Vastgelegd in je inbox');
        KM.track('capture', { app:'launcher' });
        L.log('task_new', 'Vastgelegd: ' + (title || v));
        refresh();
    }
    $('#captureBtn').onclick = capture;
    $('#capture').addEventListener('keydown', function(e){ if(e.key === 'Enter') capture(); });
    $('#exportAll').onclick = function(){
        KM.download('km-os-backup-' + KM.iso() + '.json', JSON.stringify({ os:D, settings:KM.SET.data }, null, 2));
        KM.toast('Backup gedownload');
    };
    $('#syncNow').onclick = function(){ KM.sync.push(); };
    $('#startFocus').onclick = function(){ L.timer.modal(); };
    document.addEventListener('keydown', function(e){
        if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('#capture').focus(); }
    });

    /* =====================================================
       Live verversen
       ===================================================== */
    function refresh(){
        D = OS.data;
        greet(); stats(); dash(); focus(); apps(); status(); nowBox();
    }
    L.on('data', function(){ D = OS.data; refresh(); KM.toast('Bijgewerkt vanuit een ander tabblad'); });
    L.on('activity', function(){ L.feed($('#feed'), 9); });
    L.every(20, function(){ L.refreshAgo($('#feed')); });
    L.every(60, function(){ stats(); status(); });
    window.addEventListener('online',  status);
    window.addEventListener('offline', status);

    refresh();
    window.HOME = { refresh:refresh, series:series, balance:balance, weekLoad:weekLoad, heatDays:heatDays, capture:capture };
}
</script>
</body>
</html>
