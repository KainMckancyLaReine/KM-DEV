<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mind Matrix — KM.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="km-os.css">
<style>
.mx{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);}
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none;}
#cv.grabbing{cursor:grabbing;}

/* zwevende glaspanelen */
.glass{
    position:absolute;z-index:5;
    background:var(--mat-thick);border:1px solid var(--mat-line);
    border-radius:var(--r-lg);box-shadow:var(--sh-3), inset 0 1px 0 var(--mat-hi);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.mx-bar{
    top:16px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:8px;max-width:min(760px,calc(100% - 32px));
}
.mx-q{
    display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:13px;
    background:var(--hover);min-width:150px;flex:1;
}
.mx-q input{flex:1;border:0;background:transparent;outline:none;font-size:14px;min-width:0;}
.mx-filters{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;}
.mx-filters::-webkit-scrollbar{display:none;}
.fchip{
    border:0;background:transparent;padding:6px 11px;border-radius:11px;flex:0 0 auto;
    font-size:12px;font-weight:520;letter-spacing:-.01em;color:var(--text-soft);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    transition:background .2s, color .2s, transform .34s var(--spring-soft);
}
.fchip .d{width:7px;height:7px;border-radius:2.5px;background:currentColor;opacity:.5;}
.fchip:hover{background:var(--hover);}
.fchip.on{background:var(--text);color:var(--paper);}
.fchip.on .d{opacity:1;}
.fchip:active{transform:scale(.94);}

.mx-legend{left:16px;bottom:16px;padding:16px 18px;max-width:216px;}
.mx-legend .lg{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-soft);padding:3.5px 0;}
.mx-legend .lg .d{width:10px;height:10px;border-radius:3.5px;flex:0 0 10px;}
.mx-legend .lg small{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);}

.mx-hud{right:16px;bottom:16px;padding:7px;display:flex;gap:3px;align-items:center;}
.mx-hud .iconbtn{width:34px;height:34px;opacity:.65;font-size:15px;}
.mx-hud .zoomv{
    font-family:'Space Mono',monospace;font-size:10px;color:var(--text-faint);
    padding:0 9px;letter-spacing:.08em;min-width:46px;text-align:center;
}

/* detailpaneel */
.mx-panel{
    position:absolute;top:12px;right:12px;bottom:12px;width:min(360px,84vw);z-index:8;
    background:var(--mat-thick);border:1px solid var(--mat-line);
    border-radius:var(--r-xl);box-shadow:var(--sh-4), inset 0 1px 0 var(--mat-hi);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    transform:translateX(calc(100% + 20px));opacity:0;
    transition:transform .55s var(--spring-soft), opacity .3s ease;
    display:flex;flex-direction:column;overflow:hidden;
}
.mx-panel.on{transform:none;opacity:1;}
.mp-head{padding:20px 20px 16px;border-bottom:1px solid var(--mat-line);display:flex;gap:13px;align-items:flex-start;}
.mp-ico{
    width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:20px;
    flex:0 0 46px;color:#fff;box-shadow:var(--sh-1);
}
.mp-head h3{font-size:17px;font-weight:600;line-height:1.25;flex:1;letter-spacing:-.03em;}
.mp-body{flex:1;overflow-y:auto;padding:18px 20px 34px;}
.mp-sec{margin-bottom:20px;}
.mp-sec > .label{margin-bottom:10px;}
.mp-link{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
    margin-bottom:4px;cursor:pointer;font-size:13.5px;
    transition:background .2s, transform .34s var(--spring-soft);
}
.mp-link:hover{background:var(--hover);transform:translateX(3px);}
.mp-link .d{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}
.mp-link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mp-link small{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);}

.mini-stat{display:flex;gap:22px;flex-wrap:wrap;}
.mini-stat div b{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.035em;}
.mini-stat div span{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);}

@media(max-width:860px){
    .mx-legend{display:none;}
    .mx-bar{top:8px;left:8px;right:8px;transform:none;max-width:none;}
    .mx-hud{right:8px;bottom:8px;}
    .mx-panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:58%;
        transform:translateY(calc(100% + 20px));}
    .mx-panel.on{transform:none;}
}
</style>
</head>
<body>

<div class="os">
    <div class="os-body">
        <div class="mx">
            <canvas id="cv"></canvas>

            <div class="glass mx-bar">
                <div class="mx-q">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--text-faint)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input id="q" placeholder="Zoeken…" autocomplete="off">
                </div>
                <div class="mx-filters" id="filters"></div>
            </div>

            <div class="glass mx-legend" id="legend"></div>

            <div class="glass mx-hud">
                <button class="iconbtn" id="zOut" title="Uitzoomen">−</button>
                <span class="zoomv" id="zv">100%</span>
                <button class="iconbtn" id="zIn" title="Inzoomen">+</button>
                <button class="iconbtn" id="zFit" title="Passend maken">⤢</button>
                <button class="iconbtn" id="reheat" title="Opnieuw schikken">↻</button>
            </div>

            <div class="mx-panel" id="panel">
                <div class="mp-head">
                    <span class="mp-ico" id="mpIco">◎</span>
                    <div style="flex:1;min-width:0;"><h3 class="grotesk" id="mpTitle">—</h3>
                        <div class="label" id="mpType" style="margin-top:5px;">—</div></div>
                    <button class="iconbtn" id="mpClose">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <div class="mp-body" id="mpBody"></div>
            </div>
        </div>
    </div>
</div>

<script src="km-brand.js"></script>
<script src="km-os.js"></script>
<script src="km-viz.js"></script>
<script src="km-live.js"></script>
<script>
if(KM.boot()){

var $ = KM.$, $$ = KM.$$, OS = KM.OS, D = OS.data, esc = KM.esc, V = KMviz, L = KMlive, B = KMbrand;

KM.shell({
    app:'matrix',
    actionsHTML:'<button class="btn ghost sm" id="snap">Exporteer PNG</button>'
});

/* =========================================================
   1. Graaf
   ========================================================= */
var TYPES = {
    area:    { name:'Gebied',   r:34, kind:'plate', color:null,      z:5 },
    goal:    { name:'Doel',     r:25, kind:'plate', color:null,      z:4 },
    project: { name:'Project',  r:17, kind:'plate', color:null,      z:3 },
    task:    { name:'Taak',     r:8,  kind:'dot',   color:null,      z:1 },
    habit:   { name:'Gewoonte', r:13, kind:'plate', color:'#3f8f5c', z:2 },
    note:    { name:'Notitie',  r:11, kind:'dot',   color:'#8f8d85', z:1 },
    page:    { name:'Pagina',   r:10, kind:'dot',   color:'#6f6d66', z:1 }
};
var nodes = [], links = [], byId = {};

function build(){
    nodes.length = 0; links.length = 0; byId = {};
    function N(o){
        o.x = o.x || (Math.random()*620 - 310); o.y = o.y || (Math.random()*620 - 310);
        o.vx = 0; o.vy = 0; o.s = 1;
        nodes.push(o); byId[o.id] = o; return o;
    }
    function L2(a, b, k){ if(byId[a] && byId[b]) links.push({ s:a, t:b, k:k||1 }); }

    KM.AREAS.forEach(function(a){
        N({ id:'area:'+a.id, t:'area', label:a.name, icon:a.icon, color:a.hex, ref:a });
    });
    D.goals.forEach(function(g){
        var a = KM.areaOf(g.area);
        N({ id:'goal:'+g.id, t:'goal', label:g.title, icon:g.icon || '🎯', color:a.hex, ref:g, pct:KM.q.progress(g.id) });
        L2('area:'+g.area, 'goal:'+g.id, 1.5);
    });
    D.projects.forEach(function(p){
        var a = KM.areaOf(p.area);
        N({ id:'proj:'+p.id, t:'project', label:p.title, icon:p.icon || '📦', color:a.hex, ref:p, pct:KM.q.projectProgress(p.id) });
        if(p.goalId) L2('goal:'+p.goalId, 'proj:'+p.id, 1.25);
        else L2('area:'+p.area, 'proj:'+p.id, .9);
    });
    D.tasks.forEach(function(t){
        var a = KM.areaOf(t.area);
        N({ id:'task:'+t.id, t:'task', label:t.title, icon:'', color:a.hex, ref:t, done:t.status === 'done' });
        if(t.projectId) L2('proj:'+t.projectId, 'task:'+t.id, 1);
        else if(t.goalId) L2('goal:'+t.goalId, 'task:'+t.id, .8);
        else L2('area:'+t.area, 'task:'+t.id, .5);
    });
    D.habits.forEach(function(h){
        N({ id:'habit:'+h.id, t:'habit', label:h.title, icon:h.icon, color:h.color, ref:h });
        L2('area:health', 'habit:'+h.id, .75);
    });
    (D.notes||[]).forEach(function(n){
        N({ id:'note:'+n.id, t:'note', label:n.title, icon:'', color:TYPES.note.color, ref:n });
        ((n.links||{}).goals||[]).forEach(function(g){ L2('goal:'+g, 'note:'+n.id, .6); });
    });
    try{
        var ws = JSON.parse(localStorage.getItem('kmdev_workspace_v1') || 'null');
        if(ws && ws.pages){
            Object.values(ws.pages).forEach(function(p){
                if(p.trashed) return;
                N({ id:'page:'+p.id, t:'page', label:p.title || 'Naamloos', icon:p.icon || '', color:TYPES.page.color,
                    ref:p, href:'../dashboard.html#' + p.id });
            });
            Object.values(ws.pages).forEach(function(p){
                if(p.trashed || !p.parent) return;
                L2('page:'+p.parent, 'page:'+p.id, .8);
            });
        }
    }catch(e){}

    nodes.forEach(function(n){
        n.deg = 0;
        var ts = n.ref && (n.ref.doneAt || n.ref.updated || n.ref.created);
        n.hot = ts && Date.now() - ts < 120000 ? ts : 0;
    });
    links.forEach(function(l){ byId[l.s].deg++; byId[l.t].deg++; });
}

/* =========================================================
   2. Camera + physics
   ========================================================= */
var alpha = 1, view = { x:0, y:0, k:1 }, target = { x:0, y:0, k:1 };
var W = 0, H = 0, dpr = 1, frame = 0;
var cv = $('#cv'), ctx = cv.getContext('2d');
var hover = null, selected = null, dragging = null, panning = null, focusSet = null;
var parts = [], lastSpawn = 0;
var filters = { area:true, goal:true, project:true, task:true, habit:true, note:true, page:true };
var query = '';

function resize(){
    var r = cv.parentElement.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.max(1, W * dpr); cv.height = Math.max(1, H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function visible(n){
    if(!filters[n.t]) return false;
    if(query && n.label.toLowerCase().indexOf(query) < 0) return false;
    if(focusSet && !focusSet[n.id]) return false;
    return true;
}
function radiusOf(n){ return TYPES[n.t].r * (n.s || 1); }

function tick(){
    frame++;

    /* camera glijdt naar zijn doel — dat geeft de vloeiende feel */
    view.x += (target.x - view.x) * .16;
    view.y += (target.y - view.y) * .16;
    view.k += (target.k - view.k) * .16;

    if(alpha > .0015){
        alpha *= .986;
        var vis = nodes.filter(visible);
        for(var i = 0; i < vis.length; i++){
            var a = vis[i];
            for(var j = i + 1; j < vis.length; j++){
                var b = vis[j];
                var dx = b.x - a.x, dy = b.y - a.y;
                var d2 = dx*dx + dy*dy || .01;
                if(d2 > 300000) continue;
                var rsum = TYPES[a.t].r + TYPES[b.t].r;
                var f = (1500 + rsum * 52) / d2;
                var d = Math.sqrt(d2);
                var fx = dx/d*f, fy = dy/d*f;
                a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
            }
        }
        links.forEach(function(l){
            var a = byId[l.s], b = byId[l.t];
            if(!a || !b || !visible(a) || !visible(b)) return;
            var dx = b.x - a.x, dy = b.y - a.y;
            var d = Math.sqrt(dx*dx + dy*dy) || .01;
            var rest = 96 + TYPES[a.t].r + TYPES[b.t].r;
            var f = (d - rest) * .02 * l.k;
            var fx = dx/d*f, fy = dy/d*f;
            a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
        });
        vis.forEach(function(n){
            n.vx -= n.x * .0015; n.vy -= n.y * .0015;
            if(n === dragging) return;
            n.vx *= .85; n.vy *= .85;
            n.x += n.vx * alpha * 2.5;
            n.y += n.vy * alpha * 2.5;
        });
    }

    nodes.forEach(function(n){
        var want = (hover && hover.id === n.id) ? 1.16 : (selected && selected.id === n.id ? 1.1 : 1);
        n.s += (want - n.s) * .18;
    });

    spawnParts();
    draw();
    requestAnimationFrame(tick);
}

/* =========================================================
   3. Tekenen
   ========================================================= */
var THEME = {};
function readTheme(){
    var cs = getComputedStyle(document.documentElement);
    ['line','text','text-faint','text-soft','paper','bg','accent','accent-ink'].forEach(function(k){
        THEME[k] = (cs.getPropertyValue('--' + k) || '').trim();
    });
    THEME.line = THEME.line || '#e4e2d9';
    THEME.text = THEME.text || '#0d0d0d';
    THEME.paper = THEME.paper || '#ffffff';
    THEME.accent = THEME.accent || '#c6ff4a';
    THEME['accent-ink'] = THEME['accent-ink'] || '#3f5a17';
    THEME['text-faint'] = THEME['text-faint'] || '#b6b4ac';
    THEME.dark = document.documentElement.dataset.theme === 'dark';
}
readTheme();

function screenOf(n){ return { x: n.x * view.k + view.x + W/2, y: n.y * view.k + view.y + H/2 }; }
function neighbours(id){
    var set = {}; set[id] = true;
    links.forEach(function(l){ if(l.s === id) set[l.t] = true; if(l.t === id) set[l.s] = true; });
    return set;
}
function rr(x, y, w, h, r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function hexA(hex, a){
    hex = String(hex || '#888').replace('#','');
    if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var n = parseInt(hex, 16);
    if(isNaN(n)) return 'rgba(140,140,140,' + a + ')';
    return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

function drawGrid(){
    var step = 34 * view.k;
    if(step < 14) return;
    var ox = (view.x + W/2) % step, oy = (view.y + H/2) % step;
    ctx.fillStyle = THEME.line;
    ctx.globalAlpha = .6;
    for(var x = ox; x < W; x += step)
        for(var y = oy; y < H; y += step)
            ctx.fillRect(x, y, 1.2, 1.2);
    ctx.globalAlpha = 1;
}

function onLink(l, t){
    var a = byId[l.s], b = byId[l.t];
    if(!a || !b) return null;
    var pa = screenOf(a), pb = screenOf(b);
    var mx = (pa.x + pb.x)/2, my = (pa.y + pb.y)/2;
    var cx = mx - (pb.y - pa.y) * .08, cy = my + (pb.x - pa.x) * .08;
    var u = 1 - t;
    return { x: u*u*pa.x + 2*u*t*cx + t*t*pb.x, y: u*u*pa.y + 2*u*t*cy + t*t*pb.y };
}
function spawnParts(){
    var now = performance.now();
    if(now - lastSpawn < 200) return;
    lastSpawn = now;
    var hl = (hover || selected);
    var pool = links.filter(function(l){
        var a = byId[l.s], b = byId[l.t];
        if(!a || !b || !visible(a) || !visible(b)) return false;
        if(hl) return l.s === hl.id || l.t === hl.id;
        return true;
    });
    if(!pool.length) return;
    var want = hl ? 2 : 1;
    for(var i = 0; i < want; i++){
        if(parts.length > (hl ? 54 : 22)) break;
        var l = pool[Math.floor(Math.random() * pool.length)];
        var from = Math.random() < .5;
        parts.push({ l:l, t:0, dir: from ? 1 : -1, speed:.004 + Math.random()*.005,
                     color:(byId[from ? l.s : l.t] || {}).color || THEME.accent, strong:!!hl });
    }
}
function drawParts(){
    for(var i = parts.length - 1; i >= 0; i--){
        var p = parts[i];
        p.t += p.speed;
        if(p.t >= 1){ parts.splice(i,1); continue; }
        var pos = onLink(p.l, p.dir > 0 ? p.t : 1 - p.t);
        if(!pos){ parts.splice(i,1); continue; }
        var fade = Math.sin(p.t * Math.PI);
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, (p.strong ? 2.4 : 1.6) * view.k, 0, 6.2832);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = fade * (p.strong ? .9 : .38);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function draw(){
    ctx.clearRect(0, 0, W, H);
    drawGrid();

    var vis = nodes.filter(visible);
    var hl = (hover || selected) ? neighbours((hover || selected).id) : null;

    ctx.lineCap = 'round';
    links.forEach(function(l){
        var a = byId[l.s], b = byId[l.t];
        if(!a || !b || !visible(a) || !visible(b)) return;
        var pa = screenOf(a), pb = screenOf(b);
        var on = hl && hl[a.id] && hl[b.id];
        var mx = (pa.x + pb.x)/2, my = (pa.y + pb.y)/2;
        var cx = mx - (pb.y - pa.y) * .08, cy = my + (pb.x - pa.x) * .08;

        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.quadraticCurveTo(cx, cy, pb.x, pb.y);
        if(on && ctx.createLinearGradient){
            var g = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
            g.addColorStop(0, hexA(a.color, .95));
            g.addColorStop(1, hexA(b.color, .95));
            ctx.strokeStyle = g;
            ctx.lineWidth = 1.6 + l.k * .9;
        }else{
            ctx.strokeStyle = THEME.line;
            ctx.lineWidth = .9 + l.k * .35;
            ctx.globalAlpha = hl ? .28 : .9;
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
    });

    drawParts();

    vis.sort(function(a,b){ return TYPES[a.t].z - TYPES[b.t].z; }).forEach(function(n){
        var p = screenOf(n);
        var dim = hl && !hl[n.id];
        var isSel = selected && selected.id === n.id;
        var isHov = hover && hover.id === n.id;
        var r = radiusOf(n) * view.k;

        ctx.globalAlpha = dim ? .2 : 1;

        if(n.hot){
            var age = (Date.now() - n.hot) / 120000;
            if(age >= 1) n.hot = 0;
            else{
                var wv = (frame % 96) / 96;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r + wv * 26 * view.k, 0, 6.2832);
                ctx.strokeStyle = n.color;
                ctx.globalAlpha = (1 - wv) * (1 - age) * .55;
                ctx.lineWidth = 1.8;
                ctx.stroke();
                ctx.globalAlpha = dim ? .2 : 1;
            }
        }

        if(TYPES[n.t].kind === 'plate') drawPlate(n, p, r, isSel, isHov);
        else drawDot(n, p, r, isSel, isHov);

        ctx.globalAlpha = 1;
    });

    /* labels bovenop zodat ze nooit onder lijnen verdwijnen */
    vis.forEach(function(n){
        var p = screenOf(n);
        var dim = hl && !hl[n.id];
        var isSel = selected && selected.id === n.id;
        var isHov = hover && hover.id === n.id;
        var big = TYPES[n.t].r >= 17;
        if(view.k < .42) return;
        if(!(big || isSel || isHov || view.k > 1.35)) return;
        drawLabel(n, p, radiusOf(n) * view.k, dim, isSel || isHov);
    });
}

function drawPlate(n, p, r, isSel, isHov){
    var s = r * 2, x = p.x - r, y = p.y - r;

    ctx.save();
    ctx.shadowColor = hexA(n.color, THEME.dark ? .45 : .30);
    ctx.shadowBlur = (isHov || isSel ? 26 : 14) * view.k;
    ctx.shadowOffsetY = 4 * view.k;
    rr(x, y, s, s, s * .3);
    ctx.fillStyle = n.color;
    ctx.fill();
    ctx.restore();

    if(ctx.createLinearGradient){
        var g = ctx.createLinearGradient(0, y, 0, y + s);
        g.addColorStop(0, 'rgba(255,255,255,.38)');
        g.addColorStop(.55, 'rgba(255,255,255,0)');
        rr(x, y, s, s, s * .3);
        ctx.fillStyle = g;
        ctx.fill();
    }

    rr(x, y, s, s, s * .3);
    ctx.strokeStyle = isSel ? THEME.accent : 'rgba(255,255,255,.34)';
    ctx.lineWidth = isSel ? 2.6 : 1;
    ctx.stroke();

    if(n.pct != null && n.pct > 0){
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 5 * view.k, -Math.PI/2, -Math.PI/2 + Math.PI*2 * (n.pct/100));
        ctx.strokeStyle = THEME.dark ? THEME.accent : THEME['accent-ink'];
        ctx.lineWidth = 2.4 * view.k;
        ctx.lineCap = 'round';
        ctx.stroke();
    }

    if(n.icon && r > 9){
        ctx.font = Math.round(r * 1.02) + 'px system-ui, "Apple Color Emoji", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(n.icon, p.x, p.y + r * .04);
    }
}

function drawDot(n, p, r, isSel, isHov){
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, 6.2832);
    if(n.done){
        ctx.fillStyle = THEME.paper;
        ctx.fill();
        ctx.strokeStyle = hexA(n.color, .55);
        ctx.lineWidth = 2;
        ctx.stroke();
        if(r > 6){
            ctx.beginPath();
            ctx.moveTo(p.x - r*.42, p.y);
            ctx.lineTo(p.x - r*.08, p.y + r*.34);
            ctx.lineTo(p.x + r*.46, p.y - r*.36);
            ctx.strokeStyle = hexA(n.color, .8);
            ctx.lineWidth = Math.max(1.2, r * .22);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.stroke();
        }
    }else{
        ctx.save();
        ctx.shadowColor = hexA(n.color, .4);
        ctx.shadowBlur = (isHov || isSel ? 18 : 8) * view.k;
        ctx.shadowOffsetY = 2 * view.k;
        ctx.fillStyle = n.color;
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, 6.2832);
        ctx.strokeStyle = isSel ? THEME.accent : 'rgba(255,255,255,.4)';
        ctx.lineWidth = isSel ? 2.4 : 1;
        ctx.stroke();
    }
}

function drawLabel(n, p, r, dim, strong){
    var txt = n.label.length > 30 ? n.label.slice(0, 28) + '…' : n.label;
    var size = Math.max(10, Math.min(13.5, 11 * Math.max(1, view.k * .9)));
    ctx.font = '560 ' + size + 'px Inter, -apple-system, sans-serif';
    var w = ctx.measureText(txt).width;
    var padX = 7, h = size + 9;
    var x = p.x - w/2 - padX, y = p.y + r + 7;

    ctx.globalAlpha = dim ? .22 : 1;
    rr(x, y, w + padX*2, h, h/2);
    ctx.fillStyle = THEME.dark ? 'rgba(28,28,30,.86)' : 'rgba(255,255,255,.9)';
    ctx.fill();
    if(strong){
        rr(x, y, w + padX*2, h, h/2);
        ctx.strokeStyle = hexA(n.color, .5);
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    ctx.fillStyle = dim ? THEME['text-faint'] : THEME.text;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, p.x, y + h/2 + .5);
    ctx.globalAlpha = 1;
}

/* =========================================================
   4. Interactie
   ========================================================= */
function nodeAt(mx, my){
    var order = nodes.slice().sort(function(a,b){ return TYPES[b.t].z - TYPES[a.t].z; });
    for(var i = 0; i < order.length; i++){
        var n = order[i]; if(!visible(n)) continue;
        var p = screenOf(n), r = radiusOf(n) * view.k + 5;
        if((mx - p.x)*(mx - p.x) + (my - p.y)*(my - p.y) < r*r) return n;
    }
    return null;
}
function local(e){
    var r = cv.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x:t.clientX - r.left, y:t.clientY - r.top };
}

cv.addEventListener('mousemove', function(e){
    var p = local(e);
    if(dragging){
        dragging.x = (p.x - W/2 - view.x) / view.k;
        dragging.y = (p.y - H/2 - view.y) / view.k;
        dragging.vx = dragging.vy = 0;
        alpha = Math.max(alpha, .3);
        return;
    }
    if(panning){
        target.x = view.x = panning.vx + (p.x - panning.x);
        target.y = view.y = panning.vy + (p.y - panning.y);
        return;
    }
    var n = nodeAt(p.x, p.y);
    if(n !== hover){ hover = n; cv.style.cursor = n ? 'pointer' : 'grab'; }
});
cv.addEventListener('mousedown', function(e){
    var p = local(e), n = nodeAt(p.x, p.y);
    if(n) dragging = n;
    else { panning = { x:p.x, y:p.y, vx:view.x, vy:view.y }; cv.classList.add('grabbing'); }
});
window.addEventListener('mouseup', function(){
    if(dragging){ alpha = Math.max(alpha, .22); dragging = null; }
    panning = null; cv.classList.remove('grabbing');
});
cv.addEventListener('click', function(e){
    var p = local(e), n = nodeAt(p.x, p.y);
    if(n) select(n); else closePanel();
});
cv.addEventListener('dblclick', function(e){
    var p = local(e), n = nodeAt(p.x, p.y);
    if(!n){ focusSet = null; alpha = 1; fit(); KM.toast('Volledige matrix'); return; }
    focusOn(n);
});
cv.addEventListener('wheel', function(e){
    e.preventDefault();
    var p = local(e);
    var f = Math.exp(-e.deltaY * .0015);
    var k2 = KM.clamp(target.k * f, .25, 3.4);
    var ratio = k2 / target.k;
    target.x = p.x - W/2 - (p.x - W/2 - target.x) * ratio;
    target.y = p.y - H/2 - (p.y - H/2 - target.y) * ratio;
    target.k = k2;
    $('#zv').textContent = Math.round(k2 * 100) + '%';
}, { passive:false });

var pinch = null;
cv.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){ pinch = { d:dist(e.touches), k:target.k }; return; }
    var p = local(e), n = nodeAt(p.x, p.y);
    if(n){ dragging = n; select(n); }
    else panning = { x:p.x, y:p.y, vx:view.x, vy:view.y };
}, { passive:true });
cv.addEventListener('touchmove', function(e){
    if(pinch && e.touches.length === 2){
        e.preventDefault();
        target.k = KM.clamp(pinch.k * (dist(e.touches) / pinch.d), .25, 3.4);
        $('#zv').textContent = Math.round(target.k * 100) + '%';
        return;
    }
    var p = local(e);
    if(dragging){
        e.preventDefault();
        dragging.x = (p.x - W/2 - view.x) / view.k;
        dragging.y = (p.y - H/2 - view.y) / view.k;
        alpha = Math.max(alpha, .3);
    }else if(panning){
        e.preventDefault();
        target.x = view.x = panning.vx + (p.x - panning.x);
        target.y = view.y = panning.vy + (p.y - panning.y);
    }
}, { passive:false });
cv.addEventListener('touchend', function(){ dragging = null; panning = null; pinch = null; });
function dist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

/* =========================================================
   5. Detailpaneel
   ========================================================= */
function select(n){
    selected = n;
    var T = TYPES[n.t];
    $('#mpIco').textContent = n.icon || T.name.charAt(0);
    $('#mpIco').style.background = n.color;
    $('#mpIco').style.color = B.contrast(n.color);
    $('#mpTitle').textContent = n.label;
    $('#mpType').textContent = T.name;

    var body = '', r = n.ref || {};

    if(n.t === 'goal'){
        var pct = KM.q.progress(r.id);
        var ts = KM.q.tasksOfGoal(r.id);
        body += '<div class="mp-sec"><div class="label">Voortgang</div>' +
            '<div style="display:flex;align-items:center;gap:16px;">' +
            V.ring(pct, 62, 6, n.color, pct + '%') +
            '<div class="mini-stat"><div><b>' + ts.filter(function(t){ return t.status === 'done'; }).length + '</b><span>af</span></div>' +
            '<div><b>' + ts.length + '</b><span>taken</span></div>' +
            '<div><b>' + KM.q.projectsOfGoal(r.id).length + '</b><span>projecten</span></div></div></div></div>';
        if(r.why) body += sec('Waarom', '<p style="font-size:13.5px;color:var(--text-soft);line-height:1.65;">' + esc(r.why) + '</p>');
        if(r.due) body += sec('Streefdatum', pill(KM.fmtDate(r.due), n.color));
    }
    if(n.t === 'project'){
        var pp = KM.q.projectProgress(r.id);
        body += sec('Voortgang', V.stack({ items:[
            { label:'Af', value:KM.q.tasksOfProject(r.id).filter(function(t){ return t.status === 'done'; }).length, color:n.color },
            { label:'Open', value:KM.q.tasksOfProject(r.id).filter(function(t){ return t.status !== 'done'; }).length, color:'#d8d6cf' }
        ], big:pp + '%', small:'afgerond', h:12 }));
        if(r.due) body += sec('Deadline', pill(KM.fmtDate(r.due), n.color));
    }
    if(n.t === 'task'){
        var pr = KM.PRIOS.filter(function(x){ return x.id === r.prio; })[0] || KM.PRIOS[2];
        var en = KM.ENERGY.filter(function(x){ return x.id === r.energy; })[0] || KM.ENERGY[1];
        body += sec('Status', pill(pr.name, pr.color) + ' ' + pill(en.icon + ' ' + en.name, '#8f8d85') +
            (r.status === 'done' ? ' ' + pill('afgerond', '#3f8f5c') : ''));
        if(r.due) body += sec('Deadline', pill(KM.fmtDate(r.due), KM.dayDiff(r.due) < 0 ? '#d1503f' : n.color));
        if(r.notes) body += sec('Notitie', '<p style="font-size:13.5px;color:var(--text-soft);line-height:1.65;">' + esc(r.notes) + '</p>');
    }
    if(n.t === 'habit'){
        body += sec('Reeks', '<div style="display:flex;align-items:center;gap:16px;">' +
            V.ring(Math.min(100, KM.q.streak(r) * 5), 62, 6, n.color, String(KM.q.streak(r))) +
            '<div class="mini-stat"><div><b>' + KM.q.streak(r) + '</b><span>op rij</span></div>' +
            '<div><b>' + Object.keys(r.log || {}).length + '</b><span>totaal</span></div></div></div>');
    }
    if(n.t === 'area'){
        body += sec('Inhoud', '<div class="mini-stat">' +
            '<div><b>' + D.goals.filter(function(g){ return g.area === r.id; }).length + '</b><span>doelen</span></div>' +
            '<div><b>' + D.projects.filter(function(p){ return p.area === r.id; }).length + '</b><span>projecten</span></div>' +
            '<div><b>' + D.tasks.filter(function(t){ return t.area === r.id; }).length + '</b><span>taken</span></div></div>');
    }
    if(n.t === 'page') body += sec('Bron', '<p style="font-size:13.5px;color:var(--text-soft);">Pagina uit je Notion-werkruimte</p>');

    var nb = links.filter(function(l){ return l.s === n.id || l.t === n.id; })
                  .map(function(l){ return byId[l.s === n.id ? l.t : l.s]; }).filter(Boolean);
    if(nb.length){
        body += '<div class="mp-sec"><div class="label">Verbonden — ' + nb.length + '</div>' +
            nb.map(function(x){
                return '<div class="mp-link" data-go="' + x.id + '"><span class="d" style="background:' + x.color + '"></span>' +
                    '<span>' + esc(x.label) + '</span><small>' + TYPES[x.t].name + '</small></div>';
            }).join('') + '</div>';
    }

    var acts = '';
    if(n.t === 'task' || n.t === 'goal' || n.t === 'project')
        acts += '<a class="btn ghost sm" href="life-os.html#' + (n.t === 'task' ? 'today' : n.t === 'goal' ? 'goals' : 'projects') + '">Open in Life OS</a> ';
    if(n.href) acts += '<a class="btn ghost sm" href="' + n.href + '">Open pagina</a> ';
    acts += '<button class="btn ghost sm" id="mpFocus">Focus hierop</button>';
    body += '<div class="mp-sec" style="display:flex;gap:7px;flex-wrap:wrap;">' + acts + '</div>';

    $('#mpBody').innerHTML = body;
    $('#panel').classList.add('on');
    V.animate($('#mpBody'));
    $$('[data-go]').forEach(function(el){
        el.onclick = function(){ var x = byId[el.dataset.go]; if(x){ select(x); centerOn(x); } };
    });
    if($('#mpFocus')) $('#mpFocus').onclick = function(){ focusOn(n); };
    KM.track('matrix_select', { type:n.t });
}
function sec(label, html){ return '<div class="mp-sec"><div class="label">' + label + '</div>' + html + '</div>'; }
function pill(txt, color){
    var c = (color && color.charAt(0) === '#') ? color : '#8f8d85';
    return '<span class="tag" style="background:' + hexA(c, .16) + ';color:' + c + '">' + esc(txt) + '</span>';
}
function closePanel(){ selected = null; $('#panel').classList.remove('on'); }
$('#mpClose').onclick = closePanel;

function focusOn(n){
    focusSet = neighbours(n.id);
    Object.keys(focusSet).slice().forEach(function(id){
        var s = neighbours(id); Object.keys(s).forEach(function(k){ focusSet[k] = true; });
    });
    alpha = 1;
    setTimeout(fit, 420);
    KM.toast('Ingezoomd op ' + n.label + ' — dubbelklik leegte om terug te gaan');
}
function centerOn(n){ target.x = -n.x * target.k; target.y = -n.y * target.k; }
function fit(){
    var vis = nodes.filter(visible);
    if(!vis.length) return;
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    vis.forEach(function(n){ minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); });
    var w = Math.max(1, maxX - minX + 190), h = Math.max(1, maxY - minY + 190);
    target.k = KM.clamp(Math.min(W / w, H / h), .28, 1.5);
    target.x = -((minX + maxX)/2) * target.k;
    target.y = -((minY + maxY)/2) * target.k;
    $('#zv').textContent = Math.round(target.k * 100) + '%';
}

/* =========================================================
   6. Bediening
   ========================================================= */
function drawFilters(){
    $('#filters').innerHTML = Object.keys(TYPES).map(function(k){
        var n = nodes.filter(function(x){ return x.t === k; }).length;
        if(!n) return '';
        return '<button class="fchip' + (filters[k] ? ' on' : '') + '" data-t="' + k + '">' +
            '<span class="d"></span>' + TYPES[k].name + ' <b style="font-weight:600;opacity:.6">' + n + '</b></button>';
    }).join('');
    $$('#filters .fchip').forEach(function(b){
        b.onclick = function(){
            filters[b.dataset.t] = !filters[b.dataset.t];
            b.classList.toggle('on', filters[b.dataset.t]);
            alpha = Math.max(alpha, .5);
        };
    });
}
function drawLegend(){
    $('#legend').innerHTML = '<div class="label" style="margin-bottom:10px;">Levensgebieden</div>' +
        KM.AREAS.map(function(a){
            var n = nodes.filter(function(x){ return x.color === a.hex; }).length;
            return '<div class="lg"><span class="d" style="background:' + a.hex + '"></span>' +
                esc(a.name.split(' ')[0]) + '<small>' + n + '</small></div>';
        }).join('') +
        '<div class="label" style="margin-top:12px;" id="lgCount">' + nodes.length + ' knopen · ' + links.length + ' verbindingen</div>' +
        '<div class="label" id="lgLast" style="margin-top:4px;">—</div>';
}

$('#q').addEventListener('input', function(e){ query = e.target.value.toLowerCase().trim(); alpha = Math.max(alpha, .4); });
$('#zIn').onclick  = function(){ target.k = KM.clamp(target.k * 1.3, .25, 3.4); $('#zv').textContent = Math.round(target.k*100)+'%'; };
$('#zOut').onclick = function(){ target.k = KM.clamp(target.k / 1.3, .25, 3.4); $('#zv').textContent = Math.round(target.k*100)+'%'; };
$('#zFit').onclick = function(){ focusSet = null; fit(); };
$('#reheat').onclick = function(){
    nodes.forEach(function(n){ n.x = Math.random()*520 - 260; n.y = Math.random()*520 - 260; n.vx = n.vy = 0; });
    alpha = 1; setTimeout(fit, 900); KM.toast('Opnieuw geschikt');
};
$('#snap').onclick = function(){
    var a = document.createElement('a');
    a.download = 'mind-matrix-' + KM.iso() + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
    KM.toast('PNG gedownload');
};

window.addEventListener('resize', resize);
new MutationObserver(readTheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

L.on('data', function(){
    D = OS.data;
    build(); drawFilters(); drawLegend();
    alpha = Math.max(alpha, .45);
    KM.toast('Matrix bijgewerkt');
});
L.every(5, function(){
    var el = $('#lgCount'); if(!el) return;
    el.textContent = nodes.filter(visible).length + ' zichtbaar · ' + links.length + ' verbindingen';
    var last = L.activity(1)[0], el2 = $('#lgLast');
    if(el2) el2.textContent = last ? (last.text.slice(0,24) + ' · ' + L.ago(last.at)) : 'nog geen activiteit';
});

build(); resize(); drawFilters(); drawLegend();
setTimeout(fit, 800);
tick();

window.MX = { nodes:nodes, links:links, parts:parts, select:select, fit:fit, build:build,
              spawn:spawnParts, drawParts:drawParts, onLink:onLink, view:view, target:target, TYPES:TYPES };
}
</script>
