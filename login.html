<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KM.OS — toegang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Twee vlakken: links het beeld, rechts de vorm.
   Verder niets — geen raster, geen ruis, geen badges.
   ========================================================= */
:root{
    --bg:#f4f3ef;
    --paper:#ffffff;
    --ink:#0d0d0d;
    --muted:#b6b4ac;
    --gray:#6f6d66;
    --line:#e4e2d9;
    --accent:#c6ff4a;
    --accent-ink:#3f5a17;
    --danger:#c0432f;
    --ease:cubic-bezier(.16,1,.3,1);
    --spring:cubic-bezier(.34,1.56,.44,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;
    -webkit-font-smoothing:antialiased;letter-spacing:-.011em;
    overflow:hidden;
}
button,input{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}

.stage{
    display:grid;grid-template-columns:1.04fr .96fr;
    height:100dvh;min-height:100%;
}

/* ---------- links: het beeld ---------- */
.art{
    position:relative;background:var(--ink);overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:34px 36px;
    padding-left:max(36px, env(safe-area-inset-left));
}
#ridge{position:absolute;inset:0;display:block;width:100%;height:100%;}
.art > *{position:relative;z-index:2;}
.art-top,.art-bot{display:flex;align-items:center;gap:14px;}
.wordmark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;
    letter-spacing:-.045em;color:#fff;text-decoration:none;
}
.wordmark i{color:var(--accent);font-style:normal;}
.cap{
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,255,255,.34);
}
.art-bot .cap + .cap{margin-left:auto;}
.art-bot .dash{width:22px;height:1px;background:rgba(255,255,255,.2);}

/* ---------- rechts: de vorm ---------- */
.side{
    display:grid;place-items:center;padding:40px 32px;
    padding-right:max(32px, env(safe-area-inset-right));
}
.panel{width:min(340px,100%);}

.mark{
    display:block;
    opacity:0;transform:scale(.8) translateY(8px);
    animation:pop .85s var(--spring) .18s forwards;
}
@keyframes pop{to{opacity:1;transform:none;}}

h1{
    font-family:'Space Grotesk',sans-serif;font-size:33px;font-weight:600;
    letter-spacing:-.04em;line-height:1.1;margin-top:26px;
    opacity:0;animation:up .8s var(--ease) .3s forwards;
}
h1 i{color:var(--accent-ink);font-style:normal;}
.sub{
    margin-top:7px;color:var(--gray);font-size:14.5px;
    opacity:0;animation:up .8s var(--ease) .38s forwards;
}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

form{margin-top:30px;opacity:0;animation:up .8s var(--ease) .46s forwards;}

/* één veld, geen doos eromheen — alleen een lijn die oplicht */
.field{position:relative;display:flex;align-items:center;}
.field input{
    flex:1;min-width:0;background:transparent;border:0;outline:none;
    padding:12px 44px 12px 0;font-size:16px;
    font-family:'Space Mono',monospace;letter-spacing:.24em;
}
/* 16px, net als het veld zelf — anders zoomt iOS bij focus in. */
.field input::placeholder{
    letter-spacing:.02em;color:var(--muted);
    font-family:'Inter',sans-serif;font-size:16px;
}
.rule{position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--line);}
.rule::after{
    content:'';position:absolute;inset:0;background:var(--ink);
    transform:scaleX(0);transform-origin:left;
    transition:transform .5s var(--ease);
}
.field:focus-within .rule::after{transform:scaleX(1);}
.field.bad .rule::after{background:var(--danger);transform:scaleX(1);}
.eye{
    position:absolute;right:-6px;width:36px;height:36px;border-radius:50%;border:0;
    background:transparent;color:var(--muted);display:grid;place-items:center;
    transition:color .22s ease,background .22s ease,transform .3s var(--spring);
}
.eye:hover{color:var(--ink);background:rgba(13,13,13,.05);}
.eye:active{transform:scale(.88);}

.go{
    width:100%;margin-top:22px;border:1px solid var(--ink);border-radius:30px;
    padding:14px 8px 14px 22px;background:var(--ink);color:#fff;
    font-size:15px;font-weight:600;letter-spacing:-.015em;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    transition:background .3s cubic-bezier(.2,.8,.2,1),transform .3s var(--spring),box-shadow .3s ease;
}
.go:hover{background:#222;transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(13,13,13,.9);}
.go:hover .chev{transform:translateX(3px);}
.go:active{transform:scale(.98);transition-duration:.1s;}
.go[disabled]{opacity:.4;pointer-events:none;box-shadow:none;}
.go .chev{
    width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ink);
    display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 26px;
    transition:transform .3s ease;
}
.go .spin{
    width:26px;height:26px;border-radius:50%;flex:0 0 26px;
    border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);
    animation:spin .7s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.go.busy .chev{display:none;}
.go.busy .spin{display:block;}

.msg{
    min-height:18px;margin-top:12px;font-size:13px;color:var(--danger);
    opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s;
}
.msg.on{opacity:1;transform:none;}
.msg.ok{color:var(--accent-ink);}

.meta{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;
    opacity:0;animation:up .8s var(--ease) .56s forwards;
}
.check{display:flex;align-items:center;gap:9px;color:var(--gray);font-size:13px;cursor:pointer;user-select:none;}
.check input{position:absolute;opacity:0;pointer-events:none;}
.box{
    width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);
    display:grid;place-items:center;flex:0 0 18px;
    transition:background .28s var(--spring),border-color .28s ease,transform .28s var(--spring);
}
.check:hover .box{border-color:var(--muted);}
.check input:focus-visible + .box{box-shadow:0 0 0 3px rgba(198,255,74,.55);}
.check input:checked + .box{background:var(--accent);border-color:var(--accent-ink);transform:scale(1.08);}
.box svg{opacity:0;color:var(--accent-ink);transition:opacity .18s;}
.check input:checked + .box svg{opacity:1;}
.link{
    background:none;border:0;color:var(--muted);font-size:13px;
    transition:color .2s;
}
.link:hover{color:var(--ink);}

.back{
    display:inline-flex;align-items:center;gap:8px;margin-top:34px;
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);text-decoration:none;
    opacity:0;animation:up .8s var(--ease) .66s forwards;
    transition:color .2s;
}
.back:hover{color:var(--ink);}
.back .arr{transition:transform .3s var(--ease);}
.back:hover .arr{transform:translateX(-3px);}

/* ---------- ontgrendelen: het ink-vlak neemt het scherm over ---------- */
.wipe{
    position:fixed;inset:0;z-index:60;background:var(--ink);pointer-events:none;
    transform:scaleX(0);transform-origin:left;
}
.wipe::after{
    content:'';position:absolute;top:0;bottom:0;right:0;width:3px;
    background:var(--accent);box-shadow:0 0 30px 6px rgba(198,255,74,.6);
}
.wipe.on{animation:wipe .72s cubic-bezier(.72,0,.2,1) .1s forwards;}
@keyframes wipe{to{transform:scaleX(1);}}
.stage.unlock .side{opacity:0;transform:translateY(-8px);transition:opacity .35s ease,transform .5s var(--ease);}

/* ---------- kleiner scherm: beeld als band boven de vorm ---------- */
@media(max-width:900px){
    .stage{grid-template-columns:1fr;grid-template-rows:minmax(190px,30dvh) 1fr;}
    .art{padding:20px 22px;padding-left:max(22px, env(safe-area-inset-left));}
    .side{padding:30px 24px calc(30px + env(safe-area-inset-bottom));align-items:start;}
    .panel{width:min(360px,100%);}
    h1{font-size:29px;margin-top:20px;}
    .back{margin-top:26px;}
}
@media(max-width:900px) and (max-height:620px){
    .stage{grid-template-rows:0 1fr;}
    .art{display:none;}
    .side{align-items:center;}
}
@media(max-width:380px){
    .art-bot .cap:first-of-type{display:none;}
}
@media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
    .mark,h1,.sub,form,.meta,.back{opacity:1 !important;transform:none !important;}
}
</style>
</head>
<body>

<div class="wipe" id="wipe"></div>

<div class="stage" id="stage">

    <div class="art">
        <canvas id="ridge"></canvas>
        <div class="art-top">
            <a class="wordmark" href="index.html">KM<i>.</i>dev</a>
        </div>
        <div class="art-bot">
            <span class="cap">Persoonlijk besturingssysteem</span>
            <span class="dash"></span>
            <span class="cap" id="clock">--:--</span>
        </div>
    </div>

    <div class="side">
        <div class="panel">
            <div class="mark" id="mark"></div>

            <h1>KM<i>.</i>OS</h1>
            <p class="sub">Alleen jij komt hier binnen.</p>

            <form id="form" autocomplete="off">
                <div class="field" id="field">
                    <input type="password" id="pw" placeholder="Toegangssleutel" autocomplete="current-password" spellcheck="false">
                    <button type="button" class="eye" id="eye" aria-label="Toon sleutel">
                        <svg id="eyeIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
                    </button>
                    <span class="rule"></span>
                </div>

                <button class="go" type="submit" id="go">
                    <span class="lbl">Ontgrendel</span>
                    <span class="chev">→</span>
                    <span class="spin"></span>
                </button>

                <p class="msg" id="msg"></p>
            </form>

            <div class="meta">
                <label class="check">
                    <input type="checkbox" id="remember" checked>
                    <span class="box"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>
                    Ingelogd blijven
                </label>
                <button type="button" class="link" id="hint">Sleutel vergeten?</button>
            </div>

            <a class="back" href="index.html"><span class="arr">←</span> Terug naar de site</a>
        </div>
    </div>

</div>

<script src="os/km-brand.js"></script>
<script>
/* =========================================================
   1. Het beeld — een landschap van ribbels
   Vierendertig lijnen over elkaar. Elke lijn wordt van onderen
   dichtgevuld met de achtergrondkleur, waardoor de voorste
   lijnen de achterste afdekken; dat geeft de diepte.
   De vorm zelf is een som van drie sinussen die elk op een
   eigen snelheid schuiven, ingesnoerd door een klokcurve.
   De piek volgt je muis.
   ========================================================= */
(function(){
    var cv = document.getElementById('ridge');
    if(!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    if(!ctx) return;

    var W = 0, H = 0, dpr = 1;
    var LINES = 34, STEP = 5;
    var peak = .5, peakTarget = .5;
    var t0 = performance.now();
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var grad = null;

    function size(){
        var r = cv.getBoundingClientRect();
        W = Math.max(1, r.width); H = Math.max(1, r.height);
        dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        /* in een lage band passen minder ribbels, anders wordt het een kluwen */
        LINES = Math.max(14, Math.min(34, Math.round(H / 26)));
        grad = null;
    }

    /* verloop over de breedte: fel op de piek, gedempt aan de randen */
    function stroke(){
        if(grad) return grad;
        grad = ctx.createLinearGradient(0, 0, W, 0);
        grad.addColorStop(0,  'rgba(198,255,74,.24)');
        grad.addColorStop(.3, 'rgba(198,255,74,.50)');
        grad.addColorStop(.5, 'rgba(214,255,120,1)');
        grad.addColorStop(.7, 'rgba(198,255,74,.50)');
        grad.addColorStop(1,  'rgba(198,255,74,.24)');
        return grad;
    }

    function frame(now){
        var time = still ? 8.4 : (now - t0) / 1000;
        peak += (peakTarget - peak) * .045;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(0, 0, W, H);

        /* ruimte onderaan, anders lopen de voorste ribbels het beeld uit */
        var padT = H * .17, padB = H * .30;
        var span = H - padT - padB;
        var maxAmp = Math.min(H * .24, 175);
        var g = stroke();
        var crestY = H * .5, crestAt = Math.round(LINES * .8);

        for(var i = 0; i < LINES; i++){
            var d = i / (LINES - 1);              // 0 = achter, 1 = voor
            var baseY = padT + d * span;
            var top = 1e9;
            ctx.beginPath();

            for(var x = 0; x <= W; x += STEP){
                var u = W ? x / W : 0;
                var e = Math.exp(-Math.pow((u - peak) / .3, 2));       // klokcurve
                /* .12 blijft over buiten de curve, zodat ook de vlakke delen leven */
                var amp = maxAmp * (.12 + .88 * e) * (.34 + .66 * d);
                var y = baseY - amp * (
                    Math.sin(u * 6.4 + time * .55 + i * .3) * .5 +
                    Math.sin(u * 12.9 - time * .4 + i * .17) * .28 +
                    Math.sin(u * 3.1 + time * .23 + i * .43) * .36
                );
                if(y < top) top = y;
                if(x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            if(i === crestAt) crestY = top;

            /* dichtvullen tot onder de canvas, zodat deze lijn de vorige afdekt */
            ctx.lineTo(W, H + 4); ctx.lineTo(0, H + 4); ctx.closePath();
            ctx.fillStyle = '#0d0d0d';
            ctx.fill();

            ctx.globalAlpha = .30 + .70 * d;
            ctx.lineWidth = 1 + d * .8;
            ctx.strokeStyle = g;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        /* zachte gloed over de kam — optellen, zodat de ink eronder blijft */
        var R = W * .3;
        var bloom = ctx.createRadialGradient(peak * W, crestY, 0, peak * W, crestY, R);
        bloom.addColorStop(0, 'rgba(154,214,52,.16)');
        bloom.addColorStop(1, 'rgba(154,214,52,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = bloom;
        ctx.fillRect(peak * W - R, crestY - R, R * 2, R * 2);
        ctx.globalCompositeOperation = 'source-over';

        if(!still) raf = requestAnimationFrame(frame);
    }

    var raf = 0;
    function start(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }

    size(); start();
    addEventListener('resize', function(){ size(); if(still) start(); });
    document.addEventListener('visibilitychange', function(){
        if(document.hidden) cancelAnimationFrame(raf);
        else { t0 = performance.now() - 8400; start(); }
    });
    cv.parentNode.addEventListener('pointermove', function(e){
        var r = cv.getBoundingClientRect();
        peakTarget = Math.max(.12, Math.min(.88, (e.clientX - r.left) / r.width));
    });
    cv.parentNode.addEventListener('pointerleave', function(){ peakTarget = .5; });
})();

/* =========================================================
   2. Toegang tot KM.OS
   Alleen de SHA-256 hash staat hier. Standaard: kmdev2026
   ========================================================= */
const HASH = '0d6a57555dee0ea842d6740e76be795a53e81a60dd4d066762fe76ee22b9f1fd';
const SESSION = 'kmdev_session';
const MAX = 5, LOCK = 30000;

const $ = id => document.getElementById(id);
const form = $('form'), field = $('field'), pw = $('pw'), msg = $('msg'), go = $('go');

$('mark').innerHTML = KMbrand.mark(52);

async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* al ingelogd? */
(function(){
    try{
        const s = JSON.parse(localStorage.getItem(SESSION) || 'null');
        if(s && s.exp > Date.now()) location.replace('os/index.html');
    }catch(e){}
})();

function tick(){
    const d = new Date();
    $('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 20000);

$('eye').onclick = () => {
    const on = pw.type === 'password';
    pw.type = on ? 'text' : 'password';
    $('eyeIcon').innerHTML = on
        ? '<path d="M3 3l18 18M10.6 10.7A2.7 2.7 0 0 0 12 14.7c.7 0 1.4-.3 1.9-.8"/><path d="M6.5 6.8C4 8.4 2 12 2 12s3.6 6.5 10 6.5c1.8 0 3.3-.5 4.6-1.2M19.2 15.4C21 13.8 22 12 22 12s-3.6-6.5-10-6.5c-.9 0-1.7.1-2.4.3"/>'
        : '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/>';
    pw.focus();
};
$('hint').onclick = () => show('De sleutel staat als hash in de broncode. Standaard: kmdev2026', true);
pw.addEventListener('input', () => { field.classList.remove('bad'); msg.classList.remove('on'); });

function show(text, ok){
    msg.textContent = text;
    msg.classList.toggle('ok', !!ok);
    msg.classList.add('on');
}
function fails(){ return JSON.parse(localStorage.getItem('kmdev_fails') || '{"n":0,"until":0}'); }
function setFails(v){ localStorage.setItem('kmdev_fails', JSON.stringify(v)); }
function lockUI(){
    const f = fails();
    if(f.until > Date.now()){
        go.disabled = true;
        show('Te veel pogingen — wacht ' + Math.ceil((f.until - Date.now())/1000) + 's');
        setTimeout(lockUI, 500);
    }else{
        go.disabled = false;
        if(f.n > 0) show((MAX - f.n) + ' pogingen over');
    }
}
lockUI();

form.addEventListener('submit', async e => {
    e.preventDefault();
    const f = fails();
    if(f.until > Date.now()) return;
    if(!pw.value){ field.classList.add('bad'); show('Vul je sleutel in'); pw.focus(); return; }

    go.classList.add('busy'); go.disabled = true;
    const h = await sha256(pw.value);
    await new Promise(r => setTimeout(r, 420));
    go.classList.remove('busy'); go.disabled = false;

    if(h === HASH){
        setFails({ n:0, until:0 });
        const days = $('remember').checked ? 30 : .5;
        localStorage.setItem(SESSION, JSON.stringify({ exp: Date.now() + days*864e5, at: Date.now() }));
        sessionStorage.setItem('kmdev_boot', '1');       // laat KM.OS de opstartanimatie spelen
        unlock();
    }else{
        f.n++;
        if(f.n >= MAX){ f.until = Date.now() + LOCK; f.n = 0; }
        setFails(f);
        field.classList.add('bad');
        show('Onjuiste sleutel');
        pw.select();
        lockUI();
    }
});

function unlock(){
    show('Welkom terug', true);
    $('stage').classList.add('unlock');
    $('wipe').classList.add('on');
    setTimeout(() => location.href = 'os/index.html', 780);
}

window.addEventListener('load', () => setTimeout(() => pw.focus(), 700));
</script>
</body>
</html>
