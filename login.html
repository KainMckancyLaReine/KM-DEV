<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KM.OS — toegang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
    --ink:#0d0d0d;
    --accent:#c6ff4a;
    --accent-ink:#3f5a17;
    --spring:cubic-bezier(.34,1.56,.44,1);
    --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;}
body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#08080a;color:#fff;overflow:hidden;
    -webkit-font-smoothing:antialiased;letter-spacing:-.011em;
    display:grid;place-items:center;
}
button,input{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}

/* ---------- achtergrond ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;}
.bg i{position:absolute;display:block;border-radius:50%;filter:blur(80px);}
.bg i:nth-child(1){width:58vw;height:58vw;left:-14%;top:-26%;background:#c6ff4a;opacity:.20;animation:f1 22s ease-in-out infinite alternate;}
.bg i:nth-child(2){width:46vw;height:46vw;right:-12%;bottom:-22%;background:#2383e2;opacity:.16;animation:f2 28s ease-in-out infinite alternate;}
.bg i:nth-child(3){width:34vw;height:34vw;left:42%;top:32%;background:#8b5cf6;opacity:.11;animation:f3 34s ease-in-out infinite alternate;}
@keyframes f1{to{transform:translate3d(7vw,5vh,0) scale(1.16);}}
@keyframes f2{to{transform:translate3d(-6vw,-6vh,0) scale(1.12);}}
@keyframes f3{to{transform:translate3d(4vw,-5vh,0) scale(1.22);}}
.grid{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 20%,transparent 88%);
    -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 20%,transparent 88%);
}
.noise{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.032;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ---------- kaart ---------- */
.wrap{position:relative;z-index:5;width:min(420px,90vw);text-align:center;}
.mark{
    display:inline-block;margin-bottom:26px;
    opacity:0;transform:scale(.72) translateY(14px);
    animation:pop .95s var(--spring) .1s forwards;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));
}
@keyframes pop{to{opacity:1;transform:none;}}
h1{
    font-family:'Space Grotesk',sans-serif;font-size:31px;font-weight:700;letter-spacing:-.045em;
    opacity:0;animation:up .8s var(--ease) .34s forwards;
}
.sub{
    margin-top:9px;color:rgba(255,255,255,.42);font-size:14.5px;line-height:1.55;
    opacity:0;animation:up .8s var(--ease) .44s forwards;
}
@keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

.card{
    margin-top:30px;padding:8px;border-radius:26px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.10);
    opacity:0;transform:translateY(18px);
    animation:up .9s var(--ease) .54s forwards;
}
.card.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(5px);}30%,50%,70%{transform:translateX(-10px);}40%,60%{transform:translateX(10px);}}

.field{position:relative;display:flex;align-items:center;}
.field input{
    flex:1;background:transparent;border:0;outline:none;
    padding:17px 54px 17px 20px;font-size:16px;
    font-family:'Space Mono',monospace;letter-spacing:.22em;
}
.field input::placeholder{letter-spacing:.06em;color:rgba(255,255,255,.24);font-family:'Inter',sans-serif;}
.eye{
    position:absolute;right:9px;width:38px;height:38px;border-radius:12px;border:0;background:transparent;
    color:rgba(255,255,255,.38);display:grid;place-items:center;transition:all .25s var(--spring);
}
.eye:hover{color:#fff;background:rgba(255,255,255,.09);}
.eye:active{transform:scale(.9);}

.go{
    width:100%;margin-top:8px;border:0;border-radius:19px;padding:16px;
    background:var(--accent);color:var(--ink);
    font-size:15.5px;font-weight:600;letter-spacing:-.015em;
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .4s var(--spring), box-shadow .3s, filter .2s;
    box-shadow:0 10px 30px -12px rgba(198,255,74,.85);
}
.go:hover{transform:translateY(-2px);box-shadow:0 18px 40px -14px rgba(198,255,74,.95);}
.go:active{transform:scale(.97);transition-duration:.1s;}
.go[disabled]{opacity:.45;pointer-events:none;box-shadow:none;}
.go .spin{width:16px;height:16px;border:2px solid rgba(13,13,13,.22);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.go.busy .lbl{display:none;} .go.busy .spin{display:block;}

.msg{
    min-height:20px;margin-top:14px;font-size:13.5px;color:#ff7b73;
    opacity:0;transition:opacity .25s;
}
.msg.on{opacity:1;}
.msg.ok{color:var(--accent);}

.row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;
    opacity:0;animation:up .8s var(--ease) .66s forwards;
}
.check{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.5);font-size:13.5px;user-select:none;cursor:pointer;}
.check input{display:none;}
.box{
    width:19px;height:19px;border-radius:7px;border:1px solid rgba(255,255,255,.22);
    display:grid;place-items:center;transition:all .3s var(--spring);
}
.check input:checked + .box{background:var(--accent);border-color:var(--accent);transform:scale(1.05);}
.box svg{opacity:0;color:var(--ink);transition:opacity .2s;} .check input:checked + .box svg{opacity:1;}
.link{background:none;border:0;color:rgba(255,255,255,.38);font-size:13.5px;transition:color .2s;}
.link:hover{color:var(--accent);}

.foot{
    margin-top:32px;display:flex;align-items:center;justify-content:center;gap:16px;
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.24);opacity:0;animation:up .8s var(--ease) .8s forwards;
}
.foot a{color:inherit;text-decoration:none;transition:color .2s;}
.foot a:hover{color:rgba(255,255,255,.6);}
.foot .sep{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.2);}

/* ---------- ontgrendel-overgang ---------- */
.wrap.unlock{animation:unlockOut .8s var(--ease) forwards;}
@keyframes unlockOut{
    30%{transform:scale(.97);}
    100%{opacity:0;transform:scale(1.5);filter:blur(22px);}
}
.flash{
    position:fixed;inset:0;z-index:20;background:var(--accent);opacity:0;pointer-events:none;
}
.flash.on{animation:flash .9s var(--ease) forwards;}
@keyframes flash{0%{opacity:0;}18%{opacity:.9;}100%{opacity:0;}}

@media(max-width:520px){
    .wrap{width:min(400px,92vw);}
    h1{font-size:26px;}
    .field input{padding:15px 50px 15px 17px;font-size:16px;}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>
<body>

<div class="bg"><i></i><i></i><i></i></div>
<div class="grid"></div>
<div class="noise"></div>
<div class="flash" id="flash"></div>

<div class="wrap" id="wrap">
    <div class="mark" id="mark"></div>
    <h1>KM.OS</h1>
    <p class="sub">Je persoonlijke besturingssysteem.<br>Alleen jij komt hier binnen.</p>

    <form class="card" id="card" autocomplete="off">
        <div class="field">
            <input type="password" id="pw" placeholder="Toegangssleutel" autocomplete="current-password" spellcheck="false">
            <button type="button" class="eye" id="eye" aria-label="Toon sleutel">
                <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
            </button>
        </div>
        <button class="go" type="submit" id="go">
            <span class="lbl">Ontgrendel</span>
            <span class="spin"></span>
        </button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="row">
        <label class="check">
            <input type="checkbox" id="remember" checked>
            <span class="box"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>
            Ingelogd blijven
        </label>
        <button type="button" class="link" id="hint">Sleutel vergeten?</button>
    </div>

    <div class="foot">
        <a href="index.html">← Website</a>
        <span class="sep"></span>
        <span id="clock">--:--</span>
        <span class="sep"></span>
        <span>SHA-256</span>
    </div>
</div>

<script src="os/km-brand.js"></script>
<script>
/* =========================================================
   Toegang tot KM.OS
   Alleen de SHA-256 hash staat hier. Standaard: kmdev2026
   ========================================================= */
const HASH = '0d6a57555dee0ea842d6740e76be795a53e81a60dd4d066762fe76ee22b9f1fd';
const SESSION = 'kmdev_session';
const MAX = 5, LOCK = 30000;

const $ = id => document.getElementById(id);
const card = $('card'), pw = $('pw'), msg = $('msg'), go = $('go');

$('mark').innerHTML = KMbrand.mark(84);

async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* al ingelogd? */
(function(){
    try{
        const s = JSON.parse(localStorage.getItem(SESSION) || 'null');
        if(s && s.exp > Date.now()) location.replace('os/index.html');
    }catch(e){}
})();

function tick(){
    const d = new Date();
    $('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 20000);

$('eye').onclick = () => {
    const on = pw.type === 'password';
    pw.type = on ? 'text' : 'password';
    $('eyeIcon').innerHTML = on
        ? '<path d="M3 3l18 18M10.6 10.7A2.7 2.7 0 0 0 12 14.7c.7 0 1.4-.3 1.9-.8"/><path d="M6.5 6.8C4 8.4 2 12 2 12s3.6 6.5 10 6.5c1.8 0 3.3-.5 4.6-1.2M19.2 15.4C21 13.8 22 12 22 12s-3.6-6.5-10-6.5c-.9 0-1.7.1-2.4.3"/>'
        : '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/>';
    pw.focus();
};
$('hint').onclick = () => show('De sleutel staat als hash in de broncode. Standaard: kmdev2026', true);
pw.addEventListener('input', () => { card.classList.remove('shake'); msg.classList.remove('on'); });

function show(text, ok){
    msg.textContent = text;
    msg.classList.toggle('ok', !!ok);
    msg.classList.add('on');
}
function fails(){ return JSON.parse(localStorage.getItem('kmdev_fails') || '{"n":0,"until":0}'); }
function setFails(v){ localStorage.setItem('kmdev_fails', JSON.stringify(v)); }
function lockUI(){
    const f = fails();
    if(f.until > Date.now()){
        go.disabled = true;
        show('Te veel pogingen — wacht ' + Math.ceil((f.until - Date.now())/1000) + 's');
        setTimeout(lockUI, 500);
    }else{
        go.disabled = false;
        if(f.n > 0) show((MAX - f.n) + ' pogingen over');
    }
}
lockUI();

card.addEventListener('submit', async e => {
    e.preventDefault();
    const f = fails();
    if(f.until > Date.now()) return;
    if(!pw.value){ card.classList.add('shake'); show('Vul je sleutel in'); return; }

    go.classList.add('busy'); go.disabled = true;
    const h = await sha256(pw.value);
    await new Promise(r => setTimeout(r, 480));
    go.classList.remove('busy'); go.disabled = false;

    if(h === HASH){
        setFails({ n:0, until:0 });
        const days = $('remember').checked ? 30 : .5;
        localStorage.setItem(SESSION, JSON.stringify({ exp: Date.now() + days*864e5, at: Date.now() }));
        sessionStorage.setItem('kmdev_boot', '1');       // laat KM.OS de opstartanimatie spelen
        unlock();
    }else{
        f.n++;
        if(f.n >= MAX){ f.until = Date.now() + LOCK; f.n = 0; }
        setFails(f);
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        show('Onjuiste sleutel');
        pw.select();
        lockUI();
    }
});

function unlock(){
    show('Welkom terug', true);
    $('flash').classList.add('on');
    $('wrap').classList.add('unlock');
    setTimeout(() => location.href = 'os/index.html', 760);
}

window.addEventListener('load', () => setTimeout(() => pw.focus(), 800));
</script>
</body>
</html>
